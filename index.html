     '<div class="row3"><div><div class="hint">Compras</div><b style="font-size:17px">'+(c.compras||0)+'</b></div>'+
     '<div><div class="hint">Total gasto</div><b style="font-size:17px">R$ '+money(c.gasto||0)+'</b></div>'+
     '<div><div class="hint">Ticket médio</div><b style="font-size:17px">R$ '+money(c.compras?(c.gasto/c.compras):0)+'</b></div></div>'+
     '<div class="hint" style="margin-top:9px">Última compra: '+(c.ultima||'—')+'</div></div>':'')+
  '</div>';
  modal(c?'Cliente':'Cadastrar cliente',h,'Salvar',function(){
    var nome=$('clN').value.trim();
    var tel=$('clT').value.trim();
    if(!nome){toast('Informe o nome.');return false;}
    if(soDigitos(tel).length<8){toast('Informe um telefone válido — é ele que identifica o cliente.');return false;}
    var dup=clientePorTel(tel);
    if(dup&&(!c||dup.id!==c.id)){
      if(!confirm('Já existe um cliente com este telefone: "'+dup.nome+'".\nDeseja atualizar o cadastro dele em vez de criar outro?'))return false;
      c=dup;
    }
    var o={nome:nome,tel:tel,rua:$('clR').value.trim(),numero:$('clNu').value.trim(),
      bairro:$('clB2').value.trim(),cidade:$('clC').value.trim(),ref:$('clRef').value.trim()};
    if(c){Object.assign(c,o);PDV.cliente=c;}
    else{o.id=uid('cli');o.compras=0;o.gasto=0;DB.clientes.push(o);PDV.cliente=o;}
    salvar();renderVenda();toast('Cliente salvo.');
    return true;
  });
}

/* ---------- PAGAMENTO ---------- */
var _pagos=[],_totPag=0,_cidadeVenda='',_cupomAtivo=null;
function aplicarCupom(){
  baseCupons();
  var cod=($('pgCup').value||'').trim().toUpperCase();
  if(!cod){toast('Digite o código do cupom.');return;}
  var cp=cupomPorCodigo(cod);
  var canal=(PDV.tipo==='entrega')?'delivery':'pdv';
  var v=cupomValido(cp,_totPag,null,canal);
  if(!v.ok){
    $('cupMsg').innerHTML='<div class="cupErr">'+sv('x2',13)+' '+E(v.msg)+'</div>';
    return;
  }
  if(cp.limiteCliente&&PDV.cliente){
    var us=usosDoCupom(cp.id).filter(function(u){return u.clienteId===PDV.cliente.id}).length;
    if(us>=cp.limiteCliente){
      $('cupMsg').innerHTML='<div class="cupErr">'+sv('x2',13)+' Este cliente já usou o limite deste cupom.</div>';
      return;
    }
  }
  _cupomAtivo=cp;
  $('cupMsg').innerHTML='<div class="cupOk">'+sv('check',13)+' '+E(cp.codigo)+
    ' aplicado — desconto de R$ '+money(valorCupom(cp,_totPag))+'</div>';
  recalcPag();
  toast('Cupom '+cp.codigo+' aplicado.');
}
function tirarCupom(){_cupomAtivo=null;$('cupMsg').innerHTML='';recalcPag();irPagamento();}
/* busca a taxa cadastrada para a cidade do cliente */
function taxaSugerida(){
  return valorCidade((PDV.cliente&&PDV.cliente.cidade)||'');
}
function irPagamento(){
  if(!PDV.comanda.length){toast('Comanda vazia.');return;}
  if(PDV.tipo==='entrega'&&!PDV.cliente){toast('Entrega exige cliente identificado com endereço.');return buscarCliente();}
  var tot=PDV.comanda.reduce(function(a,i){return a+i.total},0);
  _pagos=[];_totPag=tot;_tpDesc='rs';_cupomAtivo=null;
  var h='<div class="mdB">'+
  '<div class="blk" style="margin:0 0 11px;max-width:none"><h3>Resumo</h3>'+
  '<div class="linha"><span>Subtotal</span><b>R$ '+money(tot)+'</b></div>'+
  '<div class="row2" style="margin-top:11px">'+
  (PDV.tipo==='entrega'?
   '<div class="fld2" style="margin:0"><label>Cidade / área de entrega</label>'+
   '<select id="pgCidade"><option value="">Sem área definida</option>'+
   cidadesEntrega().map(function(a){
     return '<option value="'+E(a.cidade)+'" data-v="'+a.valor+'"'+
     ((PDV.cliente&&(PDV.cliente.cidade||'').toLowerCase()===a.cidade.toLowerCase())?' selected':'')+'>'+
     E(a.cidade)+' — R$ '+money(a.valor)+'</option>';}).join('')+
   '</select><div class="hint">A taxa é preenchida pela cidade escolhida.</div></div>'
   :'')+
  '<div class="fld2" style="margin:0"><label>Taxa de entrega</label><div class="cur"><span>R$</span>'+
  '<input id="pgTaxa" type="number" step="0.01" value="'+(PDV.tipo==='entrega'?taxaSugerida():0)+'"></div></div>'+
  '<div class="fld2" style="margin:0"><label>Desconto</label>'+'<div class="descBox">'+'<div class="segm2"><button id="dRS" class="on" onclick="tipoDesc(\'rs\')">R$</button>'+'<button id="dPC" onclick="tipoDesc(\'pc\')">%</button></div>'+'<input id="pgDesc" type="number" step="0.01" value="0"></div>'+'<div class="hint" id="descInfo"></div></div></div>'+
  '<div class="linha tot"><span>Total a pagar</span><span id="pgTot">R$ '+money(tot)+'</span></div></div>'+
  '<div class="blk" style="margin:0 0 11px;max-width:none"><h3>Forma de pagamento</h3>'+
  '<div class="pgGrid">'+FORMAS.map(function(f){
    return '<button class="pgBtn" onclick="addPag(\''+f.id+'\')">'+sv('cash',20)+f.n+'</button>'}).join('')+'</div>'+
  '<div class="hint" style="margin-top:9px">Para dividir a conta, clique em mais de uma forma e ajuste o valor de cada uma.</div>'+
  '<div class="pgLista" id="pgLista"></div></div>'+
  (PDV.tipo==='entrega'?
   '<div class="blk" style="margin:0 0 11px;max-width:none"><h3>Entregador</h3>'+
   ((DB.entregadores||[]).length?
     '<div class="contaGrid">'+(DB.entregadores||[]).map(function(e,i){
       return '<label class="contaBox"><input type="radio" name="pgEnt" value="'+e.id+'"'+((entregadorPadrao()&&entregadorPadrao().id===e.id)||(!entregadorPadrao()&&i===0)?' checked':'')+'>'+
       '<span><b>'+E(e.nome)+'</b><small>'+E(e.tel||'')+'</small></span></label>';}).join('')+'</div>'
     :'<div class="hint">Nenhum entregador cadastrado. Você pode atribuir depois, no quadro de pedidos.</div>')+
   '</div>':'')+
  '<div class="blk" style="margin:0 0 11px;max-width:none"><h3>Cupom de desconto</h3>'+
  '<div class="cupRow">'+
   '<input id="pgCup" placeholder="DIGITE O CÓDIGO" style="text-transform:uppercase;font-weight:700;letter-spacing:.05em">'+
   '<button class="btnP2 ok" onclick="aplicarCupom()">Aplicar</button>'+
   (_cupomAtivo?'<button class="btnP2 rdB" onclick="tirarCupom()">Remover</button>':'')+
  '</div>'+
  '<div id="cupMsg">'+(_cupomAtivo?'<div class="cupOk">'+sv('check',13)+' '+E(_cupomAtivo.codigo)+
   ' aplicado — desconto de R$ '+money(valorCupom(_cupomAtivo,_totPag))+'</div>':'')+'</div></div>'+
  '<div class="blk" style="margin:0;max-width:none">'+
  '<label class="chkL"><input type="checkbox" id="pgFiscal"><span>Gerar cupom fiscal</span></label>'+
  '<label class="chkL"><input type="checkbox" id="pgImp" checked><span>Imprimir via ao finalizar</span></label>'+
  '</div></div>';
  modal('Pagamento',h,'Finalizar venda',function(){
    var taxa=parseFloat($('pgTaxa').value)||0,desc=valorDesconto();
    var final=tot+taxa-desc;
    var somaPg=_pagos.reduce(function(a,p){return a+p.valor},0);
    if(!_pagos.length){toast('Selecione ao menos uma forma de pagamento.');return false;}
    if(Math.abs(somaPg-final)>0.01){toast('Pagamentos somam R$ '+money(somaPg)+' e o total é R$ '+money(final)+'.');return false;}
    var pcs=$('pgCidade');
    _cidadeVenda=pcs?pcs.value:((PDV.cliente&&PDV.cliente.cidade)||'');
    var entSel=document.querySelector('input[name=pgEnt]:checked');
    var fiado=_pagos.filter(function(p){var f=formaPag(p.forma);return f&&f.tipo==='fiado'})
      .reduce(function(a,p){return a+p.valor},0);
    if(fiado>0){
      if(!PDV.cliente){toast('Venda no fiado exige cliente identificado.');return false;}
      var lim=Number(PDV.cliente.limiteFiado)||0;
      var novo=(Number(PDV.cliente.saldoFiado)||0)+fiado;
      if(lim<=0){toast(PDV.cliente.nome+' não tem limite de fiado liberado.');return false;}
      if(novo>lim+0.01){
        toast('Limite de fiado excedido. Saldo ficaria R$ '+money(novo)+' e o limite é R$ '+money(lim)+'.');
        return false;
      }
    }
    finalizarVenda(final,taxa,desc,_pagos.slice(),$('pgFiscal').checked,$('pgImp').checked,entSel?entSel.value:null,fiado);
    return true;
  },'lg');
  $('pgTaxa').oninput=recalcPag;$('pgDesc').oninput=recalcPag;
  var pc=$('pgCidade');
  if(pc)pc.onchange=function(){
    var op=this.options[this.selectedIndex];
    $('pgTaxa').value=op.getAttribute('data-v')||0;
    recalcPag();
  };
  recalcPag();
}
var _tpDesc='rs';
function tipoDesc(t){
  _tpDesc=t;
  $('dRS').classList.toggle('on',t==='rs');
  $('dPC').classList.toggle('on',t==='pc');
  recalcPag();
}
function valorDesconto(){
  var v=parseFloat($('pgDesc').value)||0;
  var d=(_tpDesc==='pc')?+(_totPag*v/100).toFixed(2):v;
  if(_cupomAtivo)d+=valorCupom(_cupomAtivo,_totPag);
  return +d.toFixed(2);
}
function recalcPag(){
  var taxa=parseFloat($('pgTaxa').value)||0,desc=valorDesconto();
  var final=_totPag+taxa-desc;
  var di=$('descInfo');
  if(di)di.textContent=_tpDesc==='pc'
    ?(parseFloat($('pgDesc').value)||0)+'% sobre R$ '+money(_totPag)+' = R$ '+money(desc)
    :(desc?'desconto de R$ '+money(desc):'sem desconto');
  $('pgTot').textContent='R$ '+money(final);
  var pago=_pagos.reduce(function(a,p){return a+p.valor},0);
  $('pgLista').innerHTML=_pagos.map(function(p,i){
    var f=FORMAS.find(function(x){return x.id===p.forma});
    return '<div class="pgLinha"><b>'+f.n+'</b>'+
    '<div class="cur" style="width:126px"><span>R$</span><input type="number" step="0.01" value="'+p.valor+'" data-i="'+i+'" class="pgV"></div>'+
    '<button class="qtBtn rd2" onclick="remPag('+i+')">'+sv('trash',13)+'</button></div>';
  }).join('')+
  (_pagos.length?'<div class="linha" style="margin-top:8px"><span>Falta receber</span><b>R$ '+money(Math.max(0,final-pago))+'</b></div>'+
   (pago>final?'<div class="linha"><span>Troco</span><b>R$ '+money(pago-final)+'</b></div>':''):'');
  var vs=document.querySelectorAll('.pgV');
  for(var i=0;i<vs.length;i++)vs[i].onchange=function(){
    _pagos[this.getAttribute('data-i')].valor=parseFloat(this.value)||0;recalcPag();};
}
function addPag(f){
  var taxa=parseFloat($('pgTaxa').value)||0,desc=valorDesconto();
  var final=_totPag+taxa-desc;
  var pago=_pagos.reduce(function(a,p){return a+p.valor},0);
  _pagos.push({forma:f,valor:Math.max(0,+(final-pago).toFixed(2))});
  recalcPag();
}
function remPag(i){_pagos.splice(i,1);recalcPag();}

function finalizarVenda(total,taxa,desc,pagos,fiscal,imprimir,entregadorId,fiado){
  var ag=new Date();
  var fs2=cfg().fases||[];
  /* venda na frente de caixa já sai entregue — só delivery passa pelo fluxo */
  var primeira;
  if(PDV.tipo==='entrega'){
    primeira=fs2[0]||'aguardando';
  }else{
    primeira=(fs2.indexOf('entregue')>=0)?'entregue':(fs2[fs2.length-1]||'entregue');
  }
  var ped={
    id:uid('ped'),numero:(DB.pedidos.length+1),
    tipo:PDV.tipo,fase:primeira,
    itens:JSON.parse(JSON.stringify(PDV.comanda)),
    clienteId:PDV.cliente?PDV.cliente.id:null,
    clienteNome:PDV.cliente?PDV.cliente.nome:'Consumidor',
    total:total,taxa:taxa,desconto:desc,pagamentos:pagos,fiscal:!!fiscal,
    entregadorId:entregadorId||(PDV.tipo==='entrega'&&entregadorPadrao()?entregadorPadrao().id:null),
    cidade:_cidadeVenda||(PDV.cliente&&PDV.cliente.cidade)||'',
    data:ag.toISOString(),hora:agoraHM(),caixaId:(caixaAberto()||{}).id
  };
  if(_cupomAtivo)ped.cupom={id:_cupomAtivo.id,codigo:_cupomAtivo.codigo,valor:valorCupom(_cupomAtivo,total+desc-taxa)};
  DB.pedidos.push(ped);
  if(_cupomAtivo){
    DB.cupomUsos=DB.cupomUsos||[];
    DB.cupomUsos.push({id:uid('cu'),cupomId:_cupomAtivo.id,clienteId:PDV.cliente?PDV.cliente.id:null,
      clienteNome:PDV.cliente?PDV.cliente.nome:'Consumidor',pedidoId:ped.id,numero:ped.numero,
      valor:ped.cupom.valor,totalPedido:total,data:hojeISO()});
    _cupomAtivo=null;
  }
  if(fiado>0&&PDV.cliente){
    DB.fiadoMov=DB.fiadoMov||[];
    PDV.cliente.saldoFiado=+((Number(PDV.cliente.saldoFiado)||0)+fiado).toFixed(2);
    DB.fiadoMov.push({id:uid('fm'),clienteId:PDV.cliente.id,tipo:'debito',valor:fiado,
      data:hojeISO(),pedidoId:ped.id,obs:'compra fiado — pedido #'+ped.numero});
  }
  if(PDV.cliente){
    PDV.cliente.compras=(PDV.cliente.compras||0)+1;
    PDV.cliente.gasto=(PDV.cliente.gasto||0)+total;
    PDV.cliente.ultima=ag.toLocaleDateString('pt-BR')+' '+ped.hora;
  }
  try{baixarEstoqueVenda(ped);}catch(e){console.error('estoque venda',e);}
  salvar();
  PDV.comanda=[];PDV.cliente=null;PDV.tipo='loja';_cidadeVenda='';
  if(imprimir)imprimirVia(ped);
  PDV.aba='pedidos';telaPDV();
  toast('Venda finalizada — pedido #'+ped.numero+'.');
}
function imprimirVia(ped){
  var el=document.getElementById('viaImp')||document.createElement('div');
  el.id='viaImp';
  el.innerHTML='<div style="text-align:center"><b>NEXOR</b><br>Pedido #'+ped.numero+'<br>'+
  new Date(ped.data).toLocaleString('pt-BR')+'</div><hr>'+
  '<div>Cliente: '+E(ped.clienteNome)+'</div>'+
  '<div>Tipo: '+(ped.tipo==='entrega'?'ENTREGA':'LOJA')+'</div><hr>'+
  ped.itens.map(function(i){
    return i.qtd+'x '+E(i.nome)+' .... R$ '+money(i.total)+
    (i.opcoes&&i.opcoes.length?'<br>&nbsp;&nbsp;'+i.opcoes.map(function(o){return '+'+E(o.nome)}).join('<br>&nbsp;&nbsp;'):'')+
    (i.obs?'<br>&nbsp;&nbsp;obs: '+E(i.obs):'');}).join('<br>')+
  '<hr>'+(ped.taxa?'Taxa entrega: R$ '+money(ped.taxa)+'<br>':'')+
  (ped.desconto?'Desconto: R$ '+money(ped.desconto)+'<br>':'')+
  '<b>TOTAL: R$ '+money(ped.total)+'</b><br>'+
  ped.pagamentos.map(function(p){var f=FORMAS.find(function(x){return x.id===p.forma});
    return f.n+': R$ '+money(p.valor)}).join('<br>')+
  '<hr>'+(ped.fiscal?'CUPOM FISCAL SOLICITADO':'SEM VALOR FISCAL');
  document.body.appendChild(el);
  setTimeout(function(){window.print()},150);
}

      '<button class="btn sm" onclick="imprimirPedido(\''+p.id+'\')">'+sv('print2',12)+'</button>'+(p.tipo==='entrega'?'<button class="btn sm" onclick="atribuirEntregador(\''+p.id+'\')" title="Entregador">'+sv('moto',12)+'</button>':'')+
      (f.id!=='cancelado'?'<button class="btn sm" onclick="moverPedido(\''+p.id+'\',\'cancelado\')">Cancelar</button>':
       '<button class="btn sm" onclick="moverPedido(\''+p.id+'\',\''+(cfg().fases[0]||'aguardando')+'\')">Voltar</button>')+
      '</div></div>';}).join('')

function ativarKanban(){
  var cards=document.querySelectorAll('.ped');
  for(var i=0;i<cards.length;i++){
    cards[i].ondragstart=function(e){_dragId=this.getAttribute('data-id');this.classList.add('drag');};
    cards[i].ondragend=function(){this.classList.remove('drag');};
  }
  var cols=document.querySelectorAll('.kanB');
  for(var j=0;j<cols.length;j++){
    cols[j].ondragover=function(e){e.preventDefault();this.classList.add('over');};
    cols[j].ondragleave=function(){this.classList.remove('over');};
    cols[j].ondrop=function(e){e.preventDefault();this.classList.remove('over');
      if(_dragId)moverPedido(_dragId,this.getAttribute('data-fase'));_dragId=null;};
  }
}
function moverPedido(id,fase){
  var p=DB.pedidos.find(function(x){return x.id===id});
  if(!p)return;
  var antes=p.fase;
  p.fase=fase;
  try{
    if(fase==='cancelado'&&antes!=='cancelado')estornarEstoqueVenda(p);
    if(antes==='cancelado'&&fase!=='cancelado')baixarEstoqueVenda(p);
  }catch(e){console.error('estoque pedido',e);}
  salvar();renderKanban();
  var f=FASES_DISP.find(function(x){return x.id===fase});
  toast('Pedido #'+p.numero+' → '+(f?f.n:fase));
}
function imprimirPedido(id){imprimirVia(DB.pedidos.find(function(x){return x.id===id}));}

/* ---------- ABA: CAIXA ---------- */
function movimentoCaixa(id){
  var ps=DB.pedidos.filter(function(p){return p.caixaId===id&&p.fase!=='cancelado'});
  var porForma={},qtdForma={};
  FORMAS.forEach(function(f){porForma[f.id]=0;qtdForma[f.id]=0});
  ps.forEach(function(p){(p.pagamentos||[]).forEach(function(x){
    porForma[x.forma]=(porForma[x.forma]||0)+x.valor;
    qtdForma[x.forma]=(qtdForma[x.forma]||0)+1;})});
  var idDin=(FORMAS.find(function(f){return f.tipo==='dinheiro'})||{}).id;
  return {qtd:ps.length,total:ps.reduce(function(a,p){return a+p.total},0),
          dinheiro:(idDin?porForma[idDin]:0)||porForma.dinheiro||0,
          porForma:porForma,qtdForma:qtdForma};
}
/* ao fechar o caixa, cada forma vira um lançamento na conta dela, já com a taxa descontada */
function lancarFechamento(cx,mov){
  DB.lancFin=DB.lancFin||[];
  var dt=hojeISO();
  var contaCaixa=(DB.contas||[]).find(function(c){return c.fixa==='caixa'});
  var criados=0;
  (DB.formasPag||[]).forEach(function(f){
    var bruto=mov.porForma[f.id]||0;
    if(bruto<=0)return;
    var qtd=mov.qtdForma[f.id]||1;
    var taxa=+(bruto*(Number(f.taxaPct)||0)/100 + (Number(f.taxaFixa)||0)*qtd).toFixed(2);
    var liq=+(bruto-taxa).toFixed(2);
    var contaId=f.contaId||(f.tipo==='dinheiro'&&contaCaixa?contaCaixa.id:'');
    var venc=dt;
    if(Number(f.dias)>0){var d=new Date(dt+'T12:00:00');d.setDate(d.getDate()+Number(f.dias));venc=d.toISOString().slice(0,10);}
    DB.lancFin.push({id:uid('lf'),tipo:'receita',contaId:contaId,metodoId:f.id,
      descricao:'Vendas — '+f.nome+(taxa?' (taxa R$ '+money(taxa)+')':''),
      fornecedor:'',documento:'',categoriaTxt:'Frente de Caixa',
      valor:liq,emissao:dt,vencimento:venc,
      pagamento:Number(f.dias)>0?'':dt,pago:Number(f.dias)>0?false:true,
      origem:'fechamento-caixa',ref:cx.id,
      obs:'Bruto R$ '+money(bruto)+' · '+qtd+' transação(ões)'+(taxa?' · taxa R$ '+money(taxa):'')});
    criados++;
  });
  return criados;
}
function tabelaFormas(mov,cego){
  var h='<table class="fpgTab">';
  FORMAS.forEach(function(f){
    var v=mov.porForma[f.id]||0;
    h+='<tr'+(f.id==='dinheiro'?' class="dest"':'')+'><td>'+f.n+
    (f.id==='dinheiro'?' <small style="color:var(--ink-3)">(vai para a gaveta)</small>':'')+'</td>'+
    '<td>'+(cego?'—':'R$ '+money(v))+'</td></tr>';
  });
  h+='<tr><td><b>Total recebido</b></td><td><b>'+(cego?'—':'R$ '+money(mov.total))+'</b></td></tr></table>';
  return h;
}
function totalMov(cx,tipo){
  return (cx.movimentos||[]).filter(function(m){return m.tipo===tipo})
    .reduce(function(a,m){return a+m.valor},0);
}
function esperadoCaixa(cx){
  var mov=movimentoCaixa(cx.id);
  return cx.inicial+mov.dinheiro+totalMov(cx,'suprimento')-totalMov(cx,'sangria');
}
function movCaixa(tipo){

}

function fecharCaixa(){
  var cx=caixaAberto();if(!cx){toast('Nenhum caixa aberto.');return;}
  var mov=movimentoCaixa(cx.id);
  var cego=cfg().caixaCego;
  var esperadoGaveta=esperadoCaixa(cx);

  /* o que o sistema espera de cada forma */
  var esp={};
  FORMAS.forEach(function(f){
    esp[f.id]=(f.id==='dinheiro')?esperadoGaveta:(mov.porForma[f.id]||0);
  });

  var linhas=FORMAS.map(function(f){
    return '<tr'+(f.id==='dinheiro'?' class="dest"':'')+'>'+
    '<td><b>'+f.n+'</b>'+(f.id==='dinheiro'?'<small style="display:block;color:var(--ink-3)">conferência física da gaveta</small>':'')+'</td>'+
    '<td class="cSis" style="text-align:right">'+(cego?'<span style="color:var(--ink-3)">oculto</span>':'R$ '+money(esp[f.id]))+'</td>'+
    '<td style="width:150px"><div class="cur"><span>R$</span>'+
    '<input type="number" step="0.01" class="cfV" data-f="'+f.id+'" value=""></div></td>'+
    '<td class="cDif" data-f="'+f.id+'" style="text-align:right;width:120px;color:var(--ink-3)">—</td></tr>';
  }).join('');

  var h='<div class="mdB">'+
  '<div class="blk" style="margin:0 0 11px;max-width:none">'+
  '<h3>Composição da gaveta <small>base do valor esperado em dinheiro</small></h3>'+
  '<div class="linha"><span>Fundo de troco</span><b>R$ '+money(cx.inicial)+'</b></div>'+
  '<div class="linha"><span>Recebido em dinheiro</span><b>'+(cego?'oculto':'+ R$ '+money(mov.dinheiro))+'</b></div>'+
  '<div class="linha"><span>Suprimentos</span><b>+ R$ '+money(totalMov(cx,'suprimento'))+'</b></div>'+
  '<div class="linha"><span>Sangrias</span><b>- R$ '+money(totalMov(cx,'sangria'))+'</b></div>'+
  '<div class="linha"><span>Pedidos no turno</span><b>'+mov.qtd+'</b></div>'+
  '</div>'+

  '<div class="blk" style="margin:0 0 11px;max-width:none">'+
  '<h3>Conferência por forma de pagamento</h3>'+
  '<div class="hint" style="margin-bottom:10px">Informe o valor apurado em cada forma: dinheiro contado na gaveta, '+
  'e os totais das maquininhas e do Pix.'+(cego?' No caixa cego, o valor do sistema só aparece depois de fechar.':'')+'</div>'+
  '<table class="fpgTab confTab"><thead><tr>'+
  '<th style="text-align:left">Forma</th><th style="text-align:right">Sistema</th>'+
  '<th style="text-align:right">Informado</th><th style="text-align:right">Diferença</th></tr></thead>'+
  '<tbody>'+linhas+'</tbody>'+
  '<tfoot><tr><td><b>Total</b></td>'+
  '<td class="cSis" style="text-align:right"><b>'+(cego?'oculto':'R$ '+money(FORMAS.reduce(function(a,f){return a+esp[f.id]},0)))+'</b></td>'+
  '<td style="text-align:right"><b id="cfTot">R$ 0,00</b></td>'+
  '<td style="text-align:right"><b id="cfDifTot">—</b></td></tr></tfoot></table>'+
  '</div>'+

  '<div class="blk" style="margin:0;max-width:none">'+
  '<div class="fld2" style="margin:0"><label>Observação do fechamento</label>'+
  '<input id="cxObs" placeholder="ex: faltou R$ 2 de troco / maquininha ficou offline às 19h"></div></div></div>';

  modal('Fechamento de caixa',h,'Confirmar fechamento',function(){
    var conf={},algum=false,totInf=0;
    var ins=document.querySelectorAll('.cfV');
    for(var i=0;i<ins.length;i++){
      var v=ins[i].value;
      if(v!=='')algum=true;
      var n=parseFloat(v)||0;
      conf[ins[i].getAttribute('data-f')]=n;totInf+=n;
    }
    if(!algum){toast('Informe ao menos o valor contado em dinheiro.');return false;}
    var ag=new Date();
    cx.conferencia=conf;
    cx.esperadoPorForma=esp;
    cx.contado=conf.dinheiro||0;
    cx.esperado=esperadoGaveta;
    cx.totalInformado=totInf;
    cx.qtd=mov.qtd;cx.vendas=mov.total;cx.obs=$('cxObs').value;
    cx.fechadoEm=ag.toLocaleDateString('pt-BR')+' '+agoraHM();
    (DB.caixas||[]).forEach(function(c){ if(!c.fechadoEm&&c.id!==cx.id)c.fechadoEm=cx.fechadoEm; });
    var nLanc=lancarFechamento(cx,mov);
    salvar();
    var dif=(conf.dinheiro||0)-esperadoGaveta;
    telaPDV();
    toast('Caixa fechado. Diferença no dinheiro: R$ '+money(dif));
    return true;
  },'lg');

  /* calcula as diferenças enquanto digita */
  function recalcConf(){
    var tot=0,difTot=0;
    var ins=document.querySelectorAll('.cfV');
    for(var i=0;i<ins.length;i++){
      var f=ins[i].getAttribute('data-f');
      var v=ins[i].value===''?null:(parseFloat(ins[i].value)||0);
      var cel=document.querySelector('.cDif[data-f="'+f+'"]');
      if(v===null){cel.textContent='—';cel.style.color='var(--ink-3)';continue;}
      tot+=v;
      var d=v-esp[f];difTot+=d;
      cel.textContent=(d>0?'+ ':d<0?'- ':'')+'R$ '+money(Math.abs(d));
      cel.style.color=Math.abs(d)<0.01?'var(--acc-d)':'var(--red)';
      cel.style.fontWeight='700';
      if(cego)cel.textContent='—';
    }
    $('cfTot').textContent='R$ '+money(tot);
    var dt=$('cfDifTot');
    if(cego){dt.textContent='—';}
    else{
      dt.textContent=(difTot>0?'+ ':difTot<0?'- ':'')+'R$ '+money(Math.abs(difTot));
      dt.style.color=Math.abs(difTot)<0.01?'var(--acc-d)':'var(--red)';
    }
  }
  var ins=document.querySelectorAll('.cfV');
  for(var k=0;k<ins.length;k++)ins[k].oninput=recalcConf;
}

  var fs=[];
  var cks=document.querySelectorAll('.sFase');
  for(var i=0;i<cks.length;i++)if(cks[i].checked||cks[i].disabled)fs.push(cks[i].value);
  if(fs.indexOf('aguardando')<0)fs.unshift('aguardando');
  if(fs.indexOf('cancelado')<0)fs.push('cancelado');
  c.fases=FASES_DISP.filter(function(f){return fs.indexOf(f.id)>=0}).map(function(f){return f.id});
  salvar();toast('Configurações salvas.');
}

function baseFin(){
  baseFormas();
  DB.entregadores=DB.entregadores||[];
  DB.acertos=DB.acertos||[];
  DB.lancamentos=DB.lancamentos||[];

    DB.contas=[
      {id:'ct_caixa',nome:'Caixa da loja',tipo:'Caixa',saldo:0},
      {id:'ct_cofre',nome:'Cofre',tipo:'Cofre',saldo:0},
      {id:'ct_banco',nome:'Banco — conta corrente',tipo:'Banco',saldo:0}
    ];
  }
}
function hojeISO(){var d=new Date();return d.toISOString().slice(0,10)}
function diasAtrasISO(n){var d=new Date();d.setDate(d.getDate()-n);return d.toISOString().slice(0,10)}
function dataBR(iso){if(!iso)return '—';var p=iso.slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function ent(id){return (DB.entregadores||[]).find(function(x){return x.id===id})||null}

/* entregas de um entregador no período, ainda não acertadas */
function ehEntrega(p){return p&&p.tipo==='entrega'&&!p.foraAcerto}
function entregasDe(entId,de,ate,incluirAcertadas){
  return (DB.pedidos||[]).filter(function(p){
    if(!ehEntrega(p))return false;
    if(p.fase==='cancelado')return false;
    if(entId&&p.entregadorId!==entId)return false;
    if(!entId&&!p.entregadorId)return false;
    if(!incluirAcertadas&&p.acertoId)return false;
    var d=(p.data||'').slice(0,10);
    if(de&&d<de)return false;
    if(ate&&d>ate)return false;
    return true;
  });
}
function diariaDoDia(e,iso){
  if(!e||!e.diarias)return 0;
  var d=new Date(iso+'T12:00:00');
  return Number(e.diarias[d.getDay()])||0;
}
/* diárias dos dias em que ele efetivamente trabalhou */
function diariasPeriodo(e,lista){
  var dias={};
  lista.forEach(function(p){dias[(p.data||'').slice(0,10)]=true});
  var tot=0,det=[];
  Object.keys(dias).sort().forEach(function(d){
    var v=diariaDoDia(e,d);tot+=v;det.push({dia:d,valor:v});
  });
  return {total:tot,dias:det};
}
function cidadePedido(p){
  if(p.cidade)return p.cidade;
  var c=(DB.clientes||[]).find(function(x){return x.id===p.clienteId});
  return (c&&c.cidade)||'';
}
/* a taxa do acerto é SEMPRE a cadastrada no entregador para aquela cidade.
   Só quando não há cidade cadastrada é que usa a taxa cobrada no pedido. */
function taxaPedido(e,p){
  var cid=(cidadePedido(p)||'').trim().toLowerCase();
  if(e&&cid){
    var t=(e.taxas||[]).find(function(x){return (x.cidade||'').trim().toLowerCase()===cid});
    if(t)return Number(t.valor)||0;
  }
  if(cid){
    var g=valorCidade(cid);
    if(g)return g;
  }
  return Number(p.taxa)||0;
}
/* origem da taxa, para mostrar na tela */
function origemTaxa(e,p){
  var cid=(cidadePedido(p)||'').trim().toLowerCase();
  if(e&&cid&&(e.taxas||[]).some(function(x){return (x.cidade||'').trim().toLowerCase()===cid}))return 'cadastro';
  if(cid&&valorCidade(cid))return 'cidade';
  if(Number(p.taxa))return 'pedido';
  return 'nenhuma';
}
function resumoEntregador(e,de,ate){
  var lista=entregasDe(e.id,de,ate,false);
  var taxas=lista.reduce(function(a,p){return a+taxaPedido(e,p)},0);
  var vendas=lista.reduce(function(a,p){return a+(Number(p.total)||0)},0);
  var di=diariasPeriodo(e,lista);
  return {lista:lista,qtd:lista.length,taxas:taxas,vendas:vendas,
          diaria:di.total,diasDet:di.dias,aPagar:taxas+di.total};
}

    }
    salvar();telaAcertos();
    toast('Entregador salvo.'+(n?' '+n+' entrega(s) vinculada(s) a ele.':''));
    return true;
  },'lg');
  renderTaxas();
}

/* todas as cidades cadastradas nos entregadores, sem repetir */
function cidadesEntrega(){
  var m={};
  (DB.entregadores||[]).forEach(function(e){
    (e.taxas||[]).forEach(function(t){
      var c=(t.cidade||'').trim();
      if(!c)return;
      var k=c.toLowerCase();
      if(m[k]===undefined||Number(t.valor)>0)m[k]={cidade:c,valor:Number(t.valor)||0};
    });
  });
  return Object.keys(m).sort().map(function(k){return m[k]});
}
function valorCidade(cidade){
  if(!cidade)return 0;
  var a=cidadesEntrega().find(function(x){return x.cidade.toLowerCase()===String(cidade).trim().toLowerCase()});
  return a?a.valor:0;
}
function entregadorPadrao(){
  return (DB.entregadores||[]).find(function(x){return x.padrao})||(DB.entregadores||[])[0]||null;
}
function taxaPorCidade(e,cidade){
  if(!e||!cidade)return 0;
  var t=(e.taxas||[]).find(function(x){return (x.cidade||'').trim().toLowerCase()===cidade.trim().toLowerCase()});
  return t?Number(t.valor)||0:0;
}
/* passa todas as entregas sem entregador para este entregador */
function vincularPendentes(entId){
  var e=ent(entId);var n=0;
  (DB.pedidos||[]).forEach(function(p){
    if(!ehEntrega(p)||p.fase==='cancelado'||p.acertoId||p.entregadorId)return;
    p.entregadorId=entId;n++;
    if(!p.cidade){
      var cli=(DB.clientes||[]).find(function(c){return c.id===p.clienteId})||{};
      if(cli.cidade)p.cidade=cli.cidade;
    }
  });
  return n;
}

/* histórico dia a dia do entregador, com situação de pagamento */
function historicoDias(e,de,ate){
  var todas=entregasDe(e.id,de,ate,true);
  var mapa={};
  todas.forEach(function(p){
    var d=(p.data||'').slice(0,10);
    if(!mapa[d])mapa[d]={dia:d,qtd:0,taxas:0,vendas:0,pagos:0,pend:0,acertoId:null};
    var m=mapa[d];
    m.qtd++;m.taxas+=taxaPedido(e,p);m.vendas+=Number(p.total)||0;
    if(p.acertoId){m.pagos++;m.acertoId=p.acertoId;}else m.pend++;
  });
  return Object.keys(mapa).sort().reverse().map(function(d){
    var m=mapa[d];
    m.diaria=diariaDoDia(e,d);
    m.total=m.taxas+m.diaria;
    m.situacao=m.pend===0?'pago':(m.pagos>0?'parcial':'pendente');
    return m;
  });
}
function tabelaHistorico(e){
  var hist=historicoDias(e,AC.de,AC.ate);
  if(!hist.length)return '<div class="vazio2" style="padding:30px">Nenhum movimento no período selecionado.</div>';
  var tp=0,tt=0;
  var linhas=hist.map(function(m){
    var dt=new Date(m.dia+'T12:00:00');
    if(m.situacao==='pago')tp+=m.total; else tt+=m.total;
    var tag=m.situacao==='pago'?'<span class="stPg">Pago</span>'
           :m.situacao==='parcial'?'<span class="stPc">Parcial</span>'
           :'<span class="stAp">A pagar</span>';
    return '<tr class="lin-'+m.situacao+'">'+
    '<td><b>'+dataBR(m.dia)+'</b><small>'+DIASEM[dt.getDay()]+'</small></td>'+
    '<td style="text-align:center">'+m.qtd+'</td>'+
    '<td style="text-align:right">R$ '+money(m.taxas)+'</td>'+
    '<td style="text-align:right">R$ '+money(m.diaria)+'</td>'+
    '<td style="text-align:right;color:var(--ink-3)">R$ '+money(m.vendas)+'</td>'+
    '<td style="text-align:right"><b>R$ '+money(m.total)+'</b></td>'+
    '<td style="text-align:center">'+tag+'</td>'+
    '<td>'+(m.acertoId?'<button class="rBtn" onclick="verAcerto(\''+m.acertoId+'\')" title="Ver recibo">'+sv('eye',13)+'</button>':'')+'</td></tr>';
  }).join('');
  return '<div class="acTabW" style="max-height:320px"><table class="acTab histTab"><thead><tr>'+
  '<th style="width:120px">Dia</th><th style="width:70px;text-align:center">Entregas</th>'+
  '<th style="width:100px;text-align:right">Taxas</th><th style="width:100px;text-align:right">Diária</th>'+
  '<th style="width:110px;text-align:right">Vendas</th><th style="width:110px;text-align:right">Total do dia</th>'+
  '<th style="width:92px;text-align:center">Situação</th><th style="width:44px"></th></tr></thead><tbody>'+linhas+
  '</tbody><tfoot><tr><td colspan="5"><b>Totais do período</b></td>'+
  '<td style="text-align:right"><b>R$ '+money(tp+tt)+'</b></td>'+

  '<span class="stPg">pago R$ '+money(tp)+'</span> <span class="stAp">a pagar R$ '+money(tt)+'</span></td>'+
  '</tr></tfoot></table></div>';
}

function atribuirEntregador(pedId,voltarAcerto){

  var h='<div class="mdB"><div class="blk" style="margin:0;max-width:none">'+

function saldoConta(c){
  if(c.fixa==='caixa'){
    var cx=caixaAberto();
    return cx?esperadoCaixa(cx):0;
  }
  var mov=(DB.lancamentos||[]).filter(function(l){return l.contaId===c.id});
  var e=mov.filter(function(l){return l.tipo==='entrada'}).reduce(function(a,l){return a+l.valor},0);
  var s=mov.filter(function(l){return l.tipo==='saida'}).reduce(function(a,l){return a+l.valor},0);
  return (Number(c.saldoInicial)||0)+e-s;
}

var LF={base:'vencimento',de:'',ate:'',tipo:'todas',sit:'todas',
        conta:'',metodo:'',categoria:'',subcat:'',subcatNome:'',desc:'',forn:'',rotulo:'Esta semana'};

function baseLanc(){
  baseCat();baseFormas();
  DB.lancFin=DB.lancFin||[];
  DB.fornecedores=DB.fornecedores||[];
  migrarLanc();
}
/* traz para o novo formato o que já existia */
function migrarLanc(){
  if(DB.contasPagar&&DB.contasPagar.length){
    DB.contasPagar.forEach(function(c){
      (c.parcelas||[]).forEach(function(pc,i){
        DB.lancFin.push({id:uid('lf'),tipo:'despesa',contaId:pc.contaId||'',metodoId:pc.formaId||'',
          descricao:(c.fornecedor||'Lançamento')+((c.parcelas.length>1)?' ('+(i+1)+'/'+c.parcelas.length+')':''),
          fornecedor:c.fornecedor||'',documento:c.documento||'',categoriaId:c.categoriaId||'',
          valor:Number(pc.valor)||0,emissao:c.dataRef||hojeISO(),vencimento:pc.vencimento||hojeISO(),
          pagamento:pc.pago?(pc.dataMov||hojeISO()):'',pago:!!pc.pago,obs:c.obs||''});
      });
    });
    DB.contasPagar=[];
    salvar();
  }
  if(DB.lancamentos&&DB.lancamentos.length){
    DB.lancamentos.forEach(function(l){
      if(l.migrado)return;
      DB.lancFin.push({id:uid('lf'),tipo:l.tipo==='entrada'?'receita':'despesa',contaId:l.contaId||'',
        metodoId:'',descricao:l.descricao,fornecedor:'',documento:'',categoriaId:'',categoriaTxt:l.categoria,
        valor:Number(l.valor)||0,emissao:(l.data||hojeISO()).slice(0,10),vencimento:(l.data||hojeISO()).slice(0,10),
        pagamento:(l.data||hojeISO()).slice(0,10),pago:true,origem:l.origem||''});
      l.migrado=true;
    });
  }
}
function catTexto(l){
  if(l.categoriaTxt)return l.categoriaTxt;
  return l.categoriaId?nomeCategoria(l.categoriaId):'—';
}
function nomeCategoria(subId){
  var achou='—';
  (DB.catfin||[]).forEach(function(p){
    (p.itens||[]).forEach(function(it){if(it.id===subId)achou=p.nome+' › '+it.nome});
  });
  return achou;
}
function metodoNome(id){var f=formaPag(id);return f?f.nome:'—'}
function contaNome(id){var c=(DB.contas||[]).find(function(x){return x.id===id});return c?c.nome:'—'}
function iconeConta(id){
  var c=(DB.contas||[]).find(function(x){return x.id===id});
  if(!c)return '<span class="ctMini" style="background:#B7C4D2">?</span>';
  var b=c.fixa?null:banco(c.banco);
  var cor=c.fixa==='caixa'?'#0E8A46':c.fixa==='cofre'?'#5C6B80':(b?b.c:'#5C6B80');
  var sig=c.fixa==='caixa'?'CX':c.fixa==='cofre'?'CO':(b?b.s:'$');
  return '<span class="ctMini" style="background:'+cor+'">'+sig+'</span>';
}
function dataDoFiltro(l){
  if(LF.base==='movimentacao')return l.pagamento||l.vencimento||'';
  if(LF.base==='referencia')return l.emissao||'';
  return l.vencimento||'';
}
function filtrarLanc(){
  return (DB.lancFin||[]).filter(function(l){
    if(LF.tipo==='pagar'&&l.tipo!=='despesa')return false;
    if(LF.tipo==='receber'&&l.tipo!=='receita')return false;
    if(LF.sit==='pagas'&&!l.pago)return false;
    if(LF.sit==='naopagas'&&l.pago)return false;
    if(LF.conta&&l.contaId!==LF.conta&&l.contaDestinoId!==LF.conta)return false;
    if(LF.metodo&&l.metodoId!==LF.metodo)return false;
    if(LF.categoria&&pastaDaSub(l.categoriaId)!==LF.categoria)return false;
    if(LF.subcat&&l.categoriaId!==LF.subcat)return false;
    if(LF.desc&&(l.descricao||'').toLowerCase().indexOf(LF.desc.toLowerCase())<0)return false;
    if(LF.forn){
      var q=LF.forn.toLowerCase();
      if(((l.fornecedor||'')+' '+(l.documento||'')).toLowerCase().indexOf(q)<0)return false;
    }
    var d=dataDoFiltro(l);
    if(LF.de&&d&&d<LF.de)return false;
    if(LF.ate&&d&&d>LF.ate)return false;
    return true;
  }).sort(function(a,b){return (dataDoFiltro(b)||'').localeCompare(dataDoFiltro(a)||'')});
}
function pastaDaSub(subId){
  var achou='';
  (DB.catfin||[]).forEach(function(p){
    (p.itens||[]).forEach(function(it){if(it.id===subId)achou=p.nome});
  });
  return achou;
}

/* ---------- PERÍODOS ---------- */
function periodo(qual){
  var d=new Date(),a,b;
  if(qual==='hoje'){a=b=d;LF.rotulo='Hoje';}
  else if(qual==='semana'){a=new Date(d);a.setDate(d.getDate()-d.getDay());b=new Date(a);b.setDate(a.getDate()+6);LF.rotulo='Esta semana';}
  else if(qual==='mes'){a=new Date(d.getFullYear(),d.getMonth(),1);b=new Date(d.getFullYear(),d.getMonth()+1,0);LF.rotulo='Este mês';}
  LF.de=a.toISOString().slice(0,10);LF.ate=b.toISOString().slice(0,10);
  telaLancamentos();
}
function moverPeriodo(dir){
  var a=new Date(LF.de+'T12:00:00'),b=new Date(LF.ate+'T12:00:00');
  var dias=Math.round((b-a)/86400000)+1;
  a.setDate(a.getDate()+dir*dias);b.setDate(b.getDate()+dir*dias);
  LF.de=a.toISOString().slice(0,10);LF.ate=b.toISOString().slice(0,10);
  LF.rotulo='Personalizado';
  telaLancamentos();
}
function rotuloPeriodo(){
  var m=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  var a=new Date(LF.de+'T12:00:00'),b=new Date(LF.ate+'T12:00:00');
  if(LF.de===LF.ate)return a.getDate()+' de '+m[a.getMonth()];
  return a.getDate()+' de '+m[a.getMonth()]+' a '+b.getDate()+' de '+m[b.getMonth()];
}

function atualizaSelecao(){
  var c=document.querySelectorAll('.chkLF:checked');
  var box=$('selInfo');if(!box)return;
  if(!c.length){box.classList.remove('on');box.innerHTML='<span>nenhum selecionado</span>';return;}
  var tot=0,det=0,rec=0;
  for(var i=0;i<c.length;i++){
    var l=DB.lancFin.find(function(x){return x.id===c[i].getAttribute('data-id')});

var _datasParc=[];
function trocaPerParc(){
  var bd=$('boxDias');
  if(bd)bd.style.display=($('lnPer').value==='dias')?'':'none';
  _datasParc=[];
  previewParc();
}
function datasCalculadas(){
  var q=parseInt($('lnQtd').value)||2;
  var per=$('lnPer').value;
  var d0=$('lnPri').value||hojeISO();
  var dias=parseInt(($('lnDias')||{}).value)||10;
  var out=[];
  for(var i=0;i<q;i++){
    var d=new Date(d0+'T12:00:00');
    if(per==='semanal')d.setDate(d.getDate()+7*i);
    else if(per==='quinzenal')d.setDate(d.getDate()+15*i);
    else if(per==='mensal')d.setMonth(d.getMonth()+i);
    else if(per==='bimestral')d.setMonth(d.getMonth()+2*i);
    else d.setDate(d.getDate()+dias*i);
    out.push(d.toISOString().slice(0,10));
  }
  return out;
}
function datasParcelas(){
  var calc=datasCalculadas();
  /* mantém as datas que o usuário ajustou manualmente */
  var out=calc.map(function(d,i){return (_datasParc[i]||d)});
  return out;
}
function mudaDataParc(i,v){
  _datasParc[i]=v;
  previewParc();
}
function valorParcela(){
  var total=parseFloat($('lnV').value)||0;
  var q=parseInt($('lnQtd').value)||2;
  return $('lnModo').value==='dividir'?+(total/q).toFixed(2):total;
}
function previewParc(){
  var box=$('prevParc');if(!box)return;
  if(!$('lnParc').checked){box.innerHTML='';return;}
  var ds=datasParcelas(),v=valorParcela();

/* ==========================================================
   BLOCO 14 — FLUXO DE CAIXA
   ========================================================== */
var MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
var MESC=['JAN','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT','NOV','DEZ'];
var FX={ano:new Date().getFullYear(),conta:'',previsto:false,de:0,ate:11,abertas:{}};

function grupoDoLanc(l){
  if(l.categoriaTxt)return l.categoriaTxt;
  var p=pastaDaSub(l.categoriaId);
  return p||'Sem categoria';
}
function subDoLanc(l){
  if(l.categoriaTxt)return '';
  var nome=nomeCategoria(l.categoriaId);
  var i=nome.indexOf(' › ');
  return i>=0?nome.slice(i+3):'';
}
function lancDoMes(m){
  return (DB.lancFin||[]).filter(function(l){
    if(FX.conta&&l.contaId!==FX.conta&&l.contaDestinoId!==FX.conta)return false;
    if(!FX.previsto&&!l.pago)return false;
    var d=(l.pago&&l.pagamento)?l.pagamento:(l.vencimento||l.emissao||'');
    if(!d)return false;
    var dt=new Date(d+'T12:00:00');
    return dt.getFullYear()===FX.ano&&dt.getMonth()===m;
  });
}
function montaFluxo(){
  var rec={},des={},transE=[],transS=[];
  for(var m=0;m<12;m++){transE[m]=0;transS[m]=0;}
  for(var m2=0;m2<12;m2++){
    lancDoMes(m2).forEach(function(l){
      if(l.tipo==='transferencia'){
        if(l.contaDestinoId===FX.conta||!FX.conta)transE[m2]+=l.valor;
        if(l.contaId===FX.conta||!FX.conta)transS[m2]+=l.valor;
        return;
      }
      var alvo=l.tipo==='receita'?rec:des;
      var g=grupoDoLanc(l),sb=subDoLanc(l)||'(sem subcategoria)';
      alvo[g]=alvo[g]||{tot:[],subs:{}};
      alvo[g].tot[m2]=(alvo[g].tot[m2]||0)+l.valor;
      alvo[g].subs[sb]=alvo[g].subs[sb]||[];
      alvo[g].subs[sb][m2]=(alvo[g].subs[sb][m2]||0)+l.valor;
    });
  }
  return {rec:rec,des:des,transE:transE,transS:transS};
}
function telaFluxo(){
  baseLanc();
  var f=montaFluxo();
  var mesesVis=[];for(var m=FX.de;m<=FX.ate;m++)mesesVis.push(m);
  var totR=[],totD=[],saldoAnt=[],saldoFim=[],totCx=[],totT=[];
  var acumulado=(DB.contas||[]).filter(function(c){return !FX.conta||c.id===FX.conta})
    .reduce(function(a,c){return a+(Number(c.saldoInicial)||0)},0);
  for(var i=0;i<12;i++){
    totR[i]=Object.keys(f.rec).reduce(function(a,k){return a+(f.rec[k].tot[i]||0)},0);
    totD[i]=Object.keys(f.des).reduce(function(a,k){return a+(f.des[k].tot[i]||0)},0);
    totCx[i]=totR[i]-totD[i];
    totT[i]=f.transE[i]-f.transS[i];
    saldoAnt[i]=acumulado;
    acumulado=acumulado+totCx[i]+totT[i];
    saldoFim[i]=acumulado;
  }
  function linhaVals(arr,cls,neg){
    return mesesVis.map(function(m){
      var v=arr[m]||0;
      return '<td class="fxV '+(cls||'')+'">'+(neg&&v?'-':'')+money(Math.abs(v))+'</td>';
    }).join('');
  }
  function blocoGrupos(obj,tipo){
    var ks=Object.keys(obj).sort();
    if(!ks.length)return '<tr><td class="fxN vazio2" colspan="'+(mesesVis.length+1)+'" style="padding:16px">nenhum lançamento no período</td></tr>';
    return ks.map(function(k){
      var g=obj[k],ab=!!FX.abertas[tipo+k];
      var subs=Object.keys(g.subs).sort();
      var h='<tr class="fxG'+(ab?' ab':'')+'" onclick="toggleFx(\''+tipo+'\',\''+E(k).replace(/'/g,'')+'\')">'+
      '<td class="fxN"><span class="fxSeta">'+sv('tri',9)+'</span>'+
      '<span class="fxBar" style="background:'+(tipo==='r'?'#00A08B':'#C94141')+'"></span>'+E(k)+'</td>'+
      linhaVals(g.tot,tipo==='r'?'vg':'vr',tipo==='d')+'</tr>';
      if(ab)subs.forEach(function(sb){
        h+='<tr class="fxS"><td class="fxN sub">'+E(sb)+'</td>'+
        linhaVals(g.subs[sb],tipo==='r'?'vg':'vr',tipo==='d')+'</tr>';
      });
      return h;
    }).join('');
  }
  $('content').innerHTML='<div class="fxWrap">'+
   '<div class="fxTopo">'+
    '<div><h1>Fluxo de Caixa</h1><p>Entradas e saídas por categoria, mês a mês.</p></div>'+
    '<div class="fxFiltros">'+
     '<div class="f2" style="min-width:150px"><label>Conta</label><select onchange="FX.conta=this.value;telaFluxo()">'+
      '<option value="">Todas as contas</option>'+
      (DB.contas||[]).map(function(c){return '<option value="'+c.id+'"'+(FX.conta===c.id?' selected':'')+'>'+E(c.nome)+'</option>'}).join('')+
     '</select></div>'+
     '<div class="f2" style="min-width:100px"><label>Ano</label><select onchange="FX.ano=+this.value;telaFluxo()">'+
      [FX.ano-2,FX.ano-1,FX.ano,FX.ano+1].filter(function(v,i,a){return a.indexOf(v)===i}).map(function(y){
        return '<option'+(FX.ano===y?' selected':'')+'>'+y+'</option>'}).join('')+
     '</select></div>'+
     '<div class="f2" style="min-width:120px"><label>De</label><select onchange="FX.de=+this.value;telaFluxo()">'+
      MESES.map(function(n,i){return '<option value="'+i+'"'+(FX.de===i?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div>'+
     '<div class="f2" style="min-width:120px"><label>Até</label><select onchange="FX.ate=+this.value;telaFluxo()">'+
      MESES.map(function(n,i){return '<option value="'+i+'"'+(FX.ate===i?' selected':'')+'>'+n+'</option>'}).join('')+'</select></div>'+
     '<div class="fxPrev"><span>Exibir previsto</span>'+
      '<button class="sw'+(FX.previsto?' on':'')+'" onclick="FX.previsto=!FX.previsto;telaFluxo()"></button></div>'+
     '<button class="btnP2" onclick="exportarFluxo()">'+sv('down2',14)+' Exportar</button>'+
    '</div>'+
   '</div>'+
   '<div class="fxTabW"><table class="fxTab"><thead><tr><th class="fxN"></th>'+
    mesesVis.map(function(m){return '<th class="fxV">'+MESES[m].toUpperCase()+'</th>'}).join('')+
   '</tr></thead><tbody>'+
    '<tr class="fxSaldo"><td class="fxN"><span class="fxTag sl">SALDO</span> Saldo anterior</td>'+
     linhaVals(saldoAnt,'')+'</tr>'+
    '<tr class="fxTit"><td class="fxN"><span class="fxTag rc">RECEITAS</span></td>'+
     mesesVis.map(function(){return '<td></td>'}).join('')+'</tr>'+
    blocoGrupos(f.rec,'r')+
    '<tr class="fxTot"><td class="fxN">Total de receitas</td>'+linhaVals(totR,'vg')+'</tr>'+
    '<tr class="fxTit"><td class="fxN"><span class="fxTag ds">DESPESAS</span></td>'+
     mesesVis.map(function(){return '<td></td>'}).join('')+'</tr>'+
    blocoGrupos(f.des,'d')+
    '<tr class="fxTot"><td class="fxN">Total de despesas</td>'+linhaVals(totD,'vr',true)+'</tr>'+
    '<tr class="fxCx"><td class="fxN">Total de caixa</td>'+
     mesesVis.map(function(m){var v=totCx[m]||0;
       return '<td class="fxV '+(v<0?'vr':'vg')+'">'+(v<0?'-':'')+money(Math.abs(v))+'</td>'}).join('')+'</tr>'+
    '<tr class="fxTit"><td class="fxN"><span class="fxTag tr">TRANSFERÊNCIAS</span></td>'+
     mesesVis.map(function(){return '<td></td>'}).join('')+'</tr>'+
    '<tr class="fxS"><td class="fxN sub">Entradas</td>'+linhaVals(f.transE,'vg')+'</tr>'+
    '<tr class="fxS"><td class="fxN sub">Saídas</td>'+linhaVals(f.transS,'vr',true)+'</tr>'+
    '<tr class="fxTot"><td class="fxN">Total de transferências</td>'+
     mesesVis.map(function(m){var v=totT[m]||0;
       return '<td class="fxV '+(v<0?'vr':'vg')+'">'+(v<0?'-':'')+money(Math.abs(v))+'</td>'}).join('')+'</tr>'+
    '<tr class="fxFim"><td class="fxN">Saldo final de caixa</td>'+
     mesesVis.map(function(m){var v=saldoFim[m]||0;
       return '<td class="fxV '+(v<0?'vr':'vg')+'">'+(v<0?'-':'')+money(Math.abs(v))+'</td>'}).join('')+'</tr>'+
   '</tbody></table></div></div>';
  rodape(FX.previsto?'incluindo lançamentos previstos':'somente lançamentos pagos');
}
function toggleFx(t,k){FX.abertas[t+k]=!FX.abertas[t+k];telaFluxo();}
function exportarFluxo(){
  var f=montaFluxo();
  var linhas=[['Categoria'].concat(MESES.slice(FX.de,FX.ate+1))];
  ['rec','des'].forEach(function(tp){
    Object.keys(f[tp]).sort().forEach(function(k){
      var r=[k];for(var m=FX.de;m<=FX.ate;m++)r.push(String(f[tp][k].tot[m]||0).replace('.',','));
      linhas.push(r);
    });
  });
  var csv=linhas.map(function(r){return r.map(function(c){return '"'+c+'"'}).join(';')}).join('\n');
  var b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='nexor-fluxo-'+FX.ano+'.csv';document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove()},400);
  toast('Fluxo exportado.');
}

function telaConciliacao(){
  baseLanc();

    CB.de=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);
    CB.ate=new Date(d.getFullYear(),d.getMonth()+1,0).toISOString().slice(0,10);}
  if(!CB.conta&&(DB.contas||[]).length)CB.conta=DB.contas[0].id;
  var conta=(DB.contas||[]).find(function(c){return c.id===CB.conta});

    return d>=CB.de&&d<=CB.ate;

function atualizaCB(){

}
function perCB(n){
  var d=new Date();
  var a=new Date(d.getFullYear(),d.getMonth()+ (n<0?n:0),1);
  var b=new Date(d.getFullYear(),d.getMonth()+ (n<0?n+1:1),0);
  if(n===-3){a=new Date(d.getFullYear(),d.getMonth()-2,1);b=new Date(d.getFullYear(),d.getMonth()+1,0);}
  CB.de=a.toISOString().slice(0,10);CB.ate=b.toISOString().slice(0,10);
  CB.marcadas={};telaConciliacao();
}
function aplicarCB(){CB.de=$('cbDe').value;CB.ate=$('cbAte').value;CB.marcadas={};telaConciliacao();}
function editarMovSel(){
  if(!CB.sel){toast('Selecione um movimento na lista.');return;}
  var l=DB.lancFin.find(function(x){return x.id===CB.sel});
  if(!l)return;
  if(l.conciliado){toast('Movimento conciliado — desconcilie antes de editar.');return;}
  modalLancCB(l.id);
}
function modalLancCB(id){
  var voltar=telaConciliacao;
  var antes=telaLancamentos;
  telaLancamentos=function(){voltar();telaLancamentos=antes;};
  modalLanc(id);
}
function conciliarSelecionadas(){
  var n=0;
  Object.keys(CB.marcadas).forEach(function(id){
    var l=DB.lancFin.find(function(x){return x.id===id});
    if(!l)return;
    if(CB.marcadas[id]&&!l.conciliado){l.conciliado=true;l.dataConc=hojeISO();n++;}
  });
  if(!n){toast('Marque ao menos um movimento.');return;}
  CB.marcadas={};salvar();telaConciliacao();
  toast(n+' movimento(s) conciliado(s). Eles ficam travados nos lançamentos.');
}
function podeDesconciliar(){return true}
function desconciliar(id){
  var l=DB.lancFin.find(function(x){return x.id===id});
  if(!confirm('Desconciliar "'+l.descricao+'"?\n\nEle volta a ficar editável nos lançamentos financeiros.'))return;
  l.conciliado=false;l.dataConc='';
  salvar();telaConciliacao();toast('Movimento desconciliado.');
}
function exportarConc(){
  var conta=(DB.contas||[]).find(function(c){return c.id===CB.conta});
  var movs=(DB.lancFin||[]).filter(function(l){
    return (l.contaId===CB.conta||l.contaDestinoId===CB.conta)&&l.pago&&
      (l.pagamento||l.vencimento)>=CB.de&&(l.pagamento||l.vencimento)<=CB.ate;});
  var linhas=[['Data','Movimento','Documento','Valor','Conciliado']];
  movs.forEach(function(l){
    var neg=l.tipo==='despesa'||(l.tipo==='transferencia'&&l.contaId===CB.conta);
    linhas.push([dataBR(l.pagamento||l.vencimento),l.descricao,l.documento||'',
      (neg?'-':'')+String(l.valor).replace('.',','),l.conciliado?'Sim':'Nao']);
  });
  var csv=linhas.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\n');
  var b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='conciliacao-'+(conta?conta.nome:'conta')+'-'+CB.de+'.csv';
  document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},400);
  toast('Extrato exportado.');
}

function isoDoCaixa(txt){

function editarCaixa(id){
  fecharModal();
  var c=(DB.caixas||[]).find(function(x){return x.id===id});
  if(!c||!c.fechadoEm){toast('Só é possível editar caixas já fechados.');return;}
  if(caixaConciliado(id)){
    toast('Este caixa tem lançamento conciliado no banco. Desconcilie antes de editar.');return;
  }
  var mov=movimentoCaixa(c.id);
  var h='<div class="mdB">'+
  '<div class="blk" style="margin:0 0 11px;max-width:none"><h3>Abertura</h3>'+
  '<div class="row2">'+
  '<div class="fld2"><label>Fundo de troco</label><div class="cur"><span>R$</span>'+
   '<input id="ecIni" type="number" step="0.01" value="'+(c.inicial||0)+'"></div></div>'+
  '<div class="fld2"><label>Operador</label><input id="ecOp" value="'+E(c.operador||'')+'"></div>'+
  '</div></div>'+
  '<div class="blk" style="margin:0 0 11px;max-width:none"><h3>Valores conferidos</h3>'+
  '<table class="fpgTab"><thead><tr><th style="text-align:left">Forma</th>'+
  '<th style="text-align:right">Sistema</th><th style="text-align:right">Informado</th></tr></thead><tbody>'+
  (DB.formasPag||[]).map(function(f){
    var v=mov.porForma[f.id]||0;
    var inf=(c.conferencia&&c.conferencia[f.id]!==undefined)?c.conferencia[f.id]:'';
    return '<tr><td><b>'+E(f.nome)+'</b></td>'+
    '<td style="text-align:right">R$ '+money(v)+'</td>'+
    '<td style="width:150px"><div class="cur"><span>R$</span>'+
    '<input type="number" step="0.01" class="ecV" data-f="'+f.id+'" value="'+inf+'"></div></td></tr>';
  }).join('')+'</tbody></table></div>'+
  '<div class="blk" style="margin:0;max-width:none">'+
  '<div class="fld2" style="margin:0"><label>Observação do fechamento</label>'+
  '<input id="ecObs" value="'+E(c.obs||'')+'"></div>'+
  '<div class="avisoCfg" style="margin-top:12px">'+sv('help',15)+
  '<div>Ao salvar, os lançamentos que este caixa gerou no financeiro são refeitos com os novos valores.</div></div>'+
  '</div></div>';

  modal('Editar fechamento de caixa',h,'Salvar alterações',function(){
    c.inicial=parseFloat($('ecIni').value)||0;
    c.operador=$('ecOp').value.trim();
    c.obs=$('ecObs').value;
    var conf={},tot=0;
    var ins=document.querySelectorAll('.ecV');
    for(var i=0;i<ins.length;i++){
      var n=ins[i].value===''?0:(parseFloat(ins[i].value)||0);
      conf[ins[i].getAttribute('data-f')]=n;tot+=n;
    }
    c.conferencia=conf;c.totalInformado=tot;
    var idDin=(FORMAS.find(function(f){return f.tipo==='dinheiro'})||{}).id;
    c.contado=conf[idDin]||conf.dinheiro||0;
    c.esperado=esperadoCaixa(c);
    c.vendas=mov.total;c.qtd=mov.qtd;
    /* refaz os lançamentos deste caixa */
    DB.lancFin=(DB.lancFin||[]).filter(function(l){return !(l.ref===c.id&&l.origem==='fechamento-caixa')});
    var n2=lancarFechamento(c,mov);
    salvar();telaFrenteCaixa();
    toast('Fechamento atualizado. '+n2+' lançamento(s) refeitos no financeiro.');
    return true;
  },'lg');
}

var CR={busca:'',periodo:'',bairro:'',modo:'compraram',aniv:false,ordem:'gasto'};

function baseCRM(){
  DB.clientes=DB.clientes||[];
  DB.fiadoMov=DB.fiadoMov||[];
  DB.cupons=DB.cupons||[];
  DB.cupomUsos=DB.cupomUsos||[];
  DB.clientes.forEach(function(c){
    if(c.saldoFiado===undefined)c.saldoFiado=0;
    if(c.limiteFiado===undefined)c.limiteFiado=0;
  });
}
function pedidosDoCliente(id){
  return (DB.pedidos||[]).filter(function(p){return p.clienteId===id&&p.fase!=='cancelado'})
    .sort(function(a,b){return (b.data||'').localeCompare(a.data||'')});
}
function statsCliente(c){
  var ps=pedidosDoCliente(c.id);
  var tot=ps.reduce(function(a,p){return a+(Number(p.total)||0)},0);
  var dias={},prods={};
  ps.forEach(function(p){
    var d=new Date((p.data||'').slice(0,10)+'T12:00:00');
    if(!isNaN(d))dias[d.getDay()]=(dias[d.getDay()]||0)+1;
    (p.itens||[]).forEach(function(it){
      prods[it.nome]=(prods[it.nome]||0)+(Number(it.qtd)||1);
    });
  });
  var diaTop='',maxD=0;
  Object.keys(dias).forEach(function(k){if(dias[k]>maxD){maxD=dias[k];diaTop=DIASEM[k]}});
  var prodTop='',maxP=0;
  Object.keys(prods).forEach(function(k){if(prods[k]>maxP){maxP=prods[k];prodTop=k}});
  var ult=ps.length?(ps[0].data||'').slice(0,10):'';
  var dd=ult?Math.floor((new Date()-new Date(ult+'T12:00:00'))/86400000):null;
  return {ps:ps,qtd:ps.length,total:tot,ticket:ps.length?tot/ps.length:0,
          ultima:ult,diasSem:dd,diaTop:diaTop,prodTop:prodTop,prods:prods};
}
function bairrosCadastrados(){
  var m={};
  (DB.clientes||[]).forEach(function(c){if(c.bairro)m[c.bairro]=1});
  return Object.keys(m).sort();
}
function telaClientes(){
  baseCRM();
  var hoje=new Date();

    var s=statsCliente(c);
    return {c:c,s:s};

    if(CR.busca){
      var q=CR.busca.toLowerCase(),d=soDigitos(CR.busca);

        (d&&soDigitos(c.tel).indexOf(d)>=0)||
        (c.cpf&&soDigitos(c.cpf).indexOf(d)>=0);
      if(!achou)return false;
    }
    if(CR.bairro&&c.bairro!==CR.bairro)return false;
    if(CR.aniv){
      if(!c.nascimento)return false;
      if(Number(c.nascimento.slice(5,7))!==hoje.getMonth()+1)return false;
    }
    if(CR.periodo){
      var n=Number(CR.periodo);
      if(CR.modo==='compraram'){ if(s.diasSem===null||s.diasSem>n)return false; }
      else { if(s.diasSem!==null&&s.diasSem<=n)return false; }

function usosDoCupom(id){return (DB.cupomUsos||[]).filter(function(u){return u.cupomId===id})}
function cupomValido(cp,total,formaId,canal){
  if(!cp)return {ok:false,msg:'Cupom não encontrado.'};
  if(cp.ativo===false)return {ok:false,msg:'Cupom inativo.'};
  var hoje=hojeISO();
  if(cp.de&&hoje<cp.de)return {ok:false,msg:'Cupom ainda não está valendo.'};
  if(cp.ate&&hoje>cp.ate)return {ok:false,msg:'Cupom vencido em '+dataBR(cp.ate)+'.'};
  if(cp.horaDe&&cp.horaAte){var hm=agoraHM();
    if(hm<cp.horaDe||hm>cp.horaAte)return {ok:false,msg:'Cupom só vale das '+cp.horaDe+' às '+cp.horaAte+'.'};}
  if(cp.quantidade&&usosDoCupom(cp.id).length>=cp.quantidade)return {ok:false,msg:'Cupom esgotado.'};
  if(cp.minimo&&total<cp.minimo)return {ok:false,msg:'Pedido mínimo de R$ '+money(cp.minimo)+'.'};
  if((cp.formas||[]).length&&formaId&&cp.formas.indexOf(formaId)<0)
    return {ok:false,msg:'Cupom não vale para esta forma de pagamento.'};
  if(canal&&(cp.canais||[]).length&&cp.canais.indexOf(canal)<0)
    return {ok:false,msg:'Este cupom vale apenas em: '+(cp.canais||[]).map(nomeCanal).join(', ')+'.'};
  return {ok:true};
}
function valorCupom(cp,total){
  if(!cp)return 0;
  var v=cp.tipo==='percentual'?total*(Number(cp.valor)||0)/100:(Number(cp.valor)||0);
  if(cp.tetoDesconto&&v>cp.tetoDesconto)v=cp.tetoDesconto;
  if(v>total)v=total;
  return +v.toFixed(2);
}

  if(a.base!==b.base)return null;
  return qtd*a.f/b.f;
}
function baseEstoque(){
  DB.unidExtra=DB.unidExtra||[];
  DB.gruposIng=DB.gruposIng||[
    {id:'gi_ins',nome:'Insumos',compoeCMV:true,subs:[]},
    {id:'gi_emb',nome:'Embalagens',compoeCMV:true,subs:[]},
    {id:'gi_lim',nome:'Limpeza',compoeCMV:false,subs:[]}
  ];
  DB.insumos=DB.insumos||[];
  DB.insumos.forEach(function(i){
    if(!i.codigo)i.codigo=proxCodInsumo();
    if(i.controlaEstoque===undefined)i.controlaEstoque=true;
    if(i.compoeCMV===undefined)i.compoeCMV=true;
    if(i.estoqueMin===undefined)i.estoqueMin=0;
    if(i.estoqueAtual===undefined)i.estoqueAtual=0;
    if(i.fator===undefined)i.fator=1;
    if(i.compras===undefined)i.compras=[];
  });
  DB.fichas=DB.fichas||[];
  DB.fichaCats=DB.fichaCats||[{id:'fc_prod',nome:'Produzido'},{id:'fc_venda',nome:'Vendas'}];
  DB.lojasFin=DB.lojasFin||[{id:'lj_matriz',nome:'Matriz'}];
}
function proxCodInsumo(){
  var n=(DB.insumos||[]).reduce(function(a,f){return Math.max(a,Number(f.codigo)||700000)},700000);
  return String(n+1);
}
function grupoIng(id){return (DB.gruposIng||[]).find(function(g){return g.id===id})||null}
function insumo(id){return (DB.insumos||[]).find(function(i){return i.id===id})||null}
/* custo médio: média ponderada das compras dos últimos 30 dias, senão a última compra */
function custoMedio30(i){
  var lim=diasAtrasISO(30);
  var c=(i.compras||[]).filter(function(x){return x.data>=lim});
  if(!c.length)return Number(i.custoUltima)||Number(i.custo)||0;
  var q=c.reduce(function(a,x){return a+(Number(x.qtd)||0)},0);
  var v=c.reduce(function(a,x){return a+(Number(x.qtd)||0)*(Number(x.valor)||0)},0);
  return q?+(v/q).toFixed(4):(Number(i.custoUltima)||0);
}
var MODOS_CUSTO=[
 {id:'manual',n:'Custo manual'},
 {id:'ultima',n:'Custo da última compra'},
 {id:'media30',n:'Custo médio (30 dias)'}
];
function nomeModoCusto(id){
  var m=MODOS_CUSTO.find(function(x){return x.id===id});
  return m?m.n:'Custo manual';
}
function custoPorModo(i,modo){
  if(!i)return 0;
  if(modo==='ultima')return Number(i.custoUltima)||0;
  if(modo==='media30')return custoMedio30(i);
  return Number(i.custo)||0;
}
function custoAtual(i){
  if(!i)return 0;
  var v=custoPorModo(i,i.modoCusto||'manual');
  if(!v&&(i.modoCusto||'manual')!=='manual')v=Number(i.custo)||0;
  return v;
}

function exportarInsumos(){
  baseEstoque();
  var l=[['Codigo','Descricao','Unidade','Grupo','Minimo','Atual','Custo','Valor total','Controla estoque','Compoe CMV']];
  (DB.insumos||[]).forEach(function(i){
    var g=grupoIng(i.grupoId);
    l.push([i.codigo,i.nome,un(i.unidade).n,g?g.nome:'',i.estoqueMin,i.estoqueAtual,
      String(custoAtual(i)).replace('.',','),
      String(((Number(i.estoqueAtual)||0)*custoAtual(i)).toFixed(2)).replace('.',','),
      i.controlaEstoque?'Sim':'Nao',i.compoeCMV?'Sim':'Nao']);
  });
  var csv=l.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\n');

var FT={cat:'',sub:'',busca:'',sel:null,loja:'',mostrar:false,abertas:{}};

function proxCodFicha(){
  var n=(DB.fichas||[]).reduce(function(a,f){return Math.max(a,Number(f.codigo)||0)},0);
  return String(n+1).padStart(5,'0');
}
function catFicha(id){return (DB.fichaCats||[]).find(function(c){return c.id===id})||null}
function subFicha(id){
  var achou=null;
  (DB.fichaCats||[]).forEach(function(c){(c.subs||[]).forEach(function(s){if(s.id===id)achou=s})});
  return achou;
}
function custoItem(it){
  var ins=itemComp(it.insumoId);
  if(!ins)return 0;
  var q=Number(it.qtd)||0;
  var perda=Number(it.perda)||0;
  if(perda>0&&perda<100)q=q/(1-perda/100);
  var conv=convUnid(q,it.unidade,ins.unidade);
  if(conv===null)conv=q;
  return +(conv*(ins.custo||0)).toFixed(4);
}
function custoFicha(f){return +((f.itens||[]).reduce(function(a,it){return a+custoItem(it)},0)).toFixed(4)}
function custoPorUnidade(f){var r=Number(f.rendimento)||0;return r?+(custoFicha(f)/r).toFixed(4):0}
function custoPorVenda(f){var u2=Number(f.unidadesVenda)||0;return u2?+(custoFicha(f)/u2).toFixed(4):custoPorUnidade(f)}
function baseFicha(){
  baseEstoque();
  /* limpa a ficha de exemplo que versões antigas criavam */
  DB.fichas=(DB.fichas||[]).filter(function(f){
    return !(/Ficha padrão/i.test(f.nome||'')&&!(f.itens||[]).length);
  });
  if(!DB.fichaCats.length||!DB.fichaCats[0].subs){
    DB.fichaCats=[
      {id:'fc_prod',nome:'Produzido',subs:[
        {id:'fs_art',nome:'Artesanal'},{id:'fs_base',nome:'Base de Gelato'},
        {id:'fs_casc',nome:'Cascão'},{id:'fs_rech',nome:'Recheio'},
        {id:'fs_sorb',nome:'Sorbet'},{id:'fs_zero',nome:'Zero Açúcar'}]},
      {id:'fc_venda',nome:'Vendas',subs:[]}
    ];
  }
  DB.fichaCats.forEach(function(c){c.subs=c.subs||[]});
  DB.fichas.forEach(function(f){
    if(!f.codigo)f.codigo=proxCodFicha();
    if(!f.unidade)f.unidade='un';
    if(!f.itens)f.itens=[];
    if(f.rendimento===undefined)f.rendimento=1;
    if(!f.rendUnidade)f.rendUnidade=f.unidade;
  });
  semearInsumos();
  if(typeof semearDemo==='function')semearDemo();
}

function ligarArrasteFicha(){
  var its=document.querySelectorAll('.insLin');
  for(var i=0;i<its.length;i++){
    its[i].ondragstart=function(e){
      e.dataTransfer.setData('text/plain',this.getAttribute('data-id'));
      this.classList.add('arrastando');};
    its[i].ondragend=function(){this.classList.remove('arrastando')};
  }
  var z=$('dropZona');
  if(z){
    z.ondragover=function(e){e.preventDefault();this.classList.add('over2')};
    z.ondragleave=function(){this.classList.remove('over2')};
    z.ondrop=function(e){e.preventDefault();this.classList.remove('over2');

function motivoVisivel(m){
  if(!m||m.ativo===false)return false;
  if(!m.lojas||!m.lojas.length)return true;   /* vazio = todas as lojas */
  return m.lojas.indexOf(lojaAtual())>=0;
}
/* custo médio dos itens que recebem produção = total produzido / quantidade produzida */
function recalcCustoProducao(){
  var acc={};
  (DB.movEst||[]).forEach(function(m){
    (m.linhas||[]).forEach(function(l){
      if(l.direcao!=='entrada')return;
      if(String(l.origem||'').indexOf('producao')<0)return;
      var ins=itemEstoque(l.insumoId);
      if(!ins)return;
      var q=convUnid(l.qtd,l.unidade,ins.unidade);
      if(q===null)q=l.qtd;
      var cUn=convUnid(1,ins.unidade,l.unidade);
      cUn=(cUn===null)?Number(l.custo)||0:(Number(l.custo)||0)*cUn;
      acc[ins.id]=acc[ins.id]||{q:0,v:0};
      acc[ins.id].q+=q;acc[ins.id].v+=q*cUn;
    });
  });
  Object.keys(acc).forEach(function(id){
    var ins=itemEstoque(id);
    if(!ins||!acc[id].q)return;
    var medio=+(acc[id].v/acc[id].q).toFixed(6);
    if(ins.itens!==undefined&&ins.rendimento!==undefined){
      ins.custoMedio=medio;                 /* destino é ficha técnica */
    }else{
      ins.custo=medio;ins.custoUltima=medio;
      if(!ins.modoCusto)ins.modoCusto='manual';
    }
  });
}
function motivo(id){return (DB.motivosMov||[]).find(function(m){return m.id===id})||null}
function nomeMotivo(id){var m=motivo(id);return m?m.nome:'—'}
function tipoMotivo(id){var m=motivo(id);return m?m.tipo:'saida'}
/* um item da composição pode ser um insumo OU outra ficha técnica */
function itemComp(id){
  var i=insumo(id);
  if(i)return {id:i.id,nome:i.nome,codigo:i.codigo,unidade:i.unidade,tipo:'insumo',
    custo:custoAtual(i)};
  var f=(DB.fichas||[]).find(function(x){return x.id===id});
  if(f)return {id:f.id,nome:f.nome,codigo:f.codigo,unidade:f.rendUnidade||f.unidade,
    tipo:'ficha',custo:custoPorUnidade(f)};
  return null;
}
/* custo do insumo já convertido para a unidade usada na linha */
function custoNaUnidade(ins,unidade){
  if(!ins)return 0;
  var c=custoAtual(ins);
  var q=convUnid(1,unidade,ins.unidade);
  if(q===null)return c;
  return +(c*q).toFixed(6);
}
/* item de estoque = insumo OU ficha técnica marcada como estocável */
function itemEstoque(id){
  var i=insumo(id);
  if(i)return i;
  var f=(DB.fichas||[]).find(function(x){return x.id===id});
  if(f&&f.estocavel!==false){
    if(f.estoqueAtual===undefined)f.estoqueAtual=0;
    if(!f.unidade)f.unidade='un';
    return f;
  }
  return null;
}
function custoDoItem(it){
  if(!it)return 0;
  var eFicha=(it.itens!==undefined&&it.rendimento!==undefined);
  if(!eFicha)return custoAtual(it);
  /* ficha que recebe produção usa o custo médio do que entrou;
     ficha comum usa o custo da própria receita */
  if(Number(it.custoMedio)>0)return Number(it.custoMedio);
  return custoPorUnidade(it);
}
function destinoDaFicha(f){
  if(!f)return null;
  if(f.destinoId==='__nenhum')return null;          /* forçado a não gerar */
  if(f.destinoId)return itemEstoque(f.destinoId);   /* definido nesta ficha */
  var c=catFicha(f.categoriaId);                    /* senão, o padrão do grupo */
  if(c&&c.destinoId)return itemEstoque(c.destinoId);
  return null;
}

/* ---------- APLICAR NO ESTOQUE ---------- */
function ajustaEstoque(ins,qtd,unidade,sinal){
  if(!ins)return 0;
  /* insumo respeita a chave; ficha estocável sempre movimenta */
  var eFicha=(ins.itens!==undefined&&ins.rendimento!==undefined);
  if(!eFicha&&!ins.controlaEstoque)return 0;
  var q=convUnid(qtd,unidade,ins.unidade);
  if(q===null)q=qtd;
  ins.estoqueAtual=+(((Number(ins.estoqueAtual)||0)+sinal*q).toFixed(4));
  return q;
}
/* monta as linhas de um lançamento e aplica no estoque */
function aplicarMovimento(mov,desfazer){
  var mult=desfazer?-1:1;
  (mov.linhas||[]).forEach(function(l){
    var ins=itemEstoque(l.insumoId);
    if(!ins)return;
    var antes=Number(ins.estoqueAtual)||0;
    ajustaEstoque(ins,l.qtd,l.unidade,(l.direcao==='entrada'?1:-1)*mult);
    /* entrada atualiza o custo médio ponderado do item */
    if(!desfazer&&l.direcao==='entrada'&&Number(l.custo)>0&&
       !(ins.itens!==undefined&&ins.rendimento!==undefined)){
      var q=convUnid(l.qtd,l.unidade,ins.unidade);
      if(q===null)q=l.qtd;
      var custoUn=convUnid(1,ins.unidade,l.unidade);
      custoUn=(custoUn===null)?Number(l.custo):Number(l.custo)*custoUn;
      var base=antes>0?antes:0;
      var novo=(base+q)>0?((base*custoAtual(ins)+q*custoUn)/(base+q)):custoUn;
      ins.custo=+novo.toFixed(6);
      ins.custoUltima=+custoUn.toFixed(6);
      if(!ins.modoCusto)ins.modoCusto='manual';
    }
  });
  recalcCustoProducao();
}
/* gera as linhas a partir dos itens lançados */
function montarLinhas(itens,tipo){
  var linhas=[];
  itens.forEach(function(it){
    if(it.tipo==='ficha'){
      var f=(DB.fichas||[]).find(function(x){return x.id===it.refId});
      if(!f)return;
      var rend=Number(f.rendimento)||1;
      var fator=(Number(it.qtd)||0)/rend;
      /* consumo dos ingredientes da receita */
      (f.itens||[]).forEach(function(ci){
        var ins=insumo(ci.insumoId);
        if(!ins)return;
        var q=(Number(ci.qtd)||0)*fator;
        var perda=Number(ci.perda)||0;
        if(perda>0&&perda<100)q=q/(1-perda/100);
        linhas.push({insumoId:ins.id,nome:ins.nome,unidade:ci.unidade,qtd:+q.toFixed(4),
          custo:custoNaUnidade(ins,ci.unidade),direcao:'saida',origem:'ficha:'+f.id,
          fichaId:f.id,fichaNome:f.nome});
      });
      /* entrada do produto acabado no destino */
      if(tipo==='producao'){
        var dest=destinoDaFicha(f);
        if(dest){
          var fat=fatorDestino(f);
          var qDest=+((Number(it.qtd)||0)*fat).toFixed(4);
          /* o custo total produzido se divide pela quantidade que entra no destino */
          var custoDest=qDest?+(((Number(it.qtd)||0)*custoPorUnidade(f))/qDest).toFixed(6):0;
          linhas.push({insumoId:dest.id,nome:dest.nome,
            unidade:(fat===1?it.unidade:dest.unidade),qtd:qDest,
            custo:custoDest,direcao:'entrada',origem:'producao:'+f.id,fichaNome:f.nome});
        }
      }
    }else{
      var i2=insumo(it.refId);
      if(!i2)return;
      linhas.push({insumoId:i2.id,nome:i2.nome,unidade:it.unidade,qtd:Number(it.qtd)||0,
        custo:(it.custo!==''&&it.custo!==undefined&&Number(it.custo)>0)
              ?Number(it.custo):custoNaUnidade(i2,it.unidade),
        direcao:(tipo==='entrada'?'entrada':'saida')});
    }
  });
  return linhas;
}

function excluirMov(id){
  var m=(DB.movEst||[]).find(function(x){return x.id===id});

  if(!confirm('Excluir este lançamento?\n\nO estoque dos itens será desfeito.'))return;

  DB.movEst=DB.movEst.filter(function(x){return x.id!==id});

  toast('Lançamento excluído e estoque desfeito.');

function salvarMovimento(){
  guardarCabMov();
  if(!_movMotivo){toast('Selecione o motivo da movimentação.');return;}
  var itens=_movItens.filter(function(it){return it.tipo&&it.refId&&(Number(it.qtd)||0)>0});
  if(!itens.length){toast('Informe ao menos um item com quantidade.');return;}
  var tipo=tipoMotivo(_movMotivo);
  var semDestino=itens.filter(function(it){
    if(it.tipo!=='ficha'||tipo!=='producao')return false;
    var f=(DB.fichas||[]).find(function(x){return x.id===it.refId});
    return f&&!destinoDaFicha(f);
  });
  if(semDestino.length){
    var nomes=semDestino.map(function(it){
      var f4=(DB.fichas||[]).find(function(x){return x.id===it.refId});
      return f4?f4.nome:'';}).join(', ');
    if(!confirm('ATENÇÃO\n\n'+nomes+' não tem destino de produção definido.\n\n'+
      'Os ingredientes serão baixados, mas NENHUM produto acabado entrará no estoque.\n\n'+
      'Para corrigir: abra a ficha técnica e preencha "Gerar estoque em".\n\nContinuar mesmo assim?'))return;
  }

  var linhas=montarLinhas(itens,tipo);
  if(!linhas.length){toast('Nada a movimentar — verifique se os itens controlam estoque.');return;}
  if(tipo==='producao'){
    var entr=linhas.filter(function(l){return l.direcao==='entrada'});
    var saiu=linhas.filter(function(l){return l.direcao==='saida'});
    var resumo='Confirmar a produção?\n\n'+
      'BAIXA '+saiu.length+' ingrediente(s)\n'+
      (entr.length
        ? 'GERA: '+entr.map(function(l){return fmtQt(l.qtd)+' '+un(l.unidade).ab+' de '+l.nome}).join('\n      ')
        : 'GERA: nada — nenhuma ficha tem destino definido');
    if(!confirm(resumo))return;
  }
  var mov={id:uid('mv'),data:$('mvD').value||hojeISO(),hora:$('mvH').value||agoraHM(),
    motivoId:_movMotivo,identificacao:_movIdent,obs:_movObs,
    itens:JSON.parse(JSON.stringify(itens)),linhas:linhas,origem:'manual'};
  DB.movEst.push(mov);
  aplicarMovimento(mov);
  salvar();
  fecharMov();
  toast('Movimentação registrada — '+linhas.length+' linha(s) de estoque.');
}

/* devolve ao estoque o que a venda tinha baixado */
function estornarEstoqueVenda(ped){
  baseMov();

  if(!movs.length)return 0;
  movs.forEach(function(m){aplicarMovimento(m,true)});

/* ---------- BAIXA AUTOMÁTICA PELA VENDA ---------- */
function baixarEstoqueVenda(ped){
  baseMov();
  var linhas=[];
  (ped.itens||[]).forEach(function(it){
    var p=(DB.produtos||[]).find(function(x){return x.id===it.produtoId});
    if(!p||!p.vinculaEstoque)return;
    var q=Number(it.qtd)||1;
    if(p.insumoId){
      var ins=insumo(p.insumoId);
      if(!ins)return;
      var qq=(Number(p.insumoQtd)||1)*q;
      var uL=p.insumoUn||ins.unidade;
      linhas.push({insumoId:ins.id,nome:ins.nome,unidade:uL,qtd:+qq.toFixed(4),
        custo:custoNaUnidade(ins,uL),direcao:'saida',origem:'venda'});
    }else if(p.fichaId){
      var f=(DB.fichas||[]).find(function(x){return x.id===p.fichaId});
      if(!f)return;
      var dest=destinoDaFicha(f);
      var porUn=(Number(f.unidadesVenda)||Number(f.rendimento)||1);
      if(dest){
        /* o produto pronto sai do estoque do destino (ex.: Gelato Venda) */
        var qd=(Number(f.rendimento)||1)/porUn*q;
        linhas.push({insumoId:dest.id,nome:dest.nome,unidade:f.rendUnidade||f.unidade,
          qtd:+qd.toFixed(4),custo:custoPorUnidade(f),direcao:'saida',origem:'venda',fichaNome:f.nome});
      }else{
        /* sem destino: baixa os ingredientes da receita */
        var fator=q/porUn;
        (f.itens||[]).forEach(function(ci){
          var i2=insumo(ci.insumoId);
          if(!i2)return;
          var qc=(Number(ci.qtd)||0)*fator;
          linhas.push({insumoId:i2.id,nome:i2.nome,unidade:ci.unidade,qtd:+qc.toFixed(4),
            custo:custoNaUnidade(i2,ci.unidade),direcao:'saida',origem:'venda',
            fichaId:f.id,fichaNome:f.nome});
        });
      }
    }
  });
  if(!linhas.length)return 0;
  var mov={id:uid('mv'),data:(ped.data||'').slice(0,10)||hojeISO(),hora:ped.hora||agoraHM(),
    motivoId:'mv_venda',identificacao:'Pedido #'+ped.numero,
    obs:ped.clienteNome||'',linhas:linhas,origem:'venda',pedidoId:ped.id};
  DB.movEst.push(mov);
  aplicarMovimento(mov);
  return linhas.length;
}

function fecharContagem(){
  baseMov();
  var linhas=[],det=[],perda=0,ganho=0;
  itensEstoque().forEach(function(i){
    var c=CT.cont[i.id];
    if(c===undefined||c==='')return;
    var sis=Number(i.estoqueAtual)||0;
    var conf=parseFloat(c)||0;
    var d=+(conf-sis).toFixed(4);
    var v=d*custoAtual(i);
    det.push({insumoId:i.id,nome:i.nome,unidade:i.unidade,sistema:sis,conferido:conf,
      diferenca:d,custo:custoAtual(i),valor:+v.toFixed(2)});
    if(d<0)perda+=v; else ganho+=v;
    if(Math.abs(d)<0.0001)return;
    linhas.push({insumoId:i.id,nome:i.nome,unidade:i.unidade,qtd:Math.abs(d),
      custo:custoAtual(i),direcao:(d>0?'entrada':'saida'),origem:'contagem',
      sistema:sis,conferido:conf,diferenca:d});
  });
  if(!det.length){toast('Informe a quantidade conferida de ao menos um item.');return;}
  if(!confirm('Finalizar a contagem?\n\n'+det.length+' item(ns) conferido(s), '+linhas.length+' com diferença.\n'+
    'Sobra R$ '+money(ganho)+' · Perda R$ '+money(Math.abs(perda))+'\n\n'+
    'O estoque será ajustado e o lançamento vai para a movimentação.'))return;
  var ag=new Date();
  var mov={id:uid('mv'),data:hojeISO(),hora:agoraHM(),motivoId:'mv_cont',
    identificacao:'Contagem '+ag.toLocaleDateString('pt-BR'),
    obs:det.length+' itens conferidos',linhas:linhas,origem:'contagem'};
  DB.movEst.push(mov);
  aplicarMovimento(mov);
  DB.contagens.push({id:uid('ct'),data:hojeISO(),hora:agoraHM(),movId:mov.id,
    itens:det,perda:+perda.toFixed(2),ganho:+ganho.toFixed(2),
    resultado:+(ganho+perda).toFixed(2),loja:lojaAtual()});
  CT.cont={};CT.aba='hist';salvar();telaContagem();
  toast('Contagem finalizada. Estoque ajustado e lançado na movimentação.');
}

/* todas as linhas de movimento, achatadas */
function linhasHist(filtro){
  var out=[];
  (DB.movEst||[]).forEach(function(m){
    if(HP.de&&m.data<HP.de)return;
    if(HP.ate&&m.data>HP.ate)return;
    if(HP.motivoId&&m.motivoId!==HP.motivoId)return;
    (m.linhas||[]).forEach(function(l){
      var ins=itemEstoque(l.insumoId);
      if(HP.grupo&&(!ins||(ins.grupoId!==HP.grupo&&ins.categoriaId!==HP.grupo)))return;
      if(filtro&&l.insumoId!==filtro)return;
      out.push({m:m,l:l,ins:ins});
    });
  });
  return out.sort(function(a,b){return (a.m.data+a.m.hora).localeCompare(b.m.data+b.m.hora)});
}
function destinoLinha(x){
  var l=x.l,m=x.m;
  if(l.fichaNome)return (l.direcao==='entrada'?'produzido a partir de ':'usado em ')+l.fichaNome;
  if(m.origem==='venda')return 'venda no PDV · '+(m.identificacao||'');
  if(m.origem==='contagem')return 'ajuste de contagem';
  return nomeMotivo(m.motivoId);
}

/* Só filtra quando o item for escolhido de verdade — nome completo ou código.
   Enquanto você digita, a lista continua aberta mostrando tudo que combina. */
function escolheItemHP(txt){
  var t=String(txt||'').trim().toLowerCase();
  if(!t){ if(HP.item){HP.item='';telaHistPosicao();} return; }
  var lista=itensEstoque();
  var achou=lista.find(function(i){return (i.nome||'').toLowerCase()===t})
        || lista.find(function(i){return String(i.codigo||'').toLowerCase()===t});
  if(achou){ if(achou.id!==HP.item){HP.item=achou.id;telaHistPosicao();} return; }
  /* digitou algo que ainda não é um item: mantém a busca aberta */
  if(HP.item){HP.item='';telaHistPosicao();}
}
function limparItemHP(){HP.item='';_focoBusca='';telaHistPosicao();}
function mudaAbaHP(a){HP.aba=a;telaHistPosicao();}
