function blocoRastreio(){
  if(!HP.item)return '<div class="mvVazio" style="padding:64px">'+sv('search',26)+
   '<b>Escolha um item para rastrear</b>'+
   '<span>Você verá cada entrada e saída, para onde foi e o saldo depois de cada movimento.</span></div>';
  var i=itemEstoque(HP.item);
  if(!i)return '';
  var lin=linhasHist(HP.item);
  var ent=lin.filter(function(x){return x.l.direcao==='entrada'});
  var sai=lin.filter(function(x){return x.l.direcao==='saida'});
  function soma(arr){return arr.reduce(function(a,x){
    var q=convUnid(x.l.qtd,x.l.unidade,i.unidade);return a+(q===null?x.l.qtd:q)},0)}
  var qEnt=soma(ent),qSai=soma(sai);
  var vEnt=ent.reduce(function(a,x){return a+x.l.qtd*x.l.custo},0);
  var vSai=sai.reduce(function(a,x){return a+x.l.qtd*x.l.custo},0);
  /* saldo retroativo: parte do estoque atual e volta */
  var saldoFinal=Number(i.estoqueAtual)||0;
  var saldos=[],acc=saldoFinal;
  for(var k=lin.length-1;k>=0;k--){
    saldos[k]=acc;
    var q=convUnid(lin[k].l.qtd,lin[k].l.unidade,i.unidade);
    if(q===null)q=lin[k].l.qtd;
    acc=acc-(lin[k].l.direcao==='entrada'?q:-q);
  }
  var saldoInicial=acc;

  /* para onde foi */
  var destinos={};
  sai.forEach(function(x){
    var d=x.l.fichaNome||(x.m.origem==='venda'?'Venda no PDV':nomeMotivo(x.m.motivoId));
    var q=convUnid(x.l.qtd,x.l.unidade,i.unidade);
    if(q===null)q=x.l.qtd;
    destinos[d]=destinos[d]||{q:0,v:0,n:0};
    destinos[d].q+=q;destinos[d].v+=x.l.qtd*x.l.custo;destinos[d].n++;
  });
  var dest=Object.keys(destinos).map(function(k2){return {nome:k2,d:destinos[k2]}})
    .sort(function(a,b){return b.d.q-a.d.q});

  return '<div class="hpGrade">'+
   '<div class="hpCol">'+
    '<div class="hpCard">'+
     '<div class="hpH">'+sv('box',15)+' '+E(i.nome)+
      '<span class="hpUn">'+un(i.unidade).n+'</span></div>'+
     '<div class="hpNums">'+
      '<div class="hpN"><span>Saldo no início</span><b>'+fmtQt(saldoInicial)+'</b></div>'+
      '<div class="hpN"><span>Entrou</span><b class="vg">+'+fmtQt(qEnt)+'</b></div>'+
      '<div class="hpN"><span>Saiu</span><b class="vr">-'+fmtQt(qSai)+'</b></div>'+
      '<div class="hpN dest4"><span>Saldo atual</span><b>'+fmtQt(saldoFinal)+'</b></div>'+
     '</div>'+
     '<div class="hpNums" style="border-top:1px solid var(--line-2)">'+
      '<div class="hpN"><span>Valor que entrou</span><b class="vg">R$ '+money(vEnt)+'</b></div>'+
      '<div class="hpN"><span>Valor consumido</span><b class="vr">R$ '+money(vSai)+'</b></div>'+
      '<div class="hpN"><span>Custo médio hoje</span><b>R$ '+money(custoDoItem(i))+'</b></div>'+
      '<div class="hpN"><span>Valor em estoque</span><b>R$ '+money(saldoFinal*custoDoItem(i))+'</b></div>'+
     '</div></div>'+
    '<div class="hpCard">'+
     '<div class="hpH">'+sv('cr',14)+' Para onde foi</div>'+
     (dest.length?'<table class="hpTab"><tbody>'+dest.map(function(d){
       var pc=qSai?(d.d.q/qSai*100):0;
       return '<tr><td><b>'+E(d.nome)+'</b><small>'+d.d.n+' movimento(s)</small></td>'+
       '<td style="width:110px;text-align:right">'+fmtQt(d.d.q)+' '+un(i.unidade).ab+'</td>'+
       '<td style="width:100px;text-align:right">R$ '+money(d.d.v)+'</td>'+
       '<td style="width:90px"><span class="hpBar"><i style="width:'+Math.min(100,pc)+'%"></i></span>'+
       '<small>'+pc.toFixed(0)+'%</small></td></tr>';
     }).join('')+'</tbody></table>'
     :'<div class="hint" style="padding:16px">Este item ainda não teve saída.</div>')+
    '</div></div>'+
   '<div class="hpCol">'+
    '<div class="hpCard">'+
     '<div class="hpH">'+sv('list',14)+' Linha do tempo — '+lin.length+' movimentos</div>'+
     (lin.length?'<div class="hpTimeW"><table class="hpTab"><thead><tr>'+
      '<th style="width:92px">Data</th><th>Movimento</th>'+
      '<th style="width:104px;text-align:right">Qtd</th>'+
      '<th style="width:96px;text-align:right">Saldo</th>'+
      '<th style="width:96px;text-align:right">Valor</th></tr></thead><tbody>'+
      lin.slice().reverse().map(function(x,idx){
        var k3=lin.length-1-idx;
        var q=convUnid(x.l.qtd,x.l.unidade,i.unidade);
        if(q===null)q=x.l.qtd;
        return '<tr class="'+(x.l.direcao==='entrada'?'ent':'sai')+'">'+
        '<td>'+dataBR(x.m.data)+'<small>'+E(x.m.hora||'')+'</small></td>'+
        '<td><b>'+E(nomeMotivo(x.m.motivoId))+'</b><small>'+E(destinoLinha(x))+'</small></td>'+
        '<td style="text-align:right"><b class="'+(x.l.direcao==='entrada'?'vg':'vr')+'">'+
         (x.l.direcao==='entrada'?'+':'-')+fmtQt(x.l.qtd)+' '+un(x.l.unidade).ab+'</b></td>'+
        '<td style="text-align:right">'+fmtQt(saldos[k3])+'</td>'+
        '<td style="text-align:right">R$ '+money(x.l.qtd*x.l.custo)+'</td></tr>';
      }).join('')+'</tbody></table></div>'
     :'<div class="hint" style="padding:20px">Nenhum movimento no período.</div>')+
    '</div></div></div>';
}

/* ---------- RANKINGS ---------- */
function blocoRanking(){
  var lin=linhasHist();
  function agrupa(fn,filtro){
    var m={};
    lin.forEach(function(x){
      if(filtro&&!filtro(x))return;
      var k=fn(x);
      if(!k)return;
      var ins=x.ins;
      var q=ins?convUnid(x.l.qtd,x.l.unidade,ins.unidade):x.l.qtd;
      if(q===null)q=x.l.qtd;
      m[k]=m[k]||{q:0,v:0,n:0,un:ins?un(ins.unidade).ab:''};
      m[k].q+=q;m[k].v+=x.l.qtd*x.l.custo;m[k].n++;
    });
    return Object.keys(m).map(function(k){return {nome:k,d:m[k]}})
      .sort(function(a,b){return b.d.q-a.d.q});
  }
  var produzidos=agrupa(function(x){return x.l.direcao==='entrada'?x.l.fichaNome:null},
    function(x){return String(x.l.origem||'').indexOf('producao')>=0});
  var consumidos=agrupa(function(x){return x.l.nome},
    function(x){return x.l.direcao==='saida'});
  var vendidos=agrupa(function(x){return x.l.fichaNome||x.l.nome},
    function(x){return x.m.origem==='venda'});

  function painel(titulo,icone,lista,rot){
    var tot=lista.reduce(function(a,x){return a+x.d.q},0);
    return '<div class="hpCard">'+
     '<div class="hpH">'+sv(icone,14)+' '+titulo+'</div>'+
     (lista.length?'<table class="hpTab"><tbody>'+lista.slice(0,12).map(function(x,k){
       var pc=tot?(x.d.q/tot*100):0;
       return '<tr><td style="width:26px"><span class="posN">'+(k+1)+'</span></td>'+
       '<td><b>'+E(x.nome)+'</b><small>'+x.d.n+' '+rot+'</small></td>'+
       '<td style="width:110px;text-align:right"><b>'+fmtQt(x.d.q)+' '+x.d.un+'</b></td>'+
       '<td style="width:100px;text-align:right">R$ '+money(x.d.v)+'</td>'+
       '<td style="width:86px"><span class="hpBar"><i style="width:'+Math.min(100,pc)+'%"></i></span>'+
       '<small>'+pc.toFixed(0)+'%</small></td></tr>';
     }).join('')+'</tbody></table>'
     :'<div class="hint" style="padding:16px">Nada no período.</div>')+
    '</div>';
  }
  return '<div class="hpGrade um">'+
   painel('Sabores mais produzidos','box',produzidos,'produção(ões)')+
   painel('Itens mais consumidos','dn4',consumidos,'saída(s)')+
   painel('Mais vendidos (baixa por venda)','cart',vendidos,'venda(s)')+
  '</div>';
}

function exportarHist(){
  var lin=linhasHist(HP.aba==='rastreio'?HP.item:'');
  var l=[['Data','Hora','Motivo','Item','Grupo','Origem/destino','Direcao','Quantidade','Unidade','Custo','Valor']];
  lin.forEach(function(x){
    var g=x.ins?grupoIng(x.ins.grupoId):null;
    l.push([dataBR(x.m.data),x.m.hora||'',nomeMotivo(x.m.motivoId),x.l.nome,g?g.nome:'',
      destinoLinha(x),x.l.direcao,String(x.l.qtd).replace('.',','),un(x.l.unidade).ab,
      String(x.l.custo).replace('.',','),String((x.l.qtd*x.l.custo).toFixed(2)).replace('.',',')]);
  });
  var csv=l.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\n');
  var b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='nexor-historico-estoque.csv';document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove()},400);
  toast('Histórico exportado.');
}

function finalizarNota(lancs){
  var n=_nota;
  if(!n){telaNotas();return;}
  n.id=uid('nf');n.hora=agoraHM();
  n.receber=n.receber!==false;
  n.lancIds=(lancs||[]).map(function(l){return l.id});
  var prim=(lancs||[])[0]||{};
  n.pagamento={tipo:(lancs&&lancs.length>1)?'Parcelado':(prim.pago?'À vista':'A prazo'),
    parcelas:(lancs||[]).length,contaId:prim.contaId||'',
    metodoId:prim.metodoId||'',categoriaId:prim.categoriaId||''};

  /* entrada no estoque */
  if(n.receber){
    var linhas=n.itens.filter(function(it){
      var i2=insumo(it.insumoId);
      return i2&&i2.controlaEstoque!==false;      /* respeita o cadastro do ingrediente */
    }).map(function(it){
      return {insumoId:it.insumoId,nome:it.nome,unidade:it.unidade,qtd:it.qtd,
        custo:+(it.total/it.qtd).toFixed(6),direcao:'entrada',origem:'nota'};
    });
    if(linhas.length){
      var mov={id:uid('mv'),data:n.data,hora:n.hora,motivoId:'mv_nota',
        identificacao:'NF '+n.numero,obs:n.fornecedorNome,linhas:linhas,
        origem:'nota',notaId:n.id};
      DB.movEst.push(mov);
      aplicarMovimento(mov);
      n.movId=mov.id;
    }
    n.itens.forEach(function(it){
      var i2=insumo(it.insumoId);
      if(!i2)return;
      i2.compras=i2.compras||[];
      i2.compras.push({data:n.data,qtd:it.qtd,valor:+(it.total/it.qtd).toFixed(6),notaId:n.id});
      i2.custoUltima=+(it.total/it.qtd).toFixed(6);
    });
  }
  /* amarra os lançamentos à nota */
  (lancs||[]).forEach(function(l){
    l.origem='nota-entrada';l.ref=n.id;
    l.fornecedor=n.fornecedorNome;l.fornecedorId=n.fornecedorId;
  });

  DB.notas.push(n);
  salvar();
  var o=document.getElementById('mdOv');if(o)o.remove();
  _nota=null;_itemSel=null;
  telaNotas();
  toast('Nota lançada — estoque '+(n.receber?'atualizado':'não movimentado')+
    ' e '+(lancs||[]).length+' lançamento(s) no financeiro.');
}

/* ---------- VER / EXCLUIR ---------- */
function verNota(id){
  var n=(DB.notas||[]).find(function(x){return x.id===id});
  if(!n)return;
  var lanc=(DB.lancFin||[]).filter(function(l){return l.ref===n.id&&l.origem==='nota-entrada'});
  var h='<div class="mdB">'+
  '<div class="acHead"><div class="av3" style="width:42px;height:42px">'+sv('box',18)+'</div>'+
  '<div><b>Nota '+E(n.numero)+' · '+E(n.fornecedorNome)+'</b>'+
  '<span>'+dataBR(n.data)+' '+E(n.hora||'')+' · '+(n.itens||[]).length+' itens</span>'+
  '<span>'+E((n.pagamento&&n.pagamento.tipo)||'')+
   (n.pagamento&&n.pagamento.parcelas>1?' em '+n.pagamento.parcelas+'x':'')+'</span></div>'+
  '<div style="text-align:right"><span class="hint">Total</span>'+
  '<b style="display:block;font-size:20px;color:var(--acc-d)">R$ '+money(n.valorTotal)+'</b></div></div>'+
  '<div class="blk" style="margin:0 0 11px;max-width:none;padding:0;overflow:hidden">'+
   '<div class="acTit">Mercadorias</div>'+
   '<div class="acTabW" style="max-height:280px"><table class="acTab"><thead><tr>'+
    '<th>Mercadoria</th><th style="width:100px;text-align:right">Qtd</th>'+
    '<th style="width:110px;text-align:right">Valor un.</th>'+
    '<th style="width:110px;text-align:right">Total</th></tr></thead><tbody>'+
    (n.itens||[]).map(function(it){
      return '<tr><td><b>'+E(it.nome)+'</b></td>'+
      '<td style="text-align:right">'+fmtQt(it.qtd)+' '+un(it.unidade).ab+'</td>'+
      '<td style="text-align:right">'+money(it.valorUn)+'</td>'+
      '<td style="text-align:right"><b>'+money(it.total)+'</b></td></tr>';
    }).join('')+'</tbody></table></div></div>'+
  (lanc.length?'<div class="blk" style="margin:0;max-width:none;padding:0;overflow:hidden">'+
   '<div class="acTit">Lançamentos no financeiro</div><table class="acTab"><tbody>'+
   lanc.map(function(l){
     return '<tr><td>'+E(l.descricao)+'<small style="display:block;color:var(--ink-3)">'+
     'vence '+dataBR(l.vencimento)+' · '+(l.pago?'pago':'em aberto')+'</small></td>'+
     '<td style="text-align:right;width:130px"><b>R$ '+money(l.valor)+'</b></td></tr>';
   }).join('')+'</tbody></table></div>':'')+
  '</div>';
  var o=document.createElement('div');o.className='mdOv';o.id='mdOv';
  o.innerHTML='<div class="mdBox xl"><div class="mdH"><b>Nota de entrada</b>'+
  '<button onclick="fecharModal()">&times;</button></div>'+h+
  '<div class="mdF"><button class="btnP2" onclick="fecharModal()">Fechar</button>'+
  '<button class="btnP2 rdB" onclick="excluirNota(\''+n.id+'\')">'+sv('trash',13)+' Excluir nota</button></div></div>';
  document.body.appendChild(o);
  fecharSoForaDeVerdade(o);
}
function excluirNota(id){
  var n=(DB.notas||[]).find(function(x){return x.id===id});
  if(!n)return;
  var pagos=(DB.lancFin||[]).filter(function(l){return l.ref===n.id&&l.conciliado}).length;
  if(pagos){toast('Esta nota tem lançamento conciliado no banco. Desconcilie antes de excluir.');return;}
  if(!confirm('Excluir a nota '+n.numero+'?\n\nO estoque será devolvido e os lançamentos financeiros removidos.'))return;
  var mov=(DB.movEst||[]).find(function(m){return m.id===n.movId});
  if(mov){aplicarMovimento(mov,true);DB.movEst=DB.movEst.filter(function(m){return m.id!==n.movId});}
  (n.itens||[]).forEach(function(it){
    var i2=insumo(it.insumoId);
    if(i2&&i2.compras)i2.compras=i2.compras.filter(function(c){return c.notaId!==n.id});
  });
  DB.lancFin=(DB.lancFin||[]).filter(function(l){return !(l.ref===n.id&&l.origem==='nota-entrada')});
  DB.notas=DB.notas.filter(function(x){return x.id!==id});
  salvar();fecharModal();telaNotas();
  toast('Nota excluída, estoque devolvido e financeiro limpo.');
}
function exportarNotas(){
  baseNotas();
  var l=[['Numero','Data','Fornecedor','Mercadoria','Qtd','Unidade','Valor un','Desconto','Total']];
  (DB.notas||[]).forEach(function(n){
    if(NT.de&&n.data<NT.de)return;
    if(NT.ate&&n.data>NT.ate)return;
    (n.itens||[]).forEach(function(it){
      l.push([n.numero,dataBR(n.data),n.fornecedorNome,it.nome,
        String(it.qtd).replace('.',','),un(it.unidade).ab,
        String(it.valorUn).replace('.',','),String(it.desconto||0).replace('.',','),
        String(it.total).replace('.',',')]);
    });
  });
  var csv=l.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(';')}).join('\n');
  var b=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='nexor-notas-entrada.csv';document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove()},400);
  toast('Notas exportadas.');
}

/* ---------- POPUP E MODAL ---------- */
function pop(ev,html){
  var el=document.createElement('div');
  el.className='popMenu';el.innerHTML=html;
  document.body.appendChild(el);
  var r=ev.currentTarget.getBoundingClientRect();
  var top=r.bottom+5,left=r.left;
  if(left+el.offsetWidth>window.innerWidth-10)left=window.innerWidth-el.offsetWidth-10;
  if(top+el.offsetHeight>window.innerHeight-10)top=r.top-el.offsetHeight-5;
  el.style.top=top+'px';el.style.left=left+'px';
  return el;
}
function modal(titulo,corpo,btn,onOk,tam){
  var o=document.createElement('div');o.className='mdOv';o.id='mdOv';
  o.innerHTML='<div class="mdBox'+(tam==='lg'?' lg':'')+'"><div class="mdH"><b>'+E(titulo)+'</b>'+
  '<button onclick="fecharModal()">&times;</button></div>'+corpo+
  '<div class="mdF"><button class="btn" onclick="fecharModal()">Cancelar</button>'+
  '<button class="btn p" id="mdOk">'+E(btn)+'</button></div></div>';
  document.body.appendChild(o);
  fecharSoForaDeVerdade(o);
  $('mdOk').onclick=function(){var f=onOk?onOk():true;if(f!==false)fecharModal();};
}
/* fechar ao clicar fora só vale se o clique nasceu fora.
   Antes, arrastar para selecionar um valor dentro do campo fechava a janela
   e perdia tudo que estava preenchido. */
function fecharSoForaDeVerdade(o){
  var nasceuFora=false;
  o.addEventListener('mousedown',function(e){nasceuFora=(e.target===o);});
  o.addEventListener('click',function(e){
    if(e.target===o&&nasceuFora)fecharModal();
    nasceuFora=false;
  });
}
function fecharModal(){var o=$('mdOv');if(o)o.remove();}
</script>
