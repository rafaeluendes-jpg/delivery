<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Nexor</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#122A42; --band:#EDF2F7; --band-2:#E2EAF2; --band-line:#CFDBE6;
  --bg:#EAEFF4; --panel:#FFF; --line:#D7E0E9; --line-2:#EAEFF4;
  --ink:#12212F; --ink-2:#4E5F73; --ink-3:#8394A6;
  --acc:#00A08B; --acc-d:#00806F; --acc-l:#33BCA9; --acc-soft:#E0F5F1;
  --blue:#2C6FD1; --blue-soft:#E8F0FC;
  --red:#C94141; --red-soft:#FCEBEB; --amber:#B8730B; --amber-soft:#FDF4E3;
  --alt:#F7FAFC;
  --sh:0 1px 2px rgba(18,42,66,.06),0 2px 5px rgba(18,42,66,.05);
  --sh2:0 16px 40px rgba(18,42,66,.18),0 3px 10px rgba(18,42,66,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:400 13px/1.45 'Inter',-apple-system,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--ink);
  height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.hide{display:none!important}

/* ---------- LOGIN ---------- */
#login{height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(1100px 620px at 14% 10%,#1D4A70,transparent 60%),
             radial-gradient(900px 520px at 88% 90%,#0A6558,transparent 60%),var(--deep)}
.lgCard{width:740px;max-width:96vw;display:grid;grid-template-columns:1fr 300px;
  background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 30px 80px rgba(5,16,28,.55)}
.lgL{padding:38px 36px}
.lgHd{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.lgMk{width:36px;height:36px;border-radius:10px;background:linear-gradient(140deg,var(--acc-l),var(--acc-d));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.lgHd b{font-size:17px;letter-spacing:.2em;font-weight:600}
.lgL h1{font-size:19px;font-weight:600}
.lgL .sb{color:var(--ink-2);font-size:13px;margin:4px 0 24px}
.f{margin-bottom:13px}
.f label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.f .w{position:relative}
.f input{width:100%;height:40px;border:1px solid var(--line);border-radius:9px;padding:0 38px 0 12px;outline:none}
.f input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.eye{position:absolute;right:5px;top:5px;width:30px;height:30px;border:none;background:none;cursor:pointer;
  color:var(--ink-3);display:flex;align-items:center;justify-content:center;border-radius:6px}
.lgErr{min-height:19px;font-size:12.5px;color:var(--red);font-weight:500;margin-bottom:6px}
.lgBtn{width:100%;height:42px;background:var(--acc);border:none;border-radius:9px;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.lgBtn:hover{background:var(--acc-d)}
.lgNote{margin-top:22px;padding-top:16px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--ink-3);text-align:center}
.lgR{background:linear-gradient(155deg,var(--deep),#0C5F55);color:#fff;padding:32px 24px;display:flex;
  flex-direction:column;justify-content:center;align-items:center;text-align:center;position:relative;overflow:hidden}
.lgOrb{width:76px;height:76px;border-radius:50%;background:linear-gradient(140deg,var(--acc-l),var(--acc-d));
  display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin-bottom:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 -6px 18px rgba(0,0,0,.2)}
.lgR h2{font-size:27px;font-weight:300;letter-spacing:2px}
.lgR p{font-size:11.5px;color:rgba(255,255,255,.6);margin-top:6px}
.shake{animation:sk .34s}
@keyframes sk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- SHELL ---------- */
#app{height:100vh;display:flex;flex-direction:column}
.hdr{height:44px;background:var(--deep);display:flex;align-items:center;gap:10px;padding:0 14px;flex:none}
.hMk{width:27px;height:27px;border-radius:7px;background:linear-gradient(140deg,var(--acc-l),var(--acc-d));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none}
.hNm{color:#fff;font-weight:600;letter-spacing:.2em;font-size:13.5px}
.hGrow{flex:1}
.hSearch{display:flex;align-items:center;gap:8px;height:29px;padding:0 10px;border-radius:7px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:#89A0B6;cursor:pointer;font-size:12.5px;min-width:190px}
.hSearch:hover{background:rgba(255,255,255,.14);color:#D3E0EA}
.hSearch kbd{margin-left:auto;font:600 10px 'Inter';background:rgba(255,255,255,.13);border-radius:4px;padding:2px 5px}
.hIc{width:31px;height:31px;border:none;background:none;border-radius:7px;cursor:pointer;color:#89A0B6;
  display:flex;align-items:center;justify-content:center;position:relative}
.hIc:hover{background:rgba(255,255,255,.1);color:#fff}
.hBadge{position:absolute;top:2px;right:2px;min-width:15px;height:15px;border-radius:8px;background:var(--red);
  color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px}
.hUsr{display:flex;align-items:center;gap:8px;padding-left:11px;border-left:1px solid rgba(255,255,255,.12)}
.hAv{width:27px;height:27px;border-radius:7px;background:linear-gradient(140deg,var(--acc-l),var(--acc-d));
  color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11.5px}
.hUsr b{display:block;color:#fff;font-size:12px;font-weight:600;line-height:1.1}
.hUsr span{display:block;color:#7A91A8;font-size:10px}
.hPwr{width:29px;height:26px;border:none;border-radius:6px;background:#B23A3A;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-left:4px}

.band{background:linear-gradient(180deg,#F6F9FC,var(--band-2));border-bottom:1px solid var(--band-line);flex:none;position:relative;z-index:40}
.bandRow{display:flex;align-items:center;gap:4px;padding:6px 12px;overflow-x:auto;position:relative}
.bandRow::-webkit-scrollbar{height:0}
.mIco{position:relative;width:72px;padding:5px 3px 5px;border:1px solid transparent;border-radius:8px;background:none;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;flex:none;transition:.15s}
.mIco .tile{width:26px;height:26px;display:flex;align-items:center;justify-content:center;color:#63758A;transition:.15s}
.mIco .lb{font-size:9.5px;line-height:1.2;font-weight:600;color:#63758A;text-align:center;max-width:66px;transition:.15s}
.mIco:hover{background:#fff;border-color:var(--band-line)}
.mIco:hover .tile,.mIco:hover .lb{color:var(--deep)}
.mIco.on{background:#fff;border-color:var(--band-line);box-shadow:var(--sh)}
.mIco.on .tile,.mIco.on .lb{color:var(--acc-d)}
.mIco.on:before{content:'';position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--acc);border-radius:2px}
.bandGrow{flex:1}
.bandSuc{display:flex;align-items:center;gap:8px;height:32px;padding:0 11px;border:1px solid var(--band-line);
  background:#fff;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.bandSuc i{font-style:normal;font-size:10px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.drop{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1);background:#fff}
.drop.op{max-height:560px;border-top:1px solid var(--band-line);box-shadow:0 10px 24px -14px rgba(18,42,66,.5)}
.dropHd{padding:13px 18px 4px;display:flex;align-items:center;gap:9px}
.dropHd .dh{width:27px;height:27px;border-radius:7px;display:flex;align-items:center;justify-content:center;
  color:var(--acc-d);background:var(--acc-soft);border:1px solid #C7EAE3}
.dropHd b{font-size:13.5px;font-weight:600}
.dropIn{padding:8px 14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:4px}
.dItem{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid transparent;border-radius:8px;
  background:none;cursor:pointer;text-align:left;font-size:12.8px;color:var(--ink-2);opacity:0;transform:translateY(-10px)}
.drop.op .dItem{opacity:1;transform:translateY(0);transition:opacity .3s,transform .3s cubic-bezier(.2,.8,.3,1),background .14s,color .14s}
.dItem:hover{background:var(--acc-soft);border-color:#BFEBE3;color:var(--acc-d)}
.dItem.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.dItem .di{width:6px;height:6px;border-radius:50%;background:#C4D2DE;flex:none}
.dItem.on .di{background:#fff}
.sucMenu{position:absolute;top:52px;right:14px;width:230px;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--sh2);z-index:60;padding:5px}
.sucMenu .h{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;padding:8px 9px 5px}
.sucMenu button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;border:none;
  background:none;padding:8px 9px;border-radius:6px;cursor:pointer;font-size:12.5px}
.sucMenu button:hover{background:var(--alt)}
.sucMenu button.on{background:var(--acc-soft);color:var(--acc-d);font-weight:600}

.work{flex:1;display:flex;flex-direction:column;overflow:hidden}
.wTitle{height:32px;background:linear-gradient(180deg,#FDFEFF,#EFF4F9);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:9px;padding:0 14px;flex:none}
.wTitle b{font-size:13.5px;font-weight:600;color:var(--deep)}
.wTitle span{font-size:11.5px;color:var(--ink-3)}
#content{flex:1;overflow:hidden;display:flex;flex-direction:column}
.stat{height:26px;background:linear-gradient(180deg,#F6F9FC,#E9EFF5);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 14px;font-size:11px;color:var(--ink-3);flex:none}
.stat b{color:var(--ink-2);font-weight:600}
.stat .gw{flex:1}
.stat .live{display:flex;align-items:center;gap:6px}
.stat .live i{width:7px;height:7px;border-radius:50%;background:var(--acc);display:block}
.stat .logo{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--deep);letter-spacing:.12em}
.stat .logo em{width:15px;height:15px;border-radius:4px;background:linear-gradient(140deg,var(--acc-l),var(--acc-d));
  color:#fff;font-style:normal;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:700}

.brandBg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel)}
.brandBg .orb{width:104px;height:104px;border-radius:50%;background:linear-gradient(140deg,var(--acc-l),var(--acc-d));
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px;font-weight:700;
  box-shadow:0 14px 40px rgba(0,160,139,.28),inset 0 -8px 22px rgba(0,0,0,.18)}
.brandBg h2{font-size:38px;font-weight:300;letter-spacing:3px;color:var(--deep);opacity:.28;margin-top:14px}
.brandBg p{font-size:12.5px;color:var(--ink-3)}
.brandBg .hint{margin-top:20px;font-size:12px;color:var(--ink-3);background:var(--alt);border:1px solid var(--line-2);padding:7px 14px;border-radius:20px}

/* ---------- BOTOES ---------- */
.btn{height:34px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;
  font-size:12.8px;font-weight:600;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;transition:.14s}
.btn:hover{border-color:var(--acc);color:var(--acc-d);background:var(--acc-soft)}
.btn.p{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.p:hover{background:var(--acc-d);color:#fff}
.btn.b2{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.b2:hover{background:#245CB0;color:#fff}
.btn.sm{height:30px;padding:0 11px;font-size:12px}
.btn.link{border:none;background:none;color:var(--blue);padding:0 4px}
.btn.link:hover{background:none;text-decoration:underline;color:var(--blue)}

/* ---------- CARDAPIO ---------- */
.cardWrap{flex:1;display:grid;grid-template-columns:330px 1fr;gap:12px;padding:12px;overflow:hidden}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh)}
.cardH{padding:15px 16px 12px;border-bottom:1px solid var(--line-2)}
.cardH h2{font-size:17px;font-weight:600;margin-bottom:11px}
.cardH .acts{display:flex;gap:8px;flex-wrap:wrap}
.srch{position:relative;padding:11px 16px;border-bottom:1px solid var(--line-2)}
.srch input{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px 0 34px;outline:none;font-size:12.8px}
.srch input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.srch .si{position:absolute;left:26px;top:19px;color:var(--ink-3)}
.cardB{flex:1;overflow-y:auto}
.cardB::-webkit-scrollbar{width:8px}
.cardB::-webkit-scrollbar-thumb{background:#CDD9E4;border-radius:6px}

.catAll{display:flex;align-items:center;padding:13px 16px;background:var(--acc-soft);color:var(--acc-d);
  font-weight:600;font-size:13px;cursor:pointer;border-bottom:1px solid var(--line-2)}
.catAll.off{background:none;color:var(--ink-2);font-weight:500}
.catAll:hover{background:var(--alt)}
.catAll.on{background:var(--acc-soft);color:var(--acc-d);font-weight:600}
.catRow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;position:relative}
.catRow:hover{background:var(--alt)}
.catRow.on{background:var(--acc-soft)}
.catRow.drag{opacity:.4}
.catRow.over{border-top:2px solid var(--acc)}
.grip{color:#B7C4D2;cursor:grab;flex:none;display:flex;letter-spacing:-2px;font-size:15px;line-height:.8;user-select:none}
.catRow .nm{flex:1;font-size:12.8px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catRow.on .nm{color:var(--acc-d);font-weight:600}
.dots{width:26px;height:26px;border:none;background:none;border-radius:6px;cursor:pointer;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;flex:none}
.dots:hover{background:var(--line-2);color:var(--ink)}

/* interruptor */
.sw{position:relative;width:36px;height:20px;border-radius:20px;background:#CBD5E1;cursor:pointer;flex:none;transition:.16s;border:none;padding:0}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--acc)}
.sw.on:after{transform:translateX(16px)}
.swLb{font-size:11.5px;font-weight:600;color:var(--ink-3);width:44px;flex:none}
.swLb.on{color:var(--acc-d)}

/* tabela produtos */
.pTable{width:100%;border-collapse:collapse;font-size:12.8px}
.pTable thead th{position:sticky;top:0;background:var(--alt);text-align:left;padding:10px 14px;font-size:10.5px;
  font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);z-index:3}
.pTable tbody td{padding:9px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.pTable tbody tr:hover{background:var(--alt)}
.pTable tbody tr.drag{opacity:.4}
.pTable tbody tr.over td{border-top:2px solid var(--acc)}
.pNome{display:flex;align-items:center;gap:9px}
.pNome .txt b{font-weight:600;display:block}
.pNome .txt small{color:var(--ink-3);font-size:11px}
.pPreco{width:110px;height:32px;border:1px solid var(--line);border-radius:7px;padding:0 9px;text-align:right;outline:none;font-size:12.5px}
.pPreco:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.dispBtn{display:flex;align-items:center;gap:7px;width:100%;max-width:230px;height:32px;border:1px solid var(--line);
  border-radius:7px;background:#fff;cursor:pointer;padding:0 9px;font-size:12px;color:var(--ink-2);text-align:left}
.dispBtn:hover{border-color:var(--acc)}
.dispBtn span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.popMenu{position:fixed;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh2);z-index:95;padding:5px;min-width:210px}
.popMenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;
  padding:9px 10px;border-radius:7px;cursor:pointer;font-size:12.8px;color:var(--ink-2)}
.popMenu button:hover{background:var(--alt);color:var(--ink)}
.popMenu button.rd{color:var(--red)}
.popMenu button.rd:hover{background:var(--red-soft)}
.popMenu label{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12.8px}
.popMenu label:hover{background:var(--alt)}
.popMenu input[type=checkbox]{width:15px;height:15px;accent-color:var(--acc)}
.popSep{height:1px;background:var(--line-2);margin:4px 0}
.vazio{padding:56px 20px;text-align:center;color:var(--ink-3);font-size:13px}
.vazio b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:6px;font-weight:600}

/* ---------- FORM PAGINA CHEIA ---------- */
.formPage{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
.fpHead{padding:16px 22px 0}
.fpHead h1{font-size:22px;font-weight:600}
.fpTabs{display:flex;gap:4px;padding:12px 22px 0;border-bottom:1px solid var(--line)}
.fpTab{padding:10px 14px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-3);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.fpTab:hover{color:var(--ink-2)}
.fpTab.on{color:var(--acc-d);border-bottom-color:var(--acc)}
.fpBody{flex:1;overflow-y:auto;padding:22px;background:var(--alt)}
.fpBody::-webkit-scrollbar{width:9px}
.fpBody::-webkit-scrollbar-thumb{background:#CDD9E4;border-radius:6px}
.fpFoot{padding:12px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:#fff;flex-wrap:wrap}
.blk{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:14px;max-width:1000px}
.blk h3{font-size:13.5px;font-weight:600;margin-bottom:14px;padding-bottom:9px;border-bottom:1px solid var(--line-2)}
.blk h3 small{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}
.row2{display:grid;grid-template-columns:1fr 240px;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fld2{margin-bottom:14px}
.fld2 label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.fld2 input,.fld2 select,.fld2 textarea{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;
  padding:0 10px;outline:none;background:#fff;font-size:13px}
.fld2 textarea{height:88px;padding:9px 10px;resize:vertical}
.fld2 input:focus,.fld2 select:focus,.fld2 textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.fld2 .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.chkL{display:flex;align-items:flex-start;gap:9px;font-size:12.8px;color:var(--ink-2);cursor:pointer;padding:7px 0}
.chkL input{width:16px;height:16px;accent-color:var(--acc);margin-top:1px;flex:none}
.radL{display:flex;align-items:center;gap:9px;font-size:12.8px;color:var(--ink-2);cursor:pointer;padding:6px 0}
.radL input{width:16px;height:16px;accent-color:var(--acc)}
.canais{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px}
.fotoBox{display:flex;align-items:center;gap:14px}
.fotoPrev{width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--line);background:var(--alt);
  display:flex;align-items:center;justify-content:center;color:var(--ink-3);overflow:hidden;flex:none}
.fotoPrev img{width:100%;height:100%;object-fit:cover}
.cores{display:flex;gap:7px;flex-wrap:wrap}
.corBtn{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.corBtn.on{border-color:var(--ink);box-shadow:0 0 0 2px #fff inset}

  text-transform:uppercase;letter-spacing:.07em;border-bottom:1px solid var(--line-2);margin-bottom:3px}

  opacity:0;transform:translateX(-6px)}

.cbFoot span{flex:1;font-size:12.5px;color:var(--ink-2);font-weight:600}
.btnConf{height:44px;padding:0 26px;border:none;border-radius:10px;background:var(--acc);color:#fff;

.concTag{display:inline-flex;align-items:center;justify-content:center;color:#D62828;margin-left:6px;vertical-align:middle}

/* ---------- frente de caixa ---------- */
.fcAberto{display:flex;align-items:center;gap:16px;background:var(--acc-soft);border:1px solid #BFE9E1;

.fcTag{display:inline-block;background:var(--acc);color:#fff;font-size:9.5px;font-weight:800;

.fcInfo b{display:block;font-size:15.5px;font-weight:600}
.fcInfo span{display:block;font-size:12.3px;color:var(--ink-2);margin-top:2px}
.fcVal{min-width:150px}
.fcVal span{display:block;font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.fcVal b{display:block;font-size:20px;font-weight:700;color:var(--acc-d);margin-top:3px}
.fcFechado{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:16px 18px;color:var(--ink-3);flex-wrap:wrap}
.fcFechado b{display:block;font-size:14.5px;color:var(--ink);font-weight:600}
.fcFechado span{display:block;font-size:12.3px;color:var(--ink-2);margin-top:2px}
.fcFechado>div{flex:1;min-width:200px}
.fcResumo{display:flex;gap:22px;flex-wrap:wrap}
.fcResumo span{display:block;font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.fcResumo b{display:block;font-size:16px;font-weight:700;margin-top:2px}
.fcResumo .vg{color:var(--acc-d)} .fcResumo .vr{color:var(--red)}

/* ==========================================================
   REFINAMENTO VISUAL — padrão de sistema
   Menos cor, tipografia menor, densidade maior.
   ========================================================== */
:root{
  --acc:#0F7A6B; --acc-d:#0B6153; --acc-l:#1B9B88; --acc-soft:#EAF3F1;
  --blue:#2B5F9E; --blue-soft:#EDF2F8;
  --red:#B03A3A; --red-soft:#F9EDED;
  --amber:#8A6415; --amber-soft:#F8F2E4;
  --line:#DDE3EA; --line-2:#EDF0F4; --alt:#F7F8FA;
  --ink:#1A2430; --ink-2:#54606E; --ink-3:#8A93A0;
  --sh:0 1px 1px rgba(20,30,45,.04);
  --sh2:0 10px 26px rgba(20,30,45,.12);
}
body{font-size:12.5px}

/* títulos e blocos mais contidos */
.finTop h1,.fxTopo h1,.lfTopo h1,.cfgTit h1{font-size:16px;font-weight:600;letter-spacing:-.01em}
.finTop p,.fxTopo p,.cfgTit p{font-size:12px}
.finWrap,.cfgWrap{padding:16px 18px 30px;gap:12px}
.pnl2,.cfgCard,.entCard,.contaCard,.fpCard,.arvore,.filtroCard,.kpi2,.acK,.cbBox,.blk,.pasta{border-radius:6px}
.pnl2H{padding:8px 12px;font-size:10px}
.cfgCard>.h{padding:12px 16px}
.cfgCard>.h b{font-size:13px}
.cfgCard>.b{padding:16px}
.blk{padding:14px}
.blk h3{font-size:12.5px;margin-bottom:11px;padding-bottom:7px}

/* indicadores discretos */
.kpi2,.acK{padding:10px 12px;background:#fff;border-color:var(--line)}
.kpi2 span,.acK span{font-size:9.5px}
.kpi2 b{font-size:17px}
.acK b{font-size:15px}
.kpi2.dest2,.acK.dest3{background:#fff;border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.kpi2.dest2 b,.acK.dest3 b{color:var(--acc-d)}
.cbBox{padding:9px 11px}
.cbR{font-size:15px}
.cbBox.dest{background:#fff;border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.cbBox.alt2{background:#fff;border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}

/* botões menores */
.btnP2,.btn{height:30px;padding:0 11px;font-size:12px;border-radius:5px;box-shadow:none}
.btnP2.ok,.btn.p{box-shadow:none}
.rBtn{width:24px;height:24px;border-radius:4px}
.chips button{height:28px;padding:0 12px;font-size:12px;border-radius:5px}
.btnAcertar,.btnPag,.btnConf{height:36px;font-size:12.5px;border-radius:6px;padding:0 18px}
.btnVerde{height:30px;font-size:12px}
.btnMais{width:34px;height:34px;border-radius:6px;background:var(--acc);box-shadow:none}
.btnMais:hover{background:var(--acc-d)}
.btnMais svg{width:17px;height:17px}

/* campos */
.fld2 input,.fld2 select,.fld2 textarea,.f2 select,.f2 input,.filtroCard input,.filtroCard select,
.lfSel,.cbData input,.selArv{height:30px;font-size:12px;border-radius:5px}
.fld2 label,.f2 label,.filtroCard label,.cbData label{font-size:10.5px}
.cur span{font-size:11.5px;left:9px}
.cur input{padding-left:29px!important}

/* tabelas mais densas */
table{font-size:12px}
.pTable{min-width:0}
thead th,.acTab thead th,.cbTab thead th,.lfTab2 thead th,.fxTab thead th{padding:7px 10px;font-size:9.5px}
tbody td,.acTab tbody td,.cbTab tbody td,.lfTab2 tbody td,.fxTab td{padding:7px 10px}
.finTab thead th{padding:8px 10px}
.finTab tbody td{padding:8px 10px}
tbody td small{font-size:10.5px}

/* etiquetas discretas */
.grpTag,.cidTag,.bandTag{background:var(--alt);color:var(--ink-2);border:1px solid var(--line);
  font-weight:600;font-size:10px;padding:1px 7px}
.badge2.gr{background:var(--acc-soft);color:var(--acc-d)}
.badge2.rd{background:var(--red-soft);color:var(--red)}
.fxTag{font-size:9px;padding:2px 7px;font-weight:700}
.fxTag.sl,.fxTag.rc,.fxTag.ds,.fxTag.tr{background:var(--alt);color:var(--ink-2);border:1px solid var(--line)}
.atrTag{font-size:9px}

/* cartões de entregador / contas mais sóbrios */
.entTopo{padding:12px 14px}
.entInfo b{font-size:14px}
.entNums{padding:12px 14px;gap:12px}
.eN b{font-size:15px}
.eN.pagar b{font-size:18px}
.av3{width:36px!important;height:36px!important;font-size:14px!important;border-radius:6px;
  background:var(--alt);color:var(--ink-2);border:1px solid var(--line)}
.ctIco{width:38px;height:38px;border-radius:6px;font-size:12px}
.ctSaldo b{font-size:17px}
.ctInfo b{font-size:13.5px}
.fpIco{width:34px;height:34px;border-radius:6px}
.fpInfo b{font-size:13px}

/* frente de caixa */
.fcAberto{background:#fff;border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc);padding:13px 15px;gap:13px}
.fcIco{width:40px;height:40px;border-radius:6px;background:var(--acc-soft);color:var(--acc-d)}
.fcTag{background:var(--acc-soft);color:var(--acc-d);font-size:9px}
.fcInfo b{font-size:13.5px}
.fcVal b{font-size:16px}
.fcResumo b{font-size:14px}

/* fluxo de caixa */
.fxFim td{background:#2B3644}
.fxTab td.fxN{font-size:12px}
.fxCx td{background:var(--alt)}
.fxCx td.fxN{background:var(--alt)}

/* modais */
.mdH{padding:12px 16px}
.mdH b{font-size:13.5px}
.mdB{padding:16px}
.mdF{padding:10px 16px}
.acTit{padding:9px 13px;font-size:10px}
.acHead{padding:12px 14px;border-radius:6px}
.acHead b{font-size:14px}

/* barra superior do módulo */
.lfTopo{padding:12px 16px;gap:14px}
.lfNav span{font-size:14px;min-width:170px}
.lfBaseSel{background:var(--alt);color:var(--ink-2);border:1px solid var(--line);font-size:10px}
.lfAtalhos button{font-size:9.5px}
.selInfo{padding:6px 12px;border-radius:6px}
.selInfo b{font-size:15px}
.rcTot.central b{font-size:19px}
.rcItem b{font-size:12.5px}
.lfRodape{padding:10px 16px}

/* menu lateral e faixa */
.mIco .lb{font-size:9px}
.wTitle b{font-size:12.5px}

/* tabela de turnos sem rolagem lateral */
.tabFC{min-width:0;table-layout:fixed;width:100%}
.tabFC td,.tabFC th{white-space:normal}
.tabFC td small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}

@media(max-width:820px){
  .tabFC th:nth-child(3),.tabFC td:nth-child(3),
  .tabFC th:nth-child(4),.tabFC td:nth-child(4){display:none}
}

/* painel de sincronização */
.syncGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.syncIt{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line-2);
  border-radius:5px;background:var(--alt);font-size:11.5px;color:var(--ink-3)}
.syncIt span{flex:1;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncIt b{font-weight:700}
.syncIt.tem{background:#fff;border-color:var(--acc);color:var(--ink-2)}
.syncIt.tem b{color:var(--acc-d)}

/* diagnóstico */
.diagLista{display:flex;flex-direction:column;gap:6px}
.diagIt{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border:1px solid var(--line-2);
  border-radius:5px;background:var(--alt);font-size:12px}
.diagIt b{display:block;font-weight:600}
.diagIt small{display:block;color:var(--ink-3);font-size:11px;margin-top:2px;line-height:1.45}
.diagIc{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:var(--line);color:var(--ink-3)}
.diagIt.ok{background:#fff;border-color:var(--acc)}
.diagIt.ok .diagIc{background:var(--acc);color:#fff}
.diagIt.err{background:#fff;border-color:var(--red)}
.diagIt.err .diagIc{background:var(--red);color:#fff}

/* cupom no PDV */
.cupRow{display:flex;gap:8px;flex-wrap:wrap}
.cupRow input{flex:1;min-width:150px;height:34px;border:1px solid var(--line);border-radius:5px;
  padding:0 11px;outline:none;font-size:13px;background:#fff}

  background:var(--acc-soft);color:var(--acc-d);font-size:12.5px;font-weight:600}
.cupErr{display:flex;align-items:center;gap:7px;margin-top:9px;padding:8px 11px;border-radius:5px;
  background:var(--red-soft);color:var(--red);font-size:12.5px;font-weight:600}
.codCup{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12px;letter-spacing:.06em;
  background:var(--alt);border:1px solid var(--line);border-radius:4px;padding:3px 9px}
.cliNm{display:flex;align-items:center;gap:9px}
.cliNm b{display:block;font-size:12.8px;font-weight:600}
.cliNm small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.tabCli td small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.crmCols{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}
@media(max-width:820px){.crmCols{grid-template-columns:1fr}}
.posN{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;
  background:var(--alt);border:1px solid var(--line);font-size:10px;font-weight:700;color:var(--ink-3);margin-right:7px}

@media(max-width:900px){
  .compGrade{flex-direction:column;overflow:auto}
  .compEsq{width:100%}
}


/* etiquetas de controle */
.miniTag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;padding:2px 6px;

.miniTag.cm{background:var(--blue-soft);color:var(--blue)}
.miniTag.off2{background:var(--alt);color:var(--ink-3);border:1px solid var(--line)}

.fichaSel{margin-top:9px}
.fsBox{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--acc);

.cbSecT:first-child{margin-top:0}
.cbLista{display:flex;flex-direction:column;gap:3px}
.cbItem{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;

.cbItem svg{color:#D9A22B;flex:none}
.cbItem:hover{background:var(--alt);color:var(--ink)}
.cbItem.on{background:var(--acc-soft);color:var(--acc-d);font-weight:600}
.cbData{margin-bottom:9px}
.cbData label{display:block;font-size:11px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.cbData input{width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 9px;

.cbData input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.cbAtalhos{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.cbAtalhos button{flex:1;min-width:70px;height:28px;border:1px solid var(--line);border-radius:7px;background:#fff;
  cursor:pointer;font-size:11px;font-weight:600;color:var(--ink-2)}
.cbAtalhos button:hover{border-color:var(--acc);color:var(--acc-d);background:var(--acc-soft)}
.cbMain{flex:1;display:flex;flex-direction:column;overflow:hidden}
.cbTit{padding:13px 18px;font-size:14px;font-weight:700;color:var(--deep);background:var(--alt);

.cbPer{font-size:12px;font-weight:500;color:var(--ink-3)}
.cbResumo{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;padding:14px 18px;
  border-bottom:1px solid var(--line);flex:none}
.cbBox{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:#fff}
.cbBox.dest{background:var(--acc-soft);border-color:#BFE9E1}
.cbBox.alt2{background:var(--amber-soft);border-color:#F0DCB4}
.cbL{font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.cbR{font-size:17px;font-weight:700;margin-top:3px}
.cbR.vg{color:var(--acc-d)} .cbR.vr{color:var(--red)}
.cbBox.alt2 .cbR{font-size:14px}
.cbTabW{flex:1;overflow:auto;background:var(--panel)}
.cbTabW::-webkit-scrollbar{width:10px}
.cbTabW::-webkit-scrollbar-thumb{background:#CDD9E4;border-radius:6px}
.cbTab{width:100%;border-collapse:collapse;font-size:12.5px}
.cbTab thead th{position:sticky;top:0;background:var(--alt);text-align:left;padding:10px 12px;font-size:10.5px;
  font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid var(--line);z-index:2}
.cbTab tbody td{padding:10px 12px;border-bottom:1px solid var(--line-2)}
.cbTab tbody tr{cursor:pointer}
.cbTab tbody tr:hover{background:var(--alt)}
.cbTab tbody tr.sel2 td{background:var(--blue-soft)}
.cbTab tbody tr.conc td{background:#F4FBF9}
.cbTab td small{display:block;font-size:11px;color:var(--ink-3);margin-top:1px}
.cbTab .vg{color:var(--acc-d)} .cbTab .vr{color:var(--red)}
.cbFim td{background:var(--alt);border-top:2px solid var(--line);font-size:13px}
.okConc{display:inline-flex;align-items:center;justify-content:center;color:#D62828;vertical-align:middle}
.cbFoot{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);
  border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.cbFoot span{flex:1;font-size:12.5px;color:var(--ink-2);font-weight:600}
.btnConf{height:44px;padding:0 26px;border:none;border-radius:10px;background:var(--acc);color:#fff;
  cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;gap:9px}
.btnConf:hover{background:var(--acc-d)}
.concTag{display:inline-flex;align-items:center;justify-content:center;color:#D62828;margin-left:6px;vertical-align:middle}

/* ---------- frente de caixa ---------- */
.fcAberto{display:flex;align-items:center;gap:16px;background:var(--acc-soft);border:1px solid #BFE9E1;
  border-radius:12px;padding:16px 18px;flex-wrap:wrap}
.fcIco{width:52px;height:52px;border-radius:14px;background:var(--acc);color:#fff;
  display:flex;align-items:center;justify-content:center;flex:none}
.fcInfo{flex:1;min-width:200px}
.fcTag{display:inline-block;background:var(--acc);color:#fff;font-size:9.5px;font-weight:800;
  letter-spacing:.07em;padding:3px 9px;border-radius:20px;margin-bottom:5px}
.fcInfo b{display:block;font-size:15.5px;font-weight:600}
.fcInfo span{display:block;font-size:12.3px;color:var(--ink-2);margin-top:2px}
.fcVal{min-width:150px}
.fcVal span{display:block;font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.fcVal b{display:block;font-size:20px;font-weight:700;color:var(--acc-d);margin-top:3px}
.fcFechado{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:16px 18px;color:var(--ink-3);flex-wrap:wrap}
.fcFechado b{display:block;font-size:14.5px;color:var(--ink);font-weight:600}
.fcFechado span{display:block;font-size:12.3px;color:var(--ink-2);margin-top:2px}
.fcFechado>div{flex:1;min-width:200px}
.fcResumo{display:flex;gap:22px;flex-wrap:wrap}
.fcResumo span{display:block;font-size:10px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.fcResumo b{display:block;font-size:16px;font-weight:700;margin-top:2px}
.fcResumo .vg{color:var(--acc-d)} .fcResumo .vr{color:var(--red)}

/* ==========================================================
   REFINAMENTO VISUAL — padrão de sistema
   Menos cor, tipografia menor, densidade maior.
   ========================================================== */
:root{
  --acc:#0F7A6B; --acc-d:#0B6153; --acc-l:#1B9B88; --acc-soft:#EAF3F1;
  --blue:#2B5F9E; --blue-soft:#EDF2F8;
  --red:#B03A3A; --red-soft:#F9EDED;
  --amber:#8A6415; --amber-soft:#F8F2E4;
  --line:#DDE3EA; --line-2:#EDF0F4; --alt:#F7F8FA;
  --ink:#1A2430; --ink-2:#54606E; --ink-3:#8A93A0;
  --sh:0 1px 1px rgba(20,30,45,.04);
  --sh2:0 10px 26px rgba(20,30,45,.12);
}
body{font-size:12.5px}

/* títulos e blocos mais contidos */
.finTop h1,.fxTopo h1,.lfTopo h1,.cfgTit h1{font-size:16px;font-weight:600;letter-spacing:-.01em}
.finTop p,.fxTopo p,.cfgTit p{font-size:12px}
.finWrap,.cfgWrap{padding:16px 18px 30px;gap:12px}
.pnl2,.cfgCard,.entCard,.contaCard,.fpCard,.arvore,.filtroCard,.kpi2,.acK,.cbBox,.blk,.pasta{border-radius:6px}
.pnl2H{padding:8px 12px;font-size:10px}
.cfgCard>.h{padding:12px 16px}
.cfgCard>.h b{font-size:13px}
.cfgCard>.b{padding:16px}
.blk{padding:14px}
.blk h3{font-size:12.5px;margin-bottom:11px;padding-bottom:7px}

/* indicadores discretos */
.kpi2,.acK{padding:10px 12px;background:#fff;border-color:var(--line)}
.kpi2 span,.acK span{font-size:9.5px}
.kpi2 b{font-size:17px}
.acK b{font-size:15px}
.kpi2.dest2,.acK.dest3{background:#fff;border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.kpi2.dest2 b,.acK.dest3 b{color:var(--acc-d)}
.cbBox{padding:9px 11px}
.cbR{font-size:15px}
.cbBox.dest{background:#fff;border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.cbBox.alt2{background:#fff;border-color:var(--amber);box-shadow:inset 3px 0 0 var(--amber)}

/* botões menores */
.btnP2,.btn{height:30px;padding:0 11px;font-size:12px;border-radius:5px;box-shadow:none}
.btnP2.ok,.btn.p{box-shadow:none}
.rBtn{width:24px;height:24px;border-radius:4px}
.chips button{height:28px;padding:0 12px;font-size:12px;border-radius:5px}
.btnAcertar,.btnPag,.btnConf{height:36px;font-size:12.5px;border-radius:6px;padding:0 18px}
.btnVerde{height:30px;font-size:12px}
.btnMais{width:34px;height:34px;border-radius:6px;background:var(--acc);box-shadow:none}
.btnMais:hover{background:var(--acc-d)}
.btnMais svg{width:17px;height:17px}

/* campos */
.fld2 input,.fld2 select,.fld2 textarea,.f2 select,.f2 input,.filtroCard input,.filtroCard select,
.lfSel,.cbData input,.selArv{height:30px;font-size:12px;border-radius:5px}
.fld2 label,.f2 label,.filtroCard label,.cbData label{font-size:10.5px}
.cur span{font-size:11.5px;left:9px}
.cur input{padding-left:29px!important}

/* tabelas mais densas */
table{font-size:12px}
.pTable{min-width:0}
thead th,.acTab thead th,.cbTab thead th,.lfTab2 thead th,.fxTab thead th{padding:7px 10px;font-size:9.5px}
tbody td,.acTab tbody td,.cbTab tbody td,.lfTab2 tbody td,.fxTab td{padding:7px 10px}
.finTab thead th{padding:8px 10px}
.finTab tbody td{padding:8px 10px}
tbody td small{font-size:10.5px}

/* etiquetas discretas */
.grpTag,.cidTag,.bandTag{background:var(--alt);color:var(--ink-2);border:1px solid var(--line);
  font-weight:600;font-size:10px;padding:1px 7px}
.badge2.gr{background:var(--acc-soft);color:var(--acc-d)}
.badge2.rd{background:var(--red-soft);color:var(--red)}
.fxTag{font-size:9px;padding:2px 7px;font-weight:700}
.fxTag.sl,.fxTag.rc,.fxTag.ds,.fxTag.tr{background:var(--alt);color:var(--ink-2);border:1px solid var(--line)}
.atrTag{font-size:9px}

/* cartões de entregador / contas mais sóbrios */
.entTopo{padding:12px 14px}
.entInfo b{font-size:14px}
.entNums{padding:12px 14px;gap:12px}
.eN b{font-size:15px}
.eN.pagar b{font-size:18px}
.av3{width:36px!important;height:36px!important;font-size:14px!important;border-radius:6px;
  background:var(--alt);color:var(--ink-2);border:1px solid var(--line)}
.ctIco{width:38px;height:38px;border-radius:6px;font-size:12px}
.ctSaldo b{font-size:17px}
.ctInfo b{font-size:13.5px}
.fpIco{width:34px;height:34px;border-radius:6px}
.fpInfo b{font-size:13px}

/* frente de caixa */
.fcAberto{background:#fff;border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc);padding:13px 15px;gap:13px}
.fcIco{width:40px;height:40px;border-radius:6px;background:var(--acc-soft);color:var(--acc-d)}
.fcTag{background:var(--acc-soft);color:var(--acc-d);font-size:9px}
.fcInfo b{font-size:13.5px}
.fcVal b{font-size:16px}
.fcResumo b{font-size:14px}

/* fluxo de caixa */
.fxFim td{background:#2B3644}
.fxTab td.fxN{font-size:12px}
.fxCx td{background:var(--alt)}
.fxCx td.fxN{background:var(--alt)}

/* modais */
.mdH{padding:12px 16px}
.mdH b{font-size:13.5px}
.mdB{padding:16px}
.mdF{padding:10px 16px}
.acTit{padding:9px 13px;font-size:10px}
.acHead{padding:12px 14px;border-radius:6px}
.acHead b{font-size:14px}

/* barra superior do módulo */
.lfTopo{padding:12px 16px;gap:14px}
.lfNav span{font-size:14px;min-width:170px}
.lfBaseSel{background:var(--alt);color:var(--ink-2);border:1px solid var(--line);font-size:10px}
.lfAtalhos button{font-size:9.5px}
.selInfo{padding:6px 12px;border-radius:6px}
.selInfo b{font-size:15px}
.rcTot.central b{font-size:19px}
.rcItem b{font-size:12.5px}
.lfRodape{padding:10px 16px}

/* menu lateral e faixa */
.mIco .lb{font-size:9px}
.wTitle b{font-size:12.5px}

/* tabela de turnos sem rolagem lateral */
.tabFC{min-width:0;table-layout:fixed;width:100%}
.tabFC td,.tabFC th{white-space:normal}
.tabFC td small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:2px;line-height:1.4}
.tabFC td:first-child b{font-size:12.5px}
@media(max-width:820px){
  .tabFC th:nth-child(3),.tabFC td:nth-child(3),
  .tabFC th:nth-child(4),.tabFC td:nth-child(4){display:none}
}

/* painel de sincronização */
.syncGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.syncIt{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line-2);
  border-radius:5px;background:var(--alt);font-size:11.5px;color:var(--ink-3)}
.syncIt span{flex:1;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncIt b{font-weight:700}
.syncIt.tem{background:#fff;border-color:var(--acc);color:var(--ink-2)}
.syncIt.tem b{color:var(--acc-d)}

/* diagnóstico */
.diagLista{display:flex;flex-direction:column;gap:6px}
.diagIt{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border:1px solid var(--line-2);
  border-radius:5px;background:var(--alt);font-size:12px}
.diagIt b{display:block;font-weight:600}
.diagIt small{display:block;color:var(--ink-3);font-size:11px;margin-top:2px;line-height:1.45}
.diagIc{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  background:var(--line);color:var(--ink-3)}
.diagIt.ok{background:#fff;border-color:var(--acc)}
.diagIt.ok .diagIc{background:var(--acc);color:#fff}
.diagIt.err{background:#fff;border-color:var(--red)}
.diagIt.err .diagIc{background:var(--red);color:#fff}
.diagIt.err b{color:var(--red)}

/* cupom no PDV */
.cupRow{display:flex;gap:8px;flex-wrap:wrap}
.cupRow input{flex:1;min-width:150px;height:34px;border:1px solid var(--line);border-radius:5px;
  padding:0 11px;outline:none;font-size:13px;background:#fff}
.cupRow input:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.cupOk{display:flex;align-items:center;gap:7px;margin-top:9px;padding:8px 11px;border-radius:5px;
  background:var(--acc-soft);color:var(--acc-d);font-size:12.5px;font-weight:600}
.cupErr{display:flex;align-items:center;gap:7px;margin-top:9px;padding:8px 11px;border-radius:5px;
  background:var(--red-soft);color:var(--red);font-size:12.5px;font-weight:600}
.codCup{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12px;letter-spacing:.06em;
  background:var(--alt);border:1px solid var(--line);border-radius:4px;padding:3px 9px}
.cliNm{display:flex;align-items:center;gap:9px}
.cliNm b{display:block;font-size:12.8px;font-weight:600}
.cliNm small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.tabCli td small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.crmCols{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:11px}
@media(max-width:820px){.crmCols{grid-template-columns:1fr}}
.posN{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:4px;
  background:var(--alt);border:1px solid var(--line);font-size:10px;font-weight:700;color:var(--ink-3);margin-right:7px}

@media(max-width:900px){
  .compGrade{flex-direction:column;overflow:auto}
  .compEsq{width:100%}
}


/* etiquetas de controle */
.miniTag{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.04em;padding:2px 6px;
  border-radius:3px;margin:0 2px}
.miniTag.ok2{background:var(--acc-soft);color:var(--acc-d)}
.miniTag.cm{background:var(--blue-soft);color:var(--blue)}
.miniTag.off2{background:var(--alt);color:var(--ink-3);border:1px solid var(--line)}
.tabIns td small{display:block;font-size:10.5px;color:var(--ink-3);margin-top:1px}
.subVazio2{padding:10px 47px;color:var(--ink-3);font-size:12px}

/* unidades */
.uniGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.uniIt{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid var(--line-2);
  border-radius:5px;background:#fff;font-size:12px}
.uniIt.fixa{background:var(--alt);color:var(--ink-2)}
.uniIt b{flex:1;font-weight:600}
.uniIt span{font-size:10.5px;color:var(--ink-3);font-family:ui-monospace,Menlo,monospace}

/* seleção de ficha no cardápio */
.pickList2{max-height:260px;overflow-y:auto;border:1px solid var(--line-2);border-radius:5px;margin-top:4px}
.pickList2::-webkit-scrollbar{width:8px}
.pickList2::-webkit-scrollbar-thumb{background:#CDD9E4;border-radius:6px}
.pkIt{display:flex;align-items:center;gap:9px;padding:5px 10px;border-bottom:1px solid var(--line-2);cursor:pointer}
.pkIt:last-child{border-bottom:none}
.pkIt:hover{background:var(--alt)}
.pkIt.on{background:var(--acc-soft)}
.pkIt img{width:22px;height:22px;border-radius:4px;object-fit:cover;border:1px solid var(--line);flex:none}
.pkIt div{flex:1;min-width:0}
.pkIt b{display:block;font-size:12px;font-weight:500;line-height:1.3}
.pkIt small{display:inline;font-size:10px;color:var(--ink-3);margin-left:6px}
.pkOk{color:var(--acc-d);display:flex;flex:none}
.fichaSel{margin-top:9px}
.fsBox{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--acc);
  border-radius:5px;background:var(--acc-soft);color:var(--acc-d)}
.fsBox div{flex:1}
.fsBox b{display:block;font-size:12.8px;font-weight:600}
.fsBox span{display:block;font-size:11px;opacity:.85}

.ftWrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ftBar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--panel);

.ftPaneB{flex:1;overflow-y:auto;padding:11px}
.ftCampo{margin-bottom:12px}
.ftCampo label{display:block;font-size:10.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.ftCampo input{width:100%;height:28px;border:1px solid var(--line);border-radius:4px;padding:0 8px;

.ftNoNm{flex:1;display:flex;align-items:center;gap:5px;overflow:hidden;text-overflow:ellipsis}
.ftSeta{width:12px;display:flex;align-items:center;justify-content:center;color:var(--ink-3);

.ftEd{display:none;gap:2px;flex:none}

.ftSubs{padding-left:4px}
.ftAddSub{display:flex;gap:4px;padding:4px 5px 4px 22px}
.ftAddSub input{flex:1;height:24px;border:1px solid var(--line);border-radius:3px;padding:0 6px;
  outline:none;font-size:11px}
.btnPesq{margin:0;height:34px;border:none;border-top:1px solid var(--line);background:var(--alt);
  cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2);flex:none}
.btnPesq:hover{background:var(--acc-soft);color:var(--acc-d)}
.ftMain{flex:1;display:flex;flex-direction:column;overflow:hidden}

function carregar(){
  try{
    var raw=localStorage.getItem('nexor_dados');
    if(raw){DB=JSON.parse(raw);}
    else{semear();gravarLocal();}
  }catch(e){semear();}
  DB.categorias=DB.categorias||[];DB.produtos=DB.produtos||[];
  DB.grupos=DB.grupos||[];DB.fichas=DB.fichas||[];

  catch(e){toast('Não foi possível salvar neste aparelho.');}

function salvar(){
  gravarLocal();                     /* sempre grava no aparelho (rede caindo nao perde dado) */
  if(NUVEM.ligada){NUVEM.sujo=true;logNuvem('mudança salva aqui — envio agendado');agendarSync();}
  else logNuvem('mudança salva aqui (nuvem desligada)');
}

function logNuvem(txt,erro){

  if(NUVEM.log.length>60)NUVEM.log.pop();
}

var _timerSync=null;
function agendarSync(){
  clearTimeout(_timerSync);
  _timerSync=setTimeout(sincronizar,800);
}
async function conectarNuvem(email,senha){
  if(!window.supabase)throw new Error('Biblioteca da nuvem não carregou. Verifique a internet.');
  NUVEM.cli=window.supabase.createClient(NUVEM.url,NUVEM.chave);
  var r=await NUVEM.cli.auth.signInWithPassword({email:email,password:senha});
  if(r.error)throw r.error;
  var rp=await NUVEM.cli.from('perfis').select('id,nome,cargo,loja_id,empresa_id').eq('id',r.data.user.id).maybeSingle();
  if(rp.error||!rp.data)throw new Error('Usuário sem perfil vinculado a uma loja.');
  NUVEM.perfil=rp.data;NUVEM.loja=rp.data.loja_id;NUVEM.ligada=true;
  NUVEM.token=r.data.session?r.data.session.access_token:null;
  setTimeout(ligarTempoReal,600);
  setModo('nuvem');
  return true;
}
function desconectarNuvem(){
  try{ if(NUVEM.cli)NUVEM.cli.auth.signOut(); }catch(e){}
  desligarTempoReal();
  NUVEM.ligada=false;NUVEM.cli=null;NUVEM.token=null;NUVEM.perfil=null;NUVEM.loja=null;
  setModo('local');rodape();
}
/* ao abrir o sistema, volta a ligar a nuvem sem pedir senha de novo */
function temDadosLocais(){
  try{
    return MAPA.some(function(E4){ return (DB[E4.col]||[]).length>0; });
  }catch(e){return false}
}
async function religarNuvem(){
  if(modo()!=='nuvem')return false;
  if(!window.supabase)return false;
  try{
    NUVEM.cli=window.supabase.createClient(NUVEM.url,NUVEM.chave);
    var r=await NUVEM.cli.auth.getSession();
    var ses=r&&r.data?r.data.session:null;
    if(!ses){NUVEM.cli=null;return false;}
    var rp=await NUVEM.cli.from('perfis')
      .select('id,nome,cargo,loja_id,empresa_id').eq('id',ses.user.id).maybeSingle();
    if(rp.error||!rp.data){NUVEM.cli=null;return false;}
    NUVEM.perfil=rp.data;NUVEM.loja=rp.data.loja_id;NUVEM.ligada=true;
    NUVEM.token=ses.access_token;
    statusNuvem('ok');rodape();
    setTimeout(ligarTempoReal,400);
    /* traz o que mudou enquanto o sistema estava fechado —
       mas primeiro envia o que estiver pendente aqui, para nada ser sobrescrito */
    setTimeout(async function(){
      try{
        if(temDadosLocais()){ await sincronizar(); }
        statusNuvem('baixando'); await baixarDaNuvem(); statusNuvem('ok');
        if(S.mod&&S.it)abrir(S.mod,S.it);
      }catch(e){ statusNuvem('erro',(e&&e.message)||''); }
    },900);
    return true;
  }catch(e){NUVEM.cli=null;return false;}
}

/* ---- chamada direta ao banco (sem depender de biblioteca externa) ---- */
/* pega sempre a credencial vigente — ela expira e precisa ser renovada */
async function tokenAtual(forcar){
  try{
    if(!NUVEM.cli)return NUVEM.token;
    if(forcar){
      var rr=await NUVEM.cli.auth.refreshSession();
      if(rr&&rr.data&&rr.data.session)NUVEM.token=rr.data.session.access_token;
    }else{
      var r=await NUVEM.cli.auth.getSession();
      if(r&&r.data&&r.data.session)NUVEM.token=r.data.session.access_token;
    }
    if(NUVEM.token&&NUVEM.cli.realtime&&NUVEM.cli.realtime.setAuth)
      NUVEM.cli.realtime.setAuth(NUVEM.token);
  }catch(e){}
  return NUVEM.token;
}
async function api(caminho,metodo,corpo,extra,_repetiu){
  var h={'apikey':NUVEM.chave,'Content-Type':'application/json'};
  if(NUVEM.token)h['Authorization']='Bearer '+NUVEM.token;
  if(extra)for(var k in extra)h[k]=extra[k];
  var r=await fetch(NUVEM.url+'/rest/v1/'+caminho,{method:metodo||'GET',headers:h,
    body:corpo?JSON.stringify(corpo):undefined});
  var t=await r.text();
  var d=null;
  try{ d=t?JSON.parse(t):null; }catch(e){ d=null; }
  if(!r.ok){
    /* credencial vencida: renova e tenta uma vez */
    if((r.status===401||r.status===403)&&!_repetiu){
      await tokenAtual(true);
      return api(caminho,metodo,corpo,extra,true);
    }
    throw new Error((d&&(d.message||d.hint))||('erro '+r.status));
  }
  return d;
}
/* grava (insere ou atualiza) pelo ref_local e devolve os ids */
async function enviar(tab,linhas){
  if(!linhas.length)return [];
  var out=[];
  for(var i=0;i<linhas.length;i+=200){
    var lote=linhas.slice(i,i+200);
    var r=await api(tab+'?on_conflict=ref_local','POST',lote,
      {'Prefer':'resolution=merge-duplicates,return=representation'});
    out=out.concat(r||[]);
  }
  return out;
}
/* apaga na nuvem os registros que não existem mais neste aparelho */
/* Só apaga na nuvem o que este aparelho realmente tinha e o usuário removeu.
   Compara com a foto do último envio bem-sucedido: o que estava lá e sumiu daqui
   foi excluído por você. O que nunca esteve na foto foi criado em outro
   aparelho — e esse nunca é tocado. */
async function apagarRemovidos(tab,chave,idsAgora){
  try{
    DB._snap=DB._snap||{};
    var antes=DB._snap[chave]||null;
    DB._snap[chave]=idsAgora.slice();
    if(!antes)return;                       /* primeira vez: nada a comparar */
    var sumiram=antes.filter(function(id){return idsAgora.indexOf(id)<0});
    if(!sumiram.length)return;
    if(sumiram.length>200)return;           /* segurança */
    await api(tab+'?ref_local=in.('+sumiram.map(function(r){
      return '"'+String(r).replace(/"/g,'')+'"'}).join(',')+')','DELETE');
    logNuvem(tab+': '+sumiram.length+' excluído(s) por você');
  }catch(e){console.error('apagarRemovidos',tab,e);logNuvem('aviso ao excluir em '+tab,true);}
}

/* apaga os itens de um pai que não existem mais neste aparelho */
async function apagar(tab,campo,valor){
  try{ await api(tab+'?'+campo+'=eq.'+encodeURIComponent(valor),'DELETE'); }
  catch(e){ console.error('apagar',tab,e); }
}

/* ---- sincronização completa ---- */
async function sincronizar(){
  if(!NUVEM.ligada){logNuvem('envio cancelado: nuvem desligada',true);return;}
  if(NUVEM.sincronizando){
    NUVEM.pendente=true;
    logNuvem('envio adiado: já havia um em andamento');
    /* trava de segurança: se ficar preso, libera e tenta de novo */
    clearTimeout(NUVEM._destrava);
    NUVEM._destrava=setTimeout(function(){
      if(NUVEM.sincronizando){
        NUVEM.sincronizando=false;
        logNuvem('envio anterior travou — liberando e tentando de novo',true);
        agendarSync();
      }
    },15000);
    return;
  }
  NUVEM.sincronizando=true;statusNuvem('enviando');pausaTempoReal(6000);
  await tokenAtual();
  logNuvem('enviando...');
  var etapa='';
  try{
    var l=NUVEM.loja;
    _ids={};
    /* nenhum registro sobe sem identificação própria — é ela que evita duplicar */
    MAPA.forEach(function(E3){
      var lst=DB[E3.col]||[];
      var vistosId={},vistosNome={},limpa=[];
      lst.forEach(function(x){
        if(!x.id)x.id=uid(E3.col.slice(0,3));
        /* repetido pelo identificador: descarta */
        if(vistosId[x.id])return;
        /* repetido pelo nome dentro do mesmo cadastro: fica o que tem mais conteúdo */
        var chave=(x.nome||x.codigo||'').toString().trim().toLowerCase();
        if(chave&&E3.espelha){
          var ant=vistosNome[chave];
          if(ant!==undefined){
            var peso=function(o){
              var n=0;
              (E3.filhos||[]).forEach(function(F3){n+=(o[F3.lista]||[]).length});
              return n;
            };
            if(peso(x)>peso(limpa[ant])){limpa[ant]=x;vistosId[x.id]=true;}
            return;
          }
          vistosNome[chave]=limpa.length;
        }
        vistosId[x.id]=true;
        (E3.filhos||[]).forEach(function(F2){
          var vf={};
          (x[F2.lista]||[]).forEach(function(o,j){
            if(!o)return;
            if(!o.id)o.id=x.id+'_'+j;
            if(vf[o.id])o.id=x.id+'_'+j+'_'+Math.random().toString(36).slice(2,6);
            vf[o.id]=true;
          });
        });
        limpa.push(x);
      });
      if(limpa.length!==lst.length)
        logNuvem(E3.col+': '+(lst.length-limpa.length)+' repetido(s) removido(s)');
      DB[E3.col]=limpa;
    });
    gravarLocal();

    for(var m=0;m<MAPA.length;m++){
      var E2=MAPA[m];
      etapa=E2.tab;
      var lista=DB[E2.col]||[];

      if(lista.length){
        var linhas=lista.map(function(x,i){
          var o=E2.campos(x,i);
          o.loja_id=l;
          o.ref_local=x.id;
          return o;
        });
        var salvos=await enviar(E2.tab,linhas);
        logNuvem(E2.tab+': '+linhas.length+' enviado(s), '+(salvos||[]).length+' confirmado(s)',
          (salvos||[]).length!==linhas.length);
        salvos.forEach(function(r){if(r.ref_local)_ids[r.ref_local]=r.id});
      }
      /* roda mesmo com a lista vazia — senão apagar o último item nunca chega na nuvem */
      if(E2.espelha)await apagarRemovidos(E2.tab,E2.col,lista.map(function(x){return x.id}));
      if(!lista.length)continue;

      /* filhos (opções, itens, parcelas...) */
      if(E2.filhos)for(var f=0;f<E2.filhos.length;f++){
        var F=E2.filhos[f];
        etapa=F.tab;
        for(var k=0;k<lista.length;k++){
          var paiId=_ids[lista[k].id];
          if(!paiId)continue;
          var filhos=lista[k][F.lista]||[];
          var refs=filhos.map(function(o,j){return (lista[k].id)+'_'+(o.id||j)});

          if(!filhos.length)logNuvem(F.tab+': nenhum item para enviar em "'+(lista[k].nome||'')+'"');
          if(filhos.length){
            var lf=filhos.map(function(o,j){
              var y=F.campos(o,j);
              y[F.pai]=paiId;
              y.ref_local=refs[j];
              return y;
            });
            var sf=await enviar(F.tab,lf);
            logNuvem(F.tab+': '+lf.length+' item(ns), '+(sf||[]).length+' confirmado(s)',
              (sf||[]).length!==lf.length);
            sf.forEach(function(r){if(r.ref_local)_ids[r.ref_local]=r.id});
          }
          /* só remove o que sumiu daqui — e apenas se este aparelho estiver atualizado.
             Antes ele apagava tudo e reinseria, o que fazia um aparelho
             desatualizado apagar o que o outro tinha acabado de criar. */
          await apagarRemovidos(F.tab,E2.col+'.'+F.lista+'.'+lista[k].id,refs);
        }
      }

      /* vínculos N:N (produto <-> grupos) */
      if(E2.vinculo){
        var V=E2.vinculo;
        etapa=V.tab;
        for(var v=0;v<lista.length;v++){
          var pid=_ids[lista[v].id];
          if(!pid)continue;
          await apagar(V.tab,V.pai,pid);
          var refs=(lista[v][V.lista]||[]).map(function(r){return _ids[r]}).filter(Boolean);
          if(!refs.length)continue;
          var lv=refs.map(function(g,j){var o={};o[V.pai]=pid;o[V.campo]=g;o.ordem=j;return o});
          await api(V.tab,'POST',lv,{'Prefer':'return=minimal'});
        }
      }
    }

    /* configuração da loja */
    var c=cfg();
    await api('config_loja?on_conflict=loja_id','POST',[{loja_id:l,
      loja_aberta:c.lojaAberta!==false,tempo_entrega:n(c.tempoEntrega),
      tempo_retirada:n(c.tempoRetirada),caixa_cego:!!c.caixaCego,
      layout:c.layout||'normal',fases:c.fases||[]}],
      {'Prefer':'resolution=merge-duplicates,return=minimal'});

    NUVEM.ultima=new Date();
    NUVEM.sujo=false;
    DB._snapOk=true;
    gravarLocal();
    statusNuvem('ok');
    logNuvem('tudo enviado com sucesso');
    pausaTempoReal(2500);
  }catch(e){
    console.error('[NEXOR sync]',etapa,e);
    statusNuvem('erro',etapa+': '+((e&&e.message)||'falha'));
    console.error('SINCRONIZACAO falhou em',etapa,e);
    logNuvem('ERRO em '+etapa+': '+((e&&e.message)||'falha'),true);
    toast('Não consegui enviar ('+etapa+'): '+((e&&e.message)||'falha')); 
  }finally{
    NUVEM.sincronizando=false;
    if(NUVEM.pendente){NUVEM.pendente=false;agendarSync();}
  }
}

/* ---- trazer da nuvem ---- */
async function baixarDaNuvem(forcar){
  /* NUNCA sobrescreve o aparelho enquanto houver algo esperando subir */
  if(NUVEM.sujo&&!forcar){
    logNuvem('há mudanças pendentes — enviando antes de baixar');
    try{ await sincronizar(); }catch(e){}
    if(NUVEM.sujo){ logNuvem('download cancelado: envio não concluiu',true); return; }
  }
  var antesCat=(DB.catfin||[]).reduce(function(a,p){return a+((p.itens||[]).length)},0);
  logNuvem('baixando da nuvem...');
  await tokenAtual();
  var l=NUVEM.loja;
  var q='?loja_id=eq.'+l;          /* sem select: cada consulta define o dela */
  var qs=q+'&select=*';            /* consultas simples */
  /* se a nuvem responder vazio mas houver dados aqui, mantém os daqui */
  /* o filho sobe como "idDoPai_idDoFilho"; na volta devolve o id original,
     senão o identificador cresce a cada sincronização e o sistema
     passa a achar que o item foi excluído e recriado */
  function idFilho(paiRef,ref,alt){
    if(!ref)return alt;
    var p=String(paiRef||'')+'_';
    return String(ref).indexOf(p)===0?String(ref).slice(p.length):ref;
  }
  function volta(linhas,fn,atual){
    var r=(linhas||[]).map(fn);
    if(!r.length&&atual&&atual.length)return atual;
    return r;
  }
  var cont=await api('contas_capital'+qs);
  DB.contas=volta(cont,function(x){return {id:x.ref_local||x.id,nome:x.nome,tipo:x.tipo,banco:x.banco,
    agencia:x.agencia,numero:x.numero,saldoInicial:Number(x.saldo_inicial)||0,fixa:x.fixa}});
  var fp=await api('formas_pagamento'+qs+'&order=ordem');
  var mapaConta={};cont.forEach(function(x){mapaConta[x.id]=x.ref_local||x.id});
  DB.formasPag=volta(fp,function(x){return {id:x.ref_local||x.id,nome:x.nome,tipo:x.tipo,bandeira:x.bandeira,
    taxaPct:Number(x.taxa_pct)||0,taxaFixa:Number(x.taxa_fixa)||0,dias:x.dias_recebimento||0,
    contaId:mapaConta[x.conta_id]||'',ativa:x.ativa!==false,online:!!x.online,ordem:x.ordem||0}});
  var cf=await api('categorias_financeiras'+q+'&select=*,subcategorias_financeiras(*)&order=ordem');
  DB.catfin=volta(cf,function(x){
    var paiRef=x.ref_local||x.id;
    return {id:paiRef,nome:x.nome,
      itens:(x.subcategorias_financeiras||[]).sort(function(a,b){return (a.ordem||0)-(b.ordem||0)})
        .map(function(s){return {id:idFilho(paiRef,s.ref_local,s.id),nome:s.nome}})};});
  var fo=await api('fornecedores'+qs);
  DB.fornec=volta(fo,function(x){return {id:x.ref_local||x.id,empresa:x.empresa,nome:x.contato,
    cnpj:x.cnpj,email:x.email,tel:x.telefone,whats:x.whatsapp}});
  var cl=await api('clientes'+qs);
  DB.clientes=volta(cl,function(x){return {id:x.ref_local||x.id,nome:x.nome,tel:x.telefone,rua:x.rua,
    numero:x.numero,bairro:x.bairro,cidade:x.cidade,ref:x.referencia,
    compras:x.compras||0,gasto:Number(x.gasto)||0,
    cpf:x.cpf||'',nascimento:x.nascimento||'',obs:x.observacao||'',
    limiteFiado:Number(x.limite_fiado)||0,saldoFiado:Number(x.saldo_fiado)||0,
    ultima:x.ultima_compra||''}});
  var en=await api('entregadores'+q+'&select=*,entregador_taxas(*)');
  DB.entregadores=volta(en,function(x){return {id:x.ref_local||x.id,nome:x.nome,tel:x.telefone,cpf:x.cpf,
    pix:x.pix,diarias:x.diarias||{},padrao:!!x.padrao,ativo:x.ativo!==false,
    taxas:(x.entregador_taxas||[]).map(function(t){return {cidade:t.cidade,valor:Number(t.valor)||0}})}});
  var lf=await api('lancamentos_financeiros'+qs+'&order=vencimento.desc');
  var mapaSub={};(cf||[]).forEach(function(c2){(c2.subcategorias_financeiras||[]).forEach(function(s){
    mapaSub[s.id]=s.ref_local||s.id})});
  var mapaFP={};fp.forEach(function(x){mapaFP[x.id]=x.ref_local||x.id});
  var mapaFo={};fo.forEach(function(x){mapaFo[x.id]=x.ref_local||x.id});
  DB.lancFin=volta(lf,function(x){return {id:x.ref_local||x.id,tipo:x.tipo,
    contaId:mapaConta[x.conta_id]||'',contaDestinoId:mapaConta[x.conta_destino_id]||'',

function statusNuvem(e,msg){
  var el=document.getElementById('nuvemSt');if(!el)return;
  if(e==='enviando')el.innerHTML='<i style="background:#B8730B"></i>Enviando para a nuvem...';
  else if(e==='baixando')el.innerHTML='<i style="background:#1F6FB2"></i>Baixando da nuvem...';

/* ---------- ARRASTAR PARA REORDENAR ---------- */
var _dragId=null;
function ativarArrasto(sel,onSolta){
  var els=document.querySelectorAll(sel);
  for(var i=0;i<els.length;i++){
    els[i].ondragstart=function(e){_dragId=this.getAttribute('data-id');this.classList.add('drag');
      e.dataTransfer.effectAllowed='move';};
    els[i].ondragend=function(){this.classList.remove('drag');
      var o=document.querySelectorAll('.over');for(var j=0;j<o.length;j++)o[j].classList.remove('over');};
    els[i].ondragover=function(e){e.preventDefault();this.classList.add('over');};
    els[i].ondragleave=function(){this.classList.remove('over');};
    els[i].ondrop=function(e){e.preventDefault();e.stopPropagation();
      this.classList.remove('over');
      var alvo=this.getAttribute('data-id');
      if(_dragId&&alvo&&_dragId!==alvo)onSolta(_dragId,alvo);
      _dragId=null;};
  }
}
function reordenar(arr,idDe,idPara){
  arr.sort(function(a,b){return a.ordem-b.ordem});
  var de=arr.findIndex(function(x){return x.id===idDe});
  var para=arr.findIndex(function(x){return x.id===idPara});
  if(de<0||para<0)return;
  var item=arr.splice(de,1)[0];
  arr.splice(para,0,item);
  arr.forEach(function(x,i){x.ordem=i});
}

  if($('pDet'))p.detalhes=$('pDet').value;

  for(var k=0;k<pp.length;k++)p.promocoes[pp[k].getAttribute('data-i')].preco=parseFloat(pp[k].value)||0;

function salvarProduto(depois){
  lerFormProduto();

  if(!p.categoriaId){toast('Selecione uma categoria. Cadastre uma se ainda não houver.');abaProd('dados');return;}
  if(p.id){
    var i=DB.produtos.findIndex(function(x){return x.id===p.id});
    DB.produtos[i]=p;
  }else{
    p.id=uid('prod');p.ordem=DB.produtos.length;DB.produtos.push(p);
  }
  salvar();
  toast('Produto salvo.');
  if(depois==='sair')return telaCardapio();
  if(depois==='copia'){
    var c=JSON.parse(JSON.stringify(p));c.id=null;c.nome=p.nome+' (cópia)';
    _prod=c;_abaProd='dados';return desenhaFormProduto(false);
  }
  if(depois==='novo'){return formProduto();}
}

/* ---------- CÓPIA DE SEGURANÇA ---------- */
function exportarDados(){
  try{
    var pacote={sistema:'NEXOR',versao:1,quando:new Date().toISOString(),dados:DB};
    var txt=JSON.stringify(pacote,null,1);
    var blob=new Blob([txt],{type:'application/json'});
    var a=document.createElement('a');
    var d=new Date();
    a.href=URL.createObjectURL(blob);
    a.download='nexor-dados-'+d.getFullYear()+('0'+(d.getMonth()+1)).slice(-2)+('0'+d.getDate()).slice(-2)+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},400);
    toast('Cópia baixada. Guarde este arquivo.');
  }catch(e){toast('Não foi possível gerar a cópia.');}
}
function importarDados(input){
  var f=input.files&&input.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var p=JSON.parse(r.result);
      var d=p.dados||p;
      if(!d||(!d.produtos&&!d.categorias))throw new Error('formato');
      if(!confirm('Isso substitui os dados atuais deste aparelho pelos do arquivo. Continuar?'))return;
      DB=d;
      DB.categorias=DB.categorias||[];DB.produtos=DB.produtos||[];
      DB.grupos=DB.grupos||[];DB.fichas=DB.fichas||[];
      DB.clientes=DB.clientes||[];DB.pedidos=DB.pedidos||[];DB.caixas=DB.caixas||[];
  baseFormas();
      gravarLocal();
      fecharModal();
      abrir('cardapio','cfg-cardapio');
      toast('Dados restaurados: '+DB.produtos.length+' produtos, '+DB.categorias.length+' categorias.');
    }catch(e){
      toast('Arquivo inválido. Use uma cópia gerada pelo próprio Nexor.');
    }
  };
  r.readAsText(f);
  input.value='';
}



/* ==========================================================
   TEMPO REAL — escuta o banco e atualiza a tela sozinho
   ========================================================== */
var RT={canal:null,ligado:false,pausa:false,ultimoAviso:0,recarga:null};

function ligarTempoReal(){
  if(!NUVEM.ligada||!NUVEM.cli||RT.ligado)return;
  try{
    /* o canal precisa do token do usuário, senão a segurança por loja bloqueia os avisos */
    if(NUVEM.token&&NUVEM.cli.realtime&&NUVEM.cli.realtime.setAuth)
      NUVEM.cli.realtime.setAuth(NUVEM.token);
    RT.canal=NUVEM.cli.channel('nexor-loja-'+NUVEM.loja)
      .on('postgres_changes',{event:'*',schema:'public'},function(msg){
        if(RT.pausa)return;                       /* mudança feita por mim */
        agendarRecarga(msg&&msg.table);
      })
      .subscribe(function(st){
        RT.ligado=(st==='SUBSCRIBED');
        pintaTempoReal();
        if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED'){
          clearTimeout(RT._religa);
          RT._religa=setTimeout(function(){
            if(NUVEM.ligada){desligarTempoReal();ligarTempoReal();}
          },5000);
        }
      });
  }catch(e){console.error('tempo real',e);}
}
function desligarTempoReal(){
  try{ if(RT.canal&&NUVEM.cli)NUVEM.cli.removeChannel(RT.canal); }catch(e){}
  RT.canal=null;RT.ligado=false;pintaTempoReal();
}
/* junta várias mudanças seguidas numa só recarga */
function agendarRecarga(tabela){
  clearTimeout(RT.recarga);
  RT.recarga=setTimeout(async function(){
    try{
      statusNuvem('baixando');
      await baixarDaNuvem();
      statusNuvem('ok');
      /* se você está no meio de algo, a tela NÃO é trocada.
         Fica um aviso discreto e a atualização acontece quando você terminar. */
      if(ocupado()){
        RT.pendenteTela=true;
        marcaNovidade(true);
      }else{
        if(S.mod&&S.it)abrir(S.mod,S.it);
        marcaNovidade(false);
      }
    }catch(e){statusNuvem('erro','ao baixar: '+((e&&e.message)||''));}
  },1200);
}
/* está no meio de alguma coisa? então não mexemos na tela */
function ocupado(){
  if(document.getElementById('mdOv'))return true;      /* janela aberta */
  if(document.getElementById('mdOv2'))return true;
  var a=document.activeElement;
  if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))return true;  /* digitando */
  if(typeof PDV!=='undefined'&&PDV.comanda&&PDV.comanda.length)return true; /* venda em andamento */
  return false;
}
/* avisa que tem novidade, sem atrapalhar */
function marcaNovidade(tem){
  var el=document.getElementById('rtTag');
  if(el)el.classList.toggle('novo',!!tem);
}
/* quando você termina, a tela se atualiza sozinha */
function aplicarPendente(){
  if(!RT.pendenteTela||ocupado())return;
  RT.pendenteTela=false;marcaNovidade(false);
  if(S.mod&&S.it)abrir(S.mod,S.it);
}
setInterval(function(){ if(RT.pendenteTela)aplicarPendente(); },2500);
function pintaTempoReal(){
  var el=document.getElementById('rtTag');
  if(!el)return;
  el.className='rtTag'+(RT.ligado?' on':'');
  el.title=RT.ligado?'Tempo real ligado — mudanças em outros aparelhos aparecem aqui'
                    :'Tempo real desligado';
}
/* enquanto eu gravo, não reajo aos meus próprios avisos */
function pausaTempoReal(ms){
  RT.pausa=true;
  clearTimeout(RT._t);
  RT._t=setTimeout(function(){RT.pausa=false},ms||2500);
}

/* ao voltar para a aba, busca o que mudou enquanto estava fora */
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&NUVEM.ligada){
    if(!RT.ligado)ligarTempoReal();
    agendarRecarga('volta');
  }
});

/* ---------- DIAGNÓSTICO DA CONEXÃO ---------- */
async function testarConexao(){
  var box=$('diagBox');if(!box)return;
  var passos=[];
  function pinta(){
    box.innerHTML='<div class="diagLista">'+passos.map(function(p){
      return '<div class="diagIt '+p.st+'">'+
      '<span class="diagIc">'+(p.st==='ok'?sv('check',12):p.st==='err'?sv('x2',12):sv('ref',12))+'</span>'+
      '<div><b>'+E(p.t)+'</b>'+(p.d?'<small>'+E(p.d)+'</small>':'')+'</div></div>';
    }).join('')+'</div>';
  }
  function passo(t){passos.push({t:t,st:'ir',d:''});pinta();return passos[passos.length-1];}
  function ok(p,d){p.st='ok';p.d=d||'';pinta();}
  function err(p,d){p.st='err';p.d=d||'';pinta();}

  var p1=passo('Acesso à internet');
  try{
    var r0=await fetch(NUVEM.url+'/rest/v1/',{headers:{'apikey':NUVEM.chave}});
    ok(p1,'servidor respondeu ('+r0.status+')');
  }catch(e){
    err(p1,'bloqueado — '+((e&&e.message)||'sem resposta'));
    var p0=passo('Diagnóstico');
    err(p0,'Provável bloqueio por o sistema estar rodando como arquivo baixado (file://). '+
      'Publicando na internet, isso se resolve.');
    return;
  }
  var p2=passo('Leitura de uma tabela');
  try{
    var r1=await fetch(NUVEM.url+'/rest/v1/lojas?select=id,nome&limit=1',
      {headers:{'apikey':NUVEM.chave}});
    var t1=await r1.text();
    if(r1.ok)ok(p2,'tabela acessível (resposta com '+t1.length+' caracteres)');
    else err(p2,'HTTP '+r1.status+' — '+t1.slice(0,120));
  }catch(e){err(p2,(e&&e.message)||'falhou');}

  var p3=passo('Estrutura do banco');
  try{
    var r2=await fetch(NUVEM.url+'/rest/v1/lancamentos_financeiros?select=id&limit=1',
      {headers:{'apikey':NUVEM.chave}});
    if(r2.status===200||r2.status===401||r2.status===403)ok(p3,'tabelas dos módulos existem');
    else err(p3,'HTTP '+r2.status);
  }catch(e){err(p3,(e&&e.message)||'falhou');}

  var p4=passo('Login');
  if(NUVEM.ligada)ok(p4,'conectado como '+(NUVEM.perfil?NUVEM.perfil.nome:'usuário'));
  else{p4.st='ir';p4.d='ainda não conectado — use "Ligar a nuvem" abaixo';pinta();}
}

function precoVigente(p){
  var base=Number(p.preco)||0;
  var pr=(p.promocoes||[]).filter(function(x){return x.ativo&&Number(x.preco)>0});
  if(!pr.length)return base;
  var ag=new Date(),dia=ag.getDay(),hm=agoraHM();
  for(var i=0;i<pr.length;i++){
    var x=pr[i];
    if((x.dias||[]).length&&(x.dias||[]).indexOf(dia)<0)continue;
    if(x.de&&x.ate&&(hm<x.de||hm>x.ate))continue;
    return Number(x.preco);
  }
  return base;
}

function addItem(pid){
  var p=DB.produtos.find(function(x){return x.id===pid});
  var grupos=(p.grupos||[]).map(function(g){return DB.grupos.find(function(x){return x.id===g})}).filter(Boolean);
  if(grupos.length)return modalOpcoes(p,grupos);
  lancar(p,[],1);
}
function lancar(p,opcoes,qtd,obs){
  var extra=opcoes.reduce(function(a,o){return a+(Number(o.preco)||0)},0);
  var unit=precoVigente(p)+extra;
  PDV.comanda.push({produtoId:p.id,nome:p.nome,qtd:qtd,unit:unit,total:unit*qtd,opcoes:opcoes,obs:obs||''});
  renderVenda();
}
function mudarQt(i,d){
  var it=PDV.comanda[i];it.qtd+=d;
  if(it.qtd<1){PDV.comanda.splice(i,1);}else{it.total=it.unit*it.qtd;}
  renderVenda();
}
function remItem(i){PDV.comanda.splice(i,1);renderVenda();}
function obsItem(i){
  var it=PDV.comanda[i];
  var t=prompt('Observação para "'+it.nome+'":',it.obs||'');
  if(t===null)return;it.obs=t;renderVenda();
}
function limparComanda(){
  if(!PDV.comanda.length)return;
  if(!confirm('Limpar todos os itens da comanda?'))return;
  PDV.comanda=[];renderVenda();
}

/* ---------- PERGUNTA FORÇADA ---------- */
function modalOpcoes(p,grupos){
  var h='<div class="mdB">';
  grupos.forEach(function(g,gi){
    h+='<div class="blk" style="margin:0 0 11px;max-width:none">'+
    '<h3>'+E(g.nome)+(g.forcado?' <span class="tagF">obrigatório</span>':'')+
    '<small>escolha de '+(g.min||0)+' a '+(g.max||1)+'</small></h3>';
    if(!(g.opcoes||[]).length)h+='<div class="hint">Sem opções cadastradas neste grupo.</div>';
    /* a pergunta é obrigatória responder, mas a resposta pode ser "não quero" */
    if(g.forcado)
      h+='<label class="chkL semOp"><input type="radio" name="g'+gi+'" class="opNao" '+
      'data-g="'+g.id+'" checked><span><b>Não quero</b>'+
      '<small style="display:block;color:var(--ink-3)">nada é acrescentado ao pedido</small></span></label>';
    (g.opcoes||[]).forEach(function(o,oi){
      h+='<label class="chkL"><input type="'+((g.max||1)>1?'checkbox':'radio')+'" name="g'+gi+'" '+
      'class="opSel" data-g="'+g.id+'" data-i="'+oi+'">'+
      '<span>'+E(o.nome)+(o.preco?' <b style="color:var(--acc-d)">+ R$ '+money(o.preco)+'</b>':'')+'</span></label>';
    });
    h+='</div>';
  });
  h+='<div class="blk" style="margin:0;max-width:none"><div class="row2">'+
  '<div class="fld2" style="margin:0"><label>Observação</label><input id="obsIt" placeholder="ex: sem gelo"></div>'+
  '<div class="fld2" style="margin:0"><label>Quantidade</label><input id="qtIt" type="number" min="1" value="1"></div>'+
  '</div></div></div>';

  modal(p.nome,h,'Adicionar à comanda',function(){
    var esc=[];
    var cks=document.querySelectorAll('.opSel');
    for(var i=0;i<cks.length;i++)if(cks[i].checked){
      var gid=cks[i].getAttribute('data-g');
      var g=grupos.find(function(x){return x.id===gid});
      var o=g.opcoes[cks[i].getAttribute('data-i')];
      esc.push({grupo:g.id,nome:o.nome,preco:o.preco});
    }
    for(var k=0;k<grupos.length;k++){
      var G=grupos[k];
      var qtd=esc.filter(function(e){return e.grupo===G.id}).length;
      /* respondeu "não quero"? então a pergunta está respondida */
      var recusou=false;
      var nao=document.querySelectorAll('.opNao');
      for(var z=0;z<nao.length;z++)
        if(nao[z].getAttribute('data-g')===G.id&&nao[z].checked)recusou=true;
      if(recusou)continue;
      if(G.forcado&&qtd<1){toast('Responda "'+G.nome+'" — escolha uma opção ou marque Não quero.');return false;}
      if((G.min||0)>qtd&&qtd>0){toast('"'+G.nome+'" exige no mínimo '+G.min+'.');return false;}
      if(qtd>(G.max||1)){toast('"'+G.nome+'" permite no máximo '+G.max+'.');return false;}
    }
    lancar(p,esc,parseInt($('qtIt').value)||1,$('obsIt').value);
    return true;
  },'lg');
}

  modal('Identificar cliente',h,'Fechar',function(){return true});
  var inp=$('cliB');
  function lista(q){
    var d=soDigitos(q);
    var r=(DB.clientes||[]).filter(function(c){
      if(!q)return true;
      if(d)return soDigitos(c.tel).indexOf(d)>=0;
      return c.nome.toLowerCase().indexOf(q.toLowerCase())>=0;
    });

      '<div style="font-size:11px;color:var(--ink-3)">'+E(c.nome)+' · '+(c.compras||0)+' compras · ticket R$ '+
      money(c.compras?(c.gasto/c.compras):0)+'</div></span></label>';

    if(!r.length&&d.length>=8){
      h2='<div class="avisoCfg" style="margin-top:4px">'+sv('help',15)+
      '<div>Nenhum cliente com este telefone. Clique em <b>Cadastrar novo cliente</b> — o telefone já vai preenchido.</div></div>';
    }else if(!r.length){h2='<div class="hint">Digite o telefone para localizar.</div>';}
    $('cliRes').innerHTML=h2;
  }
  lista('');
  inp.oninput=function(){lista(this.value.trim());};
  inp.focus();
