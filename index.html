<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jolô Gelato — Delivery</title>
<meta name="description" content="Gelato artesanal feito para valer a pena. Peça pelo delivery ou retire na loja.">
<meta property="og:title" content="Jolô Gelato — Delivery">
<meta property="og:image" content="img/capa.jpg">
<link rel="icon" href="img/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#2F4A32; --verde-c:#3D6142; --verde-e:#1C2E1F; --verde-cl:#5C8560;
  --creme:#F7F3EA; --creme-2:#EFE8DA; --areia:#DFD3BC; --dourado:#B08D57;
  --ink:#1B2419; --ink-2:#4B5849; --ink-3:#8B9389;
  --branco:#FFFDF8; --linha:#E5DCCB;
  --sh:0 1px 3px rgba(27,36,25,.06),0 6px 20px rgba(27,36,25,.05);
  --sh-h:0 4px 12px rgba(27,36,25,.09),0 16px 40px rgba(27,36,25,.09);
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--creme);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}

/* ================== TOPO ================== */
.topo{position:sticky;top:0;z-index:50;background:rgba(255,253,248,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--linha)}
.topoIn{max-width:1180px;margin:0 auto;padding:0 24px;height:66px;display:flex;align-items:center;gap:18px}
.marca{display:flex;align-items:center;gap:11px}
.marca img{width:38px;height:38px;border-radius:9px;object-fit:cover}
.marca b{font-family:Fraunces,serif;font-size:19px;color:var(--verde);letter-spacing:.04em}
.marca span{display:block;font-size:10px;color:var(--ink-3);letter-spacing:.14em;text-transform:uppercase}
.statusP{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);
  background:var(--creme-2);border-radius:20px;padding:7px 14px}
.pt{width:7px;height:7px;border-radius:50%;background:#4FA362;flex:none;
  box-shadow:0 0 0 3px rgba(79,163,98,.18)}
.pt.off{background:#C7705A;box-shadow:0 0 0 3px rgba(199,112,90,.18)}
.lojaSel{margin-left:auto;display:flex;align-items:center;gap:8px;border:1px solid var(--linha);
  border-radius:20px;padding:7px 15px;font-size:13.5px;font-weight:500;transition:.15s}
.lojaSel:hover{border-color:var(--verde-cl);background:var(--branco)}
.btSac{display:flex;align-items:center;gap:9px;background:var(--verde);color:#fff;
  border-radius:20px;padding:9px 17px;font-size:13.5px;font-weight:600;transition:.15s}
.btSac:hover{background:var(--verde-e)}
.btSac .n{background:rgba(255,255,255,.22);border-radius:9px;padding:1px 8px;font-size:12px}

/* ================== CAPA ================== */
.hero{position:relative;height:340px;overflow:hidden;background:var(--verde-e)}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.5}
.hero:after{content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(28,46,31,.42) 0%,rgba(28,46,31,.78) 62%,var(--creme) 100%)}
.heroIn{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;padding:24px}
.heroLogo{width:118px;background:var(--creme);border-radius:14px;padding:12px 15px;
  box-shadow:0 18px 44px rgba(0,0,0,.28)}
.heroIn h1{margin:20px 0 6px;font-size:34px;color:#fff;font-weight:600}
.heroIn p{margin:0;font-size:14px;color:rgba(255,255,255,.76);letter-spacing:.1em;
  text-transform:uppercase}
.heroTags{display:flex;gap:9px;margin-top:20px;flex-wrap:wrap;justify-content:center}
.heroTag{background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border-radius:18px;
  padding:6px 14px;font-size:12.5px;color:#fff;border:1px solid rgba(255,255,255,.16)}

/* ================== ESCOLHA DE LOJA ================== */
.centro{max-width:1180px;margin:0 auto;padding:0 24px}
.telaLojas{padding:56px 24px 80px;max-width:900px;margin:0 auto}
.tl-h{text-align:center;margin-bottom:36px}
.tl-h h2{margin:0 0 8px;font-size:29px;color:var(--verde)}
.tl-h p{margin:0;font-size:15px;color:var(--ink-3)}
.lojasG{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.lojaC{text-align:left;background:var(--branco);border:1px solid var(--linha);
  border-radius:var(--r);padding:24px;transition:.18s;position:relative;overflow:hidden}
.lojaC:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--verde-cl);
  opacity:0;transition:.18s}
.lojaC:hover{border-color:var(--verde-cl);transform:translateY(-3px);box-shadow:var(--sh-h)}
.lojaC:hover:before{opacity:1}
.lojaIc{width:48px;height:48px;border-radius:13px;background:var(--creme-2);color:var(--verde);
  display:flex;align-items:center;justify-content:center;margin-bottom:15px}
.lojaC b{display:block;font-family:Fraunces,serif;font-size:19px;margin-bottom:5px}
.lojaC .end{display:block;font-size:13.5px;color:var(--ink-3);margin-bottom:14px}
.lojaC .rod{display:flex;align-items:center;gap:10px;padding-top:14px;border-top:1px solid var(--linha)}
.pill{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:12px;
  background:#EAF3EC;color:#33693F}
.pill.off{background:#F8ECE7;color:#A55A42}
.lojaC .seta{margin-left:auto;color:var(--verde-cl);font-size:19px}

/* ================== CATEGORIAS ================== */
.catBar{position:sticky;top:66px;z-index:44;background:rgba(247,243,234,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--linha)}
.catIn{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;gap:9px;
  overflow-x:auto;scrollbar-width:none}
.catIn::-webkit-scrollbar{display:none}
.catB{padding:9px 18px;border-radius:20px;background:var(--branco);border:1px solid var(--linha);
  color:var(--ink-2);font-size:13.5px;white-space:nowrap;font-weight:500;transition:.15s}
.catB:hover{border-color:var(--verde-cl)}
.catB.on{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:600}

/* ================== PRODUTOS ================== */
.secao{max-width:1180px;margin:0 auto;padding:44px 24px 0}
.secH{display:flex;align-items:baseline;gap:14px;margin-bottom:22px}
.secH h3{margin:0;font-size:25px;color:var(--verde)}
.secH span{font-size:13.5px;color:var(--ink-3)}
.secH:after{content:'';flex:1;height:1px;background:var(--linha)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:18px}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--r);
  overflow:hidden;transition:.2s;text-align:left;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-h);border-color:var(--areia)}
.cardF{height:186px;background:var(--creme-2);position:relative;overflow:hidden;flex:none}
.cardF img{width:100%;height:100%;object-fit:cover;transition:.35s}
.card:hover .cardF img{transform:scale(1.05)}
.semF{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--creme-2),var(--areia));color:var(--verde);opacity:.35}
.semF svg{width:52px;height:52px}
.cardB{padding:17px 18px 18px;flex:1;display:flex;flex-direction:column}
.cardB b{font-family:Fraunces,serif;font-size:17.5px;display:block;margin-bottom:5px;line-height:1.3}
.cardB p{margin:0 0 14px;font-size:13.5px;color:var(--ink-3);line-height:1.55;flex:1;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cardR{display:flex;align-items:center;gap:12px}
.preco{font-size:19px;font-weight:700;color:var(--verde-c);font-family:Fraunces,serif}
.addB{margin-left:auto;width:38px;height:38px;border-radius:11px;background:var(--verde);
  color:#fff;display:flex;align-items:center;justify-content:center;font-size:21px;
  transition:.15s;flex:none}
.card:hover .addB{background:var(--verde-e);transform:scale(1.06)}

/* ================== PAINEL ================== */
.ov{position:fixed;inset:0;background:rgba(27,36,25,.5);backdrop-filter:blur(3px);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .16s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.pnl{background:var(--branco);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;
  border-radius:20px;animation:sobe .2s cubic-bezier(.2,.8,.3,1);box-shadow:0 30px 80px rgba(0,0,0,.3)}
.pnl.g{max-width:660px}
@keyframes sobe{from{transform:translateY(16px) scale(.98);opacity:.5}to{transform:none;opacity:1}}
.pnlH{position:sticky;top:0;background:var(--branco);padding:20px 24px 15px;
  border-bottom:1px solid var(--linha);display:flex;align-items:center;gap:14px;z-index:5}
.pnlH b{flex:1;font-family:Fraunces,serif;font-size:19px}
.fechar{width:34px;height:34px;border-radius:50%;background:var(--creme-2);color:var(--ink-2);
  font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s}
.fechar:hover{background:var(--areia)}
.pnlB{padding:22px 24px 26px}
.pnlF{position:sticky;bottom:0;background:var(--branco);padding:16px 24px 20px;
  border-top:1px solid var(--linha)}
.btnV{width:100%;background:var(--verde);color:#fff;border-radius:12px;padding:15px;
  font-size:15px;font-weight:600;transition:.15s}
.btnV:hover:not(:disabled){background:var(--verde-e)}
.btnV:disabled{background:var(--areia);color:#fff;cursor:default}
.btnL{width:100%;background:var(--creme-2);color:var(--ink-2);border-radius:12px;
  padding:13px;font-size:14px;font-weight:600;margin-top:9px}
.fotoP{width:100%;height:230px;object-fit:cover;border-radius:13px;margin-bottom:18px}

.gr{margin-bottom:24px}
.grH{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.grH b{font-size:15px;font-weight:600}
.grH span{font-size:11px;background:var(--creme-2);color:var(--ink-3);border-radius:10px;
  padding:3px 10px;font-weight:600;letter-spacing:.03em}
.grH span.ob{background:#F6EDE2;color:#95602C}
.op{display:flex;align-items:center;gap:12px;padding:12px 15px;border:1.5px solid var(--linha);
  border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.14s}
.op:hover{border-color:var(--verde-cl)}
.op.on{border-color:var(--verde);background:#F3F7F3}
.op input{width:19px;height:19px;accent-color:var(--verde);flex:none}
.op .nm{flex:1;font-size:14.5px}
.op .pr{font-size:14px;color:var(--verde-c);font-weight:600}

.cp{margin-bottom:16px}
.cp label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.cp input,.cp select,.cp textarea{width:100%;border:1.5px solid var(--linha);border-radius:11px;
  padding:13px 14px;background:var(--branco);outline:none;transition:.14s}
.cp input:focus,.cp select:focus,.cp textarea:focus{border-color:var(--verde-cl);
  box-shadow:0 0 0 3px rgba(92,133,96,.1)}
.cp .dica{font-size:12px;color:var(--ink-3);margin-top:5px}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.esc{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:20px}
.escB{padding:16px 14px;border:1.5px solid var(--linha);border-radius:13px;
  text-align:center;font-size:14px;font-weight:600;color:var(--ink-2);transition:.14s}
.escB:hover{border-color:var(--verde-cl)}
.escB.on{border-color:var(--verde);background:#F3F7F3;color:var(--verde)}
.escB small{display:block;font-size:11.5px;font-weight:400;color:var(--ink-3);margin-top:3px}

.si{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--linha)}
.si:last-child{border-bottom:none}
.siF{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--creme-2)}
.siT{flex:1}
.siT b{display:block;font-size:14.5px}
.siT small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px;line-height:1.5}
.siV{text-align:right;font-weight:700;font-size:15px;white-space:nowrap}
.qtd{display:flex;align-items:center;gap:12px;margin-top:9px}
.qtd button{width:29px;height:29px;border-radius:9px;background:var(--creme-2);color:var(--verde);
  font-size:17px;display:flex;align-items:center;justify-content:center;transition:.14s}
.qtd button:hover{background:var(--areia)}
.qtd b{font-size:14.5px;min-width:20px;text-align:center}
.tot{display:flex;justify-content:space-between;padding:10px 0;font-size:14.5px;color:var(--ink-2)}
.tot.f{font-size:19px;font-weight:700;color:var(--ink);border-top:1.5px solid var(--linha);
  margin-top:7px;padding-top:15px;font-family:Fraunces,serif}
.resumo{background:var(--creme);border-radius:13px;padding:17px;margin-top:18px;font-size:14px;line-height:1.7}
.resumo b.tit{display:block;margin-bottom:9px;color:var(--verde);font-family:Fraunces,serif;font-size:15px}

.vazio{text-align:center;padding:70px 24px;color:var(--ink-3)}
.vazio svg{width:56px;height:56px;opacity:.3;margin:0 auto 16px;color:var(--verde)}
.aviso{background:#FBF5E9;border:1px solid #E9DCC2;border-radius:12px;padding:14px 16px;
  font-size:13px;color:#7E6330;margin-bottom:18px;line-height:1.6}
.ok{text-align:center;padding:80px 24px;max-width:520px;margin:0 auto}
.okIc{width:82px;height:82px;border-radius:50%;background:#EAF3EC;color:#33693F;
  display:flex;align-items:center;justify-content:center;margin:0 auto 22px}
.ok h2{margin:0 0 10px;font-size:29px;color:var(--verde)}
.ok p{margin:0 0 7px;font-size:15px;color:var(--ink-2)}
.rodape{margin-top:70px;padding:44px 24px;background:var(--verde-e);color:rgba(255,255,255,.62);
  text-align:center;font-size:12.5px;line-height:1.9}
.rodape img{width:58px;margin:0 auto 16px;border-radius:8px;opacity:.9}
.rodape b{color:#fff;font-family:Fraunces,serif;font-size:16px;display:block;margin-bottom:5px}
.carregando{padding:110px 24px;text-align:center;color:var(--ink-3)}
.spin{width:30px;height:30px;border:3px solid var(--areia);border-top-color:var(--verde);
  border-radius:50%;margin:0 auto 16px;animation:gira .7s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ================== CELULAR ================== */
@media(max-width:760px){
  .topoIn{padding:0 16px;height:60px;gap:11px}
  .marca b{font-size:17px}
  .statusP{display:none}
  .lojaSel{padding:6px 12px;font-size:12.5px}
  .btSac{padding:8px 13px;font-size:12.5px}
  .hero{height:280px}
  .heroIn h1{font-size:27px}
  .heroLogo{width:100px}
  .catIn{padding:12px 16px}
  .secao{padding:32px 16px 0}
  .secH h3{font-size:21px}
  .grade{grid-template-columns:1fr;gap:12px}
  .card{flex-direction:row}
  .cardF{width:118px;height:auto;min-height:118px}
  .cardB{padding:14px 15px}
  .cardB b{font-size:15.5px}
  .cardB p{-webkit-line-clamp:2;font-size:12.5px;margin-bottom:10px}
  .preco{font-size:17px}
  .addB{width:34px;height:34px}
  .telaLojas{padding:36px 16px 60px}
  .tl-h h2{font-size:24px}
  .lojasG{grid-template-columns:1fr}
  .ov{padding:0;align-items:flex-end}
  .pnl{max-height:92vh;border-radius:20px 20px 0 0}
  .pnlB{padding:20px 18px 24px}
  .pnlH,.pnlF{padding-left:18px;padding-right:18px}
}
</style>
</head>
<body>
<div id="app"><div class="carregando"><div class="spin"></div>carregando o cardápio...</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="cardapio.js?v=123"></script>
</body>
</html>
